---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# FREE tier — public data ONLY (free tiers log prompts, may train on them).
# NEVER a fallback for other pools — private traffic must not reach here.
# Groq: fast, 14400 req/min free tier.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: free-groq-llama33
spec:
  modelName: free-pool
  proxyRef: litellm
  params:
    model: groq/llama-3.3-70b-versatile
    apiKey: os.environ/GROQ_API_KEY
    additional:
      order: 1
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Google AI Studio free tier: ~15 RPM, 1M tokens/day for Flash.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: free-gemini-flash
spec:
  modelName: free-pool
  proxyRef: litellm
  params:
    model: gemini/gemini-2.0-flash
    apiKey: os.environ/GEMINI_API_KEY
    additional:
      order: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 8192
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# OpenRouter free models — rotating, always last. Check pricing before adding.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: free-openrouter
spec:
  modelName: free-pool
  proxyRef: litellm
  params:
    model: openrouter/auto
    apiKey: os.environ/OPENROUTER_API_KEY
    additional:
      order: 99
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 8192
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
