---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embed-tei
spec:
  modelName: embed
  proxyRef: litellm
  params:
    model: openai/BAAI/bge-m3
    apiBase: http://text-embeddings-inference.ai.svc.cluster.local:8080/v1
  info:
    mode: embedding
    maxInputTokens: 8192
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
