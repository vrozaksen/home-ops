---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kanidm-provision-groups
  labels:
    kanidm_config: "1"
  annotations:
    reloader.stakater.com/match: "true"
data:
  # Mirrors the terraform/authentik group hierarchy. Members are added during bootstrap
  # (kanidm group add-members ...) or declared here once usernames are known.
  groups.json: |-
    {
      "groups": {
        "pending":        { "present": true, "members": [], "overwriteMembers": false },
        "users":          { "present": true, "members": [], "overwriteMembers": false },
        "admins":         { "present": true, "members": [], "overwriteMembers": false },
        "ff":             { "present": true, "members": [], "overwriteMembers": false },
        "household":      { "present": true, "members": [], "overwriteMembers": false },
        "omnichassis":    { "present": true, "members": [], "overwriteMembers": false },
        "fleet-owner":      { "present": true, "members": ["vrozaksen"], "overwriteMembers": false },
        "fleet-technician": { "present": true, "members": [], "overwriteMembers": false },
        "fleet-viewer":     { "present": true, "members": [], "overwriteMembers": false },
        "engineering-owner":    { "present": true, "members": ["vrozaksen"], "overwriteMembers": false },
        "engineering-engineer": { "present": true, "members": [], "overwriteMembers": false },
        "engineering-viewer":   { "present": true, "members": [], "overwriteMembers": false },
        "mcp_full": { "present": true, "members": ["vrozaksen"], "overwriteMembers": false },
        "mcp_web":  { "present": true, "members": ["claudeai"], "overwriteMembers": false }
      },
      "persons": {
        "claudeai": { "present": true, "displayName": "claude.ai MCP connector", "mailAddresses": ["claudeai@vzkn.eu"] }
      },
      "systems": { "oauth2": {} }
    }
