---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Separate from github-webhook-token-secret so a missing key cannot break the
# live GitHub receiver. Same value goes to GitHub secret FLUX_OCI_RECEIVER_TOKEN.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name flux-oci-receiver-token
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/flux-system/flux-instance
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: flux-system
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          token: '{{ .FLUX_OCI_RECEIVER_TOKEN.Value }}'
