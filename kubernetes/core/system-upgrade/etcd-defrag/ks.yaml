---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-defrag
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: etcd-defrag
  interval: 1h
  path: ./kubernetes/core/system-upgrade/etcd-defrag
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: system-upgrade
