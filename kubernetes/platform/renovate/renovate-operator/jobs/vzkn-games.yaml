---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: vzkn-games
spec:
  # Separate job: an org installation of the GitHub App has its own installation ID.
  discoveryFilters:
    - "vzkn-games/*"
  provider:
    name: github
  image: ghcr.io/renovatebot/renovate:45.3.2@sha256:03574aa8ce69bfd39c13cbc9ab9599ded5c0f4772481914ddcfd920882305240
  schedule: "30 * * * *"
  parallelism: 1
  githubAppReference:
    secretName: repo-killer-app-secret
    appIdSecretKey: GITHUB_APP_ID
    installationIdSecretKey: INSTALL_ID_VZKN_GAMES
    pemSecretKey: private-key.pem
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_PLATFORM_COMMIT
      value: enabled
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
