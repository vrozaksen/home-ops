---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Proves the OCI source end to end (pull, verify, build, apply) without touching
# real workloads. Remove after the cutover (HOPS-65).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-oci-canary
spec:
  interval: 10m
  path: ./kubernetes/core/flux-system/flux-instance/oci-canary
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
