---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      trek:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/mauriceboe/trek
              repository: docker.io/mauriceboe/trek
              tag: 4.3.0@sha256:3521a3a2f121f59c3a30253a8f34fc7941a41ea73e8a6450769ae60e81f1de2a
            env:
              NODE_ENV: production
              PORT: &port 3000
              TZ: Europe/Warsaw
              DEFAULT_LANGUAGE: pl
              # Required with OIDC on: the redirect URI is built from it and
              # must match what Kanidm has registered.
              APP_URL: &url https://trek.vzkn.eu
              ALLOWED_ORIGINS: *url
              FORCE_HTTPS: "true"
              # FORCE_HTTPS is a no-op unless the proxy count is set -- one hop,
              # the envoy-internal gateway.
              TRUST_PROXY: "1"
              # AirTrail sync targets a ClusterIP, and TREK blocks outbound
              # RFC-1918 by default, which would silently break the integration.
              ALLOW_INTERNAL_NETWORK: "true"
              OIDC_ISSUER: https://idm.vzkn.eu/oauth2/openid/trek
              OIDC_DISPLAY_NAME: Kanidm
              # groups is not in the default scope set, and OIDC_ADMIN_CLAIM
              # reads exactly that claim.
              OIDC_SCOPE: openid email profile groups
              OIDC_ADMIN_CLAIM: groups
              # Kanidm returns groups as SPNs, not bare names.
              OIDC_ADMIN_VALUE: admins@idm.vzkn.eu
              OIDC_ONLY: "true"
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-trek-oidc
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-trek-oidc
                    key: client-secret
            envFrom:
              - secretRef:
                  name: trek-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              # Mirrors upstream's compose: the image drops privileges itself,
              # so it needs these three caps but nothing else, and runs happily
              # on a read-only rootfs given a writable /tmp.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: trek
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: self-hosted
        hostnames:
          - trek.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: trek
        globalMounts:
          - path: /app/data
            subPath: data
          - path: /app/uploads
            subPath: uploads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
