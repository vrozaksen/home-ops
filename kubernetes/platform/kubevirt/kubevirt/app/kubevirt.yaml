---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    # VMs on RWO ceph-block cannot live-migrate; without this a VM's PDB
    # would block node drains (reboot-node, tuppr). The VM restarts elsewhere.
    evictionStrategy: None
    # Talos defaults every pod to RuntimeDefault seccomp, which denies unprivileged
    # user namespaces; passt (passtBinding) always sandboxes itself in one and dies
    # with "Couldn't create user namespace: Operation not permitted". kubevirt.json
    # is installed on each node by virt-handler and allows it (still baseline-PSA ok).
    seccompConfiguration:
      virtualMachineInstanceProfile:
        customProfile:
          localhostProfile: kubevirt/kubevirt.json
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  # virt-api/controller/exportproxy off the 12Gi control-plane nodes.
  infra:
    nodePlacement:
      nodeSelector:
        topology.kubernetes.io/zone: worker
  # virt-operator creates the ServiceMonitor and PrometheusRule (KubeVirt alerts).
  monitorAccount: kube-prometheus-stack-prometheus
  monitorNamespace: observability
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  workloadUpdateStrategy: {}
