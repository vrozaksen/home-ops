---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Omnichassis bench secrets for agents, as files under /etc/dk2-hil: SSH key for user hil
# on the DK2 HIL box (10.100.0.105) and the UDS tester master key.
# File mount only; the RAUC signing key stays in Infisical until bundles are built in-cluster.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name multica-agent-dk2
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /omnichassis
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          dk2-hil-ssh-key: '{{ .DK2_HIL_SSH_KEY.Value }}'
          # UDS SecurityAccess/FOTA tests on bench ECUs; agents never get an Infisical login.
          omni-tester-master-key: '{{ .OMNI_TESTER_MASTER_KEY.Value }}'
