---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Vendored from https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.1/cdi-operator.yaml
  # (GitHub release downloads time out and block flux-publish). On a version
  # bump, re-download the file from the URL above.
  - cdi-operator.yaml
patches:
  # The namespace is owned by ../../namespace.yaml (prune disabled).
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cdi
  # Idle usage is ~4m; upstream requests 100m.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
    target:
      kind: Deployment
      name: cdi-operator
