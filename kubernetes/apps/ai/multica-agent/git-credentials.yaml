---
# GitHub App "vzkn-agents" (id 5384873): agents push branches and open PRs on home-ops.
# main is protected by a ruleset (PR required); the App is not on its bypass list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: multica-agent-git
data:
  gh-app-token.mjs: |-
    // Mints a short-lived GitHub App installation token for vrozaksen/home-ops.
    // `node gh-app-token.mjs` prints the token; `node gh-app-token.mjs get` speaks the git credential protocol.
    import { createSign } from "node:crypto";
    import { readFileSync, writeFileSync } from "node:fs";

    const appId = process.env.GITHUB_APP_ID || "5384873";
    const keyFile = process.env.GITHUB_APP_KEY_FILE || "/etc/agent-secrets/github-app-key.pem";
    const repo = process.env.GITHUB_APP_REPO || "vrozaksen/home-ops";
    const cache = `/tmp/gh-app-token-$${appId}.json`;
    const mode = process.argv[2];
    if (mode && mode !== "get") process.exit(0); // git also calls store/erase

    const b64 = (x) => Buffer.from(typeof x === "string" ? x : JSON.stringify(x)).toString("base64url");
    async function token() {
      try {
        const c = JSON.parse(readFileSync(cache, "utf8"));
        if (Date.parse(c.expires_at) - Date.now() > 5 * 60 * 1000) return c.token;
      } catch {}
      const now = Math.floor(Date.now() / 1000);
      const unsigned = `$${b64({ alg: "RS256", typ: "JWT" })}.$${b64({ iat: now - 60, exp: now + 540, iss: appId })}`;
      const jwt = `$${unsigned}.$${createSign("RSA-SHA256").update(unsigned).sign(readFileSync(keyFile, "utf8"), "base64url")}`;
      const gh = (path, method = "GET") => fetch(`https://api.github.com$${path}`, {
        method, headers: { Authorization: `Bearer $${jwt}`, Accept: "application/vnd.github+json", "User-Agent": "vzkn-agents" },
      }).then(async (r) => { if (!r.ok) throw new Error(`$${path}: $${r.status} $${await r.text()}`); return r.json(); });
      const inst = await gh(`/repos/$${repo}/installation`);
      const t = await gh(`/app/installations/$${inst.id}/access_tokens`, "POST");
      try { writeFileSync(cache, JSON.stringify({ token: t.token, expires_at: t.expires_at }), { mode: 0o600 }); } catch {}
      return t.token;
    }
    const t = await token();
    process.stdout.write(mode === "get" ? `username=x-access-token\npassword=$${t}\n` : t);
  ghx: |-
    #!/bin/sh
    # gh with a fresh App installation token: `ghx pr create ...`
    GH_TOKEN=$(node /etc/github-app-bin/gh-app-token.mjs) exec gh "$@"
  forgejo-cred: |-
    #!/bin/sh
    # git credential helper for the Forgejo bot; token from a file, never env.
    test "$1" = get && echo username=vzkn-agents && echo "password=$(cat /etc/agent-secrets/forgejo-bot-token)"
