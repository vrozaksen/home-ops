---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stalwart
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/self-hosted/stalwart
  postBuild:
    substitute:
      APP: *app
      NS: &ns self-hosted
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
