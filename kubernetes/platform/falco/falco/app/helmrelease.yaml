---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: falco
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 9.1.0
  url: oci://ghcr.io/falcosecurity/charts/falco
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: falco
  values:
    controller:
      kind: daemonset

    # No kernel module or driver build, which Talos cannot provide.
    driver:
      enabled: true
      kind: modern_ebpf

    collectors:
      enabled: true
      docker:
        enabled: false
      containerd:
        enabled: true
        socket: /run/containerd/containerd.sock
      crio:
        enabled: false

    # SecureBoot pins the control planes to lockdown=confidentiality, which
    # withholds the BPF kernel-read helpers Falco needs. Workers only.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    # Periodic snapshot, so health only. Incident alerting goes via
    # falcosidekick -> Alertmanager, which is event-driven.
    metrics:
      enabled: true
      interval: 15m
      rulesCountersEnabled: true
      resourceUtilizationEnabled: true
      convertMemoryToMB: true

    serviceMonitor:
      create: true
      interval: 30s

    falco:
      json_output: true
      json_include_output_property: true
      log_level: info
      # Drop the noisiest tiers at the source.
      priority: notice
      buffered_outputs: true
      syscall_event_drops:
        actions:
          - log
          - alert
        rate: 0.03333
        max_burst: 1

    # Stock rule fires Critical on every CNI plugin exec and on buildkit's
    # qemu-check. Except those rather than disabling the rule.
    customRules:
      overrides.yaml: |-
        - rule: Drop and execute new binary in container
          override:
            exceptions: append
          exceptions:
            - name: cni_plugins
              fields: [proc.exepath]
              comps: [startswith]
              values:
                - [/opt/cni/bin/]
            - name: buildkit_qemu_check
              fields: [proc.pname, proc.name]
              comps: [=, =]
              values:
                - [buildkitd, check]

    falcoctl:
      artifact:
        install:
          enabled: true
        follow:
          enabled: true
      config:
        artifact:
          allowedTypes:
            - rulesfile
          install:
            refs:
              - falco-rules:4
          follow:
            refs:
              - falco-rules:4

    falcosidekick:
      enabled: true
      replicaCount: 1
      webui:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      config:
        debug: false
        customfields: "cluster:main"
        alertmanager:
          hostport: http://alertmanager-operated.observability.svc.cluster.local:9093
          # Alertmanager removed the v1 API in 0.27 — v2 is required.
          endpoint: /api/v2/alerts
          # notice maps to info, which the route blackholes — sending it only
          # fills Alertmanager. Notice-level findings stay in the pod logs.
          minimumpriority: warning
          extralabels: "category:security,component:falco"
          # Output fields become labels, so events never deduplicate.
          expireafter: "3600"
          # Upstream emits `information`, which matches no route here.
          # Only emergency/alert/critical page loudly.
          customseveritymap: "emergency:critical,alert:critical,critical:critical,error:warning,warning:warning,notice:info,informational:info,debug:info"
