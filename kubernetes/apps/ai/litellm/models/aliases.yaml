---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Assistant alias — tool calling / JSON tasks (Home Assistant, APIs).
# Local first (local-pool.yaml), Haiku fallback. Local pricing = electricity marginal cost.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: assistant-local
spec:
  modelName: assistant
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://10.100.0.102:9292/v1
    apiKey: not-needed
    additional:
      timeout: 600
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 65536
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 1e-06
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: assistant-haiku
spec:
  modelName: assistant
  proxyRef: litellm
  params:
    model: anthropic/claude-haiku-4-5
    apiKey: os.environ/ANTHROPIC_API_KEY
    additional:
      order: 2
  info:
    mode: chat
    maxInputTokens: 200000
    maxOutputTokens: 64000
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 1e-06
      output_cost_per_token: 5e-06
