---
# yaml-language-server: $schema=https://schemas.vzkn.eu/notification.toolkit.fluxcd.io/receiver_v1.json
# Called by the last step of flux-publish.yaml, after the artifact is signed and
# tagged. A GitHub push hook would fire before the artifact exists.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: flux-system-oci
spec:
  type: generic-hmac
  secretRef:
    name: flux-oci-receiver-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      name: flux-system
      namespace: flux-system
