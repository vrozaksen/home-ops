# Overrides only. Cowrie reads cowrie.cfg.dist first, then this file.

[honeypot]
# Nothing that hints at what this is: an attacker who realises it is a honeypot
# simply leaves, and the whole point is to watch what they try.
hostname = srv-db01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
# Shell emulation only -- a "successful" login never reaches the real host.
backend = shell

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# IoT botnets hammer telnet as hard as ssh, and it costs one section.
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
