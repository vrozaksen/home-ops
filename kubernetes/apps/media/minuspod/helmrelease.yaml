---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minuspod
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minuspod:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/ttlequals0/minuspod
              repository: docker.io/ttlequals0/minuspod
              # -cpu variant: the default tag bundles ~9GB of NVIDIA/CUDA
              # wheels that nothing here can use.
              tag: 2.97.10-cpu@sha256:a5604e3030aed2e24d78f6474da7d2f87ebe2d95320b23f7bd558c3de97610d4
            env:
              TZ: Europe/Warsaw
              BASE_URL: https://minuspod.vzkn.eu
              MINUSPOD_PORT: &port 8000
              # The LLM that locates ad segments in the transcript. Key comes
              # from Infisical; model choice is made in the UI.
              LLM_PROVIDER: anthropic
              # Transcription goes to the shared whisper deployment in `ai`.
              # In-process faster-whisper on CPU is what OOM-killed this pod: it
              # pins batch_size=8 with no way to lower it (the halving retry is
              # CUDA-only) and upstream asks for 8GB for a sub-hour episode.
              WHISPER_BACKEND: openai-api
              WHISPER_API_BASE_URL: http://whisper.ai.svc.cluster.local:8765/v1
              # whisper.cpp serves whatever model it was started with and
              # ignores this, but the app requires a value.
              WHISPER_API_MODEL: whisper-1
              # Keeps the app from initialising a local model at all.
              WHISPER_DEVICE: cpu
              # The feeds are a mix of English and Polish, so nothing is pinned.
              # Seeded setting: also set Language = auto in Settings >
              # Transcription, or the DB's `en` keeps winning.
              WHISPER_LANGUAGE: auto
              # whisper.cpp takes the 16kHz mono WAV directly; the FLAC encode
              # only exists to keep uploads small for cloud APIs.
              SKIP_FLAC_COMPRESSION: "true"
              # whisper.cpp serialises requests behind a single context, so four
              # parallel chunks only queue up and risk the 600s API timeout.
              # Also DB-seeded: set Concurrent chunks = 3 (one per replica) in
              # Settings > Transcription.
              TRANSCRIBE_CONCURRENT_CHUNKS: "3"
              MINUSPOD_REQUIRE_AUTH: "true"
              # No OIDC support -- this app has its own login only.
              MINUSPOD_ALLOW_PUBLIC_PROCESSING: "false"
              # Without this the real client IP never reaches the app, so login
              # lockout and per-IP rate limits silently never fire. One hop.
              MINUSPOD_TRUSTED_PROXY_COUNT: "1"
              MINUSPOD_ENABLE_HSTS: "true"
              SESSION_COOKIE_SECURE: "auto"
            envFrom:
              - secretRef:
                  name: minuspod-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              # entrypoint.sh fixes volume ownership as root, then drops to the
              # bundled minuspod user (1000) with setpriv.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              # Whisper moved out; what is left is ffmpeg splicing and the whole
              # transcript in the LLM step. Headroom over the old 4Gi so a long
              # episode cannot repeat the OOM.
              limits:
                memory: 6Gi
    defaultPodOptions:
      # Transcoding a backlog must not be interrupted mid-episode.
      terminationGracePeriodSeconds: 360
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: minuspod
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: media
        hostnames:
          - minuspod.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        # The UI lives under /ui/ and nothing is served at /, which just 404s.
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/
                  statusCode: 302
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: minuspod
                port: 8000
    persistence:
      data:
        existingClaim: minuspod
        globalMounts:
          - path: /app/data
