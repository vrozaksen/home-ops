---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Required keys: BETTER_AUTH_SECRET, PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
# Optional keys: OPENAI_API_KEY
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name paperclip-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/paperclip
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET.Value }}"
          PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "{{ .PAPERCLIP_TOOL_ACTION_SIGNING_SECRET.Value }}"
          OPENAI_API_KEY: "{{ .OPENAI_API_KEY.Value }}"
          MEMINI_API_KEY: "{{ .MEMINI_API_KEY.Value }}"
          FORGEJO_BOT_TOKEN: "{{ .FORGEJO_BOT_TOKEN.Value }}"
