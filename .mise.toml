[env]
# File paths
KUBECONFIG = "{{ get_env(name='KUBECONFIG', default=config_root ~ '/kubeconfig') }}"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
KANIDM_URL = "https://idm.vzkn.eu"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

_.file = ["{{config_root}}/.secrets.env"]

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
flux2 = "2.9.6"
helm = "4.3.1"
helmfile = "1.8.2"
infisical = "0.44.6"
jq = "1.8.2"
just = "1.59.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
shellcheck = "0.11.0"
talosctl = "1.14.4"
task = "3.54.0"
uv = "latest"
yamlfmt = "0.21.0"
zizmor = "1.31.1"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "3.0.1"
"pipx:flux-local" = "8.4.0"
