---
endpoints:
  - name: bifrost | ping
    group: vps
    url: icmp://${VPS_IP}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: bifrost | edge
    group: vps
    url: https://twnl.vzkn.eu
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: bifrost | iroh relay
    group: vps
    url: https://relay.towonel.vzkn.eu/healthz
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  # Plain :80 path (caddy-l4 -> towonel edge -> envoy-external) that ACME HTTP-01
  # depends on. Can't catch per-source-IP drops (CrowdSec CAPI), only full outages.
  - name: bifrost | http :80
    group: vps
    url: http://omnichassis.dev/
    interval: 5m
    client:
      ignore-redirect: true
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 301"

  # shortlived profile = 160h, renewal at 2/3 leaves ~53h; <36h = renewal stuck ~17h
  - name: omnichassis.dev | cert
    group: vps
    url: https://omnichassis.dev/
    interval: 1h
    ui:
      hide-url: true
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 36h"

  # Push our liveness to bifrost gatus so it can alert via Pushover
  # if the cluster gatus stops pushing (independent alert path).
  - name: bifrost | heartbeat push
    group: vps
    url: https://bifrost-gatus.vzkn.eu/api/v1/endpoints/home_heartbeat/external?success=true&duration=1ms
    method: POST
    headers:
      Authorization: Bearer ${BIFROST_HEARTBEAT_TOKEN}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
