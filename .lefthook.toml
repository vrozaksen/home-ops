[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-just]
run = """
for file in {staged_files}; do
    mise exec -- just --justfile "$file" --fmt --unstable
done
"""
glob = ["*.just", "justfile", ".justfile"]
stage_fixed = true

[pre-commit.commands.format-yaml]
run = "mise exec -- yamlfmt {staged_files}"
glob = ["*.yaml"]
stage_fixed = true

[pre-commit.commands.format-mise]
run = "mise fmt"
glob = [".mise.toml"]
stage_fixed = true

[pre-commit.commands.shellcheck]
run = "mise exec -- shellcheck {staged_files}"
glob = ["*.sh"]

[pre-commit.commands.actionlint]
run = "mise exec -- actionlint {staged_files}"
glob = [".github/workflows/*.yaml"]

[pre-commit.commands.zizmor]
run = "mise exec -- zizmor --no-progress --min-severity low {staged_files}"
glob = [".github/workflows/*.yaml"]

# bootstrap/values.yaml.gotmpl reads values from in-repo HelmReleases by path;
# a layer move silently broke DR bootstrap once (apps/ -> core/).
[pre-commit.commands.bootstrap-values-paths]
run = """
set -o pipefail
tmpl=$(grep -o '\\.\\./kubernetes/[^"]*' bootstrap/values.yaml.gotmpl)
yq -r '.releases[] | select(.values[]? == "../values.yaml.gotmpl") | .namespace + " " + .name' bootstrap/helmfile.d/01-apps.yaml \
  | while read -r ns name; do
      # shellcheck disable=SC2059
      f="bootstrap/$(printf "$tmpl" "$ns" "$name")"
      [ -f "$f" ] || { echo "bootstrap: $ns/$name values source missing: $f"; exit 1; }
    done
"""
glob = ["bootstrap/**", "kubernetes/core/**"]
