---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the browser host multica.vzkn.eu; multica-api.vzkn.eu (LAN only) keeps
# Multica's own auth so daemons and the CLI (PAT bearer tokens) keep working.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: multica-external
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/multica
    clientID: multica
    clientSecret:
      name: kanidm-multica-oidc  # written by kanidm-provision, key client-secret
    redirectURL: https://multica.vzkn.eu/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: multica.vzkn.eu
    # Background fetch/XHR gets 401, not a 302: every redirect sets a fresh nonce
    # cookie pair and a polling tab overflows HTTP/2 headers (too_many_headers).
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    scopes:
      - "openid"
      - "email"
      - "profile"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: multica-app
    # app-template names a lone route `multica`; cover it in case the api route is dropped
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: multica
