---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name forgejo-runner-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/development/forgejo
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: development
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          # One registration per size class; medium is the original runner.
          small-uuid: '{{ .RUNNER_SMALL_UUID.Value }}'
          small-token: '{{ .RUNNER_SMALL_TOKEN.Value }}'
          medium-uuid: '{{ .RUNNER_UUID.Value }}'
          medium-token: '{{ .RUNNER_TOKEN.Value }}'
          large-uuid: '{{ .RUNNER_LARGE_UUID.Value }}'
          large-token: '{{ .RUNNER_LARGE_TOKEN.Value }}'
