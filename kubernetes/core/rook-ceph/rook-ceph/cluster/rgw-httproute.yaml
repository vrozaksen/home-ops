---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
# LAN S3 endpoint for Ceph RGW. Attic signs NAR download redirects with its S3
# endpoint, so clients must resolve it (the in-cluster service name does not).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rgw-ceph-objectstore
spec:
  hostnames:
    - rgw.s3.vzkn.eu
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: rook-ceph-rgw-ceph-objectstore
          port: 80
