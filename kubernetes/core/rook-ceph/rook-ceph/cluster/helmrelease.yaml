---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.21.0
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 45m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: infrastructure
        host:
          name: rook.vzkn.eu
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    cephClusterSpec:
      # CVE-2025-30156: closed once the mons issue aes256k tickets, which daemon
      # rotation delivers; clients may stay on aes after that.
      security:
        cephx:
          # Only safe because no entity holds an aes key any more.
          allowedCiphers:
            - aes256k
          daemon:
            keyRotationPolicy: KeyGeneration
            # Bump to rotate again; osd reports generation 1 today.
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
            keepPriorKeyCountMax: 1
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
      mon:
        count: 5
        allowMultiplePerNode: false  # Max 1 mon per node - forces distribution
      cephConfig:
        global:
          bdev_enable_discard: "true"  # quote
          osd_class_update_on_start: "false"  # quote
          device_failure_prediction_mode: local  # requires mgr module
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: k8sevents
            enabled: true
          - name: nfs
            enabled: false  # not using NFS-Ganesha exports
          - name: pg_autoscaler
            enabled: true
          # Rook recommends disabling this before Ceph Tentacle (v20); it has
          # known stability issues there. Costs a few dashboard pages we do not use.
          - name: rook
            enabled: false
      network:
        provider: host
        addressRanges:
          public:
            - "10.10.0.0/24"
          cluster:
            - "10.10.0.0/24"
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 125m
        mon:
          requests:
            cpu: 250m
        osd:
          requests:
            cpu: 500m
            memory: 6Gi
          limits:
            memory: 6Gi
      healthCheck:
        livenessProbe:
          mon:
            probe:
              timeoutSeconds: 30
      storage:
        useAllNodes: false
        nodes:
          - name: "alfheim"
            deviceFilter: nvme0n1
          - name: "alne"
            deviceFilter: nvme0n1
          - name: "ainias"
            deviceFilter: nvme0n1
        useAllDevices: false
        deviceFilter: nvme0n1
        config:
          osdsPerDevice: "1"
      placement:
        # Schedule Ceph mgr on workers (needs storage access)
        mgr:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # Mons can run anywhere - allows quorum during worker upgrades
        mon:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
    cephBlockPools:
      # Default pool with 3x replication for general workloads
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
          # Must live here, not in storageClass.parameters -- ceph-csi ignores it
          # there, which is why it compressed nothing for months.
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            # Inert (ceph-csi ignores it) but StorageClass.parameters is
            # immutable, so removing it fails the upgrade.
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      # Two copies for apps that replicate themselves (CNPG).
      # Not one: an RBD image stripes across every OSD, so one OSD down took all.
      - name: ceph-pool-thin
        spec:
          failureDomain: host
          replicated:
            size: 2
          parameters:
            min_size: "1"
            # Postgres does not compress its data dir or local WAL -- barman only
            # compresses what it ships to S3. Same placement caveat as above.
            compression_mode: aggressive
            compression_algorithm: zstd
        storageClass:
          enabled: true
          name: ceph-block-thin
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    # RGW alongside Garage, for buckets that are better off in-cluster.
    # Never for kopiur: backing up Ceph-hosted PVCs into Ceph defeats the point.
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # An objectstore brings ~7 pools. At the 32 PG default that is
              # 278 PG/OSD against a 250 hard cap, so creation would fail.
              # Start at 8 (110/OSD) and let the autoscaler grow them.
              pg_num: "8"
              pg_num_min: "8"
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
            parameters:
              # 3 hosts with 1 OSD each: the EC default would block writes while a
              # host is down. Allow writes on k shards, as ceph-pool-thin does.
              min_size: "2"
              pg_num: "8"
              pg_num_min: "8"
          preservePoolsOnDelete: true
          gateway:
            port: 80
            # HTTPS for minio-go clients, see rgw-certificate.yaml.
            securePort: 443
            sslCertificateRef: rgw-ceph-objectstore-tls
            instances: 2
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            region: eu-central-1
