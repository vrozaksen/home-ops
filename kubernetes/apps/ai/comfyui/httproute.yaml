---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: comfyui
  annotations:
    # Behind OIDC, and ragnarok is often off/gaming: a probe would only flap
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - comfy.vzkn.eu
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: comfyui
          port: 8188
