---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.7
  url: oci://ghcr.io/rook/rook-ceph
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    ceph-csi-operator:
      controllerManager:
        manager:
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
      # NOTE: Enable the driver and shapshotter if you want to use CephFS
      enableCephfsDriver: false
      enableCephfsSnapshotter: false
      enableLiveness: true
      serviceMonitor:
        enabled: true
      # Allow CSI nodeplugin on CP nodes (for potential future volume mounts)
      pluginTolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Chart defaults reserve 300m (nodeplugin) + 400m (provisioner) while the
      # containers idle at 1-5m — these are gRPC shims that only work during
      # attach/detach/resize. Over 6 nodes that held ~2.2 CPU hostage and left
      # workers at 96-98% CPU requests, which made descheduler nodeFit reject
      # every rebalance. Headroom kept on csi-rbdplugin: it does the actual rbd
      # map work during a mass remount storm.
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
        - name: csi-rbdplugin
          resource:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
        - name: csi-resizer
          resource:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
        - name: csi-attacher
          resource:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
        - name: csi-snapshotter
          resource:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
        - name: csi-rbdplugin
          resource:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
        - name: csi-omap-generator
          resource:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi  # unchangable
        cpu: 100m  # unchangable
      limits: {}
