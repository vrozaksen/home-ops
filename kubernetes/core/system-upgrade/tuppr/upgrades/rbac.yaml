---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuppr-ceph-hook
  namespace: system-upgrade
---
# The hook Job runs in system-upgrade, so reaching Ceph means exec'ing into the
# toolbox rather than mounting the mon keyring across namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuppr-ceph-hook
  namespace: rook-ceph
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuppr-ceph-hook
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuppr-ceph-hook
subjects:
  - kind: ServiceAccount
    name: tuppr-ceph-hook
    namespace: system-upgrade
