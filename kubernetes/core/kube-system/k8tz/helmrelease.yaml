---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8tz
spec:
  interval: 1h
  url: https://k8tz.github.io/k8tz/
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  interval: 1h
  chart:
    spec:
      chart: k8tz
      version: 0.19.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: k8tz
  values:
    namespace: null
    createNamespace: false
    replicaCount: 2
    timezone: Europe/Warsaw
    cronJobTimeZone: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8tz
              topologyKey: kubernetes.io/hostname
    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-selfsigned
          kind: Issuer
      ignoredNamespaces:
        - falco
        - flux-system
        - kube-system
        - security
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: MutatingWebhookConfiguration
              name: k8tz
            patch: |-
              - op: replace
                path: /webhooks/0/objectSelector
                value:
                  matchExpressions:
                    - key: app.kubernetes.io/managed-by
                      operator: NotIn
                      values:
                        - forgejo-runner
