---
# etcd tuning never moved out of v1alpha1. allowSchedulingOnControlPlanes did:
# KubeNodeConfig owns it now, by carrying the taint explicitly.
cluster:
  etcd:
    advertisedSubnets:
      - "10.10.0.0/24"
    extraArgs:
      auto-compaction-mode: periodic
      auto-compaction-retention: "5m"
      listen-metrics-urls: http://0.0.0.0:2381
      quota-backend-bytes: "4294967296"  # 4 GiB
