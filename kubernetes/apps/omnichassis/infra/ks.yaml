---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: omnichassis-infra
spec:
  interval: 30m
  url: https://git.vzkn.eu/Omnichassis/infra.git
  ref:
    branch: main
  ignore: |
    /*
    !/kubernetes
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omnichassis-infra
spec:
  # VirtualMachine/DataVolume CRDs (kubernetes/sil-runner) must exist first.
  dependsOn:
    - name: cdi
      namespace: cdi
    - name: kubevirt
      namespace: kubevirt
  interval: 1h
  path: ./kubernetes
  prune: true
  serviceAccountName: omnichassis-infra
  sourceRef:
    kind: GitRepository
    name: omnichassis-infra
  targetNamespace: omnichassis
  wait: false
