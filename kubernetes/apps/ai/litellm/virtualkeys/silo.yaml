---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Silo on aincrad (key pasted into Admin > AI Services): embeddings for
# recommendations/semantic search, DeepSeek for subtitle/metadata translation,
# Groq Whisper for transcription.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: silo
spec:
  proxyRef: litellm
  keyAlias: silo
  secretName: litellm-key-silo
  secretKey: api-key
  models:
    - deepseek/*
    - embed
    - groq/*
