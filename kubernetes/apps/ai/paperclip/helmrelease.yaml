---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperclip:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/paperclipai/paperclip
              tag: 2026.1012.0
              digest: sha256:1661b3dd3fdf7a9b59542d1ced464c3faf9dc8309798b4d15a9923ed32795307
            env:
              HOST: 0.0.0.0
              PORT: &port 3100
              SERVE_UI: "true"
              PAPERCLIP_HOME: /paperclip
              PAPERCLIP_PUBLIC_URL: https://paperclip.vzkn.eu
              PAPERCLIP_DEPLOYMENT_MODE: authenticated
              PAPERCLIP_DEPLOYMENT_EXPOSURE: private
              BETTER_AUTH_URL: https://paperclip.vzkn.eu
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-paperclip-app
                    key: uri
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # Agent toolchains: static mise on the PVC, tools installed per repo by mise.
              PATH: /etc/github-app-bin:/paperclip/.local/bin:/paperclip/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_TRUSTED_CONFIG_PATHS: /paperclip
              MISE_YES: "1"
              # GitHub App vzkn-agents: git push / ghx on home-ops via short-lived installation tokens.
              GITHUB_APP_ID: "5384873"
              GIT_CONFIG_COUNT: "5"
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: "!node /etc/github-app-bin/gh-app-token.mjs"
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: vzkn-agents[bot]
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: 344950406+vzkn-agents[bot]@users.noreply.github.com
              # Forgejo bot user vzkn-agents (write on Omnichassis repos; main is push/merge-whitelisted to the owner).
              GIT_CONFIG_KEY_3: credential.http://forgejo-http.development.svc.cluster.local:3000.helper
              GIT_CONFIG_VALUE_3: "!/etc/github-app-bin/forgejo-cred"
              GIT_CONFIG_KEY_4: credential.https://git.vzkn.eu.helper
              GIT_CONFIG_VALUE_4: "!/etc/github-app-bin/forgejo-cred"
              # memini plugin for claude_local agents; namespace is set per agent env.
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_HOME: personal/vrozaksen
              # No ANTHROPIC_BASE_URL: claude_local must reach Anthropic directly on
              # the Max subscription. Agents meant for LiteLLM set it in adapter env.
            envFrom:
              - secretRef:
                  name: paperclip-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: paperclip.vzkn.eu
                  periodSeconds: 30
                  # Busy agent runs stall /api/health; a liveness kill drops every in-flight run.
                  timeoutSeconds: 15
                  failureThreshold: 6
              readiness: *probe
            resources:
              # All claude_local agent processes run inside this pod.
              # Workers are ~98% CPU-requested; 400m is what still schedules (alfheim).
              requests:
                cpu: 400m
                memory: 1536Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paperclip
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: ai
        hostnames:
          - "{{ .Release.Name }}.vzkn.eu"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: paperclip
        globalMounts:
          - path: /paperclip
      # reference docs for agents; never committed anywhere.
      github-app-bin:
        type: configMap
        name: paperclip-github-app
        defaultMode: 0755
        globalMounts:
          - path: /etc/github-app-bin
            readOnly: true
      github-app-key:
        type: secret
        name: paperclip-github-app
        defaultMode: 0400
        globalMounts:
          - path: /etc/github-app
            readOnly: true
      forgejo-bot:
        type: secret
        name: paperclip-secret
        defaultMode: 0400
        items:
          - key: FORGEJO_BOT_TOKEN
            path: token
        globalMounts:
          - path: /etc/forgejo-bot
            readOnly: true
      refs:
        type: nfs
        server: aincrad.home.vzkn.eu
        path: /mnt/blaze/refs
        globalMounts:
          - path: /refs
            readOnly: true
