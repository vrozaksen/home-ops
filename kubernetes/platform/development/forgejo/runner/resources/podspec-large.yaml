---
# nix builds, Rust. Measured ~5.5-6.5Gi; the request keeps the scheduler
# from packing several onto one node (ainias OOM 2026-10-01).
activeDeadlineSeconds: 7200
serviceAccountName: forgejo-runner
automountServiceAccountToken: true
# Never preempts anything and normal pods cannot preempt it (cluster-low
# let kopiur movers kill builds mid-run, 2026-10-13).
priorityClassName: ci-task
securityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
containers:
  - name: main
    image: ghcr.io/catthehacker/ubuntu:act-latest
    imagePullPolicy: IfNotPresent
    env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
      - name: BUILDKIT_HOST
        value: tcp://buildkit.development.svc.cluster.local:1234
    resources:
      requests:
        cpu: 100m
        memory: 4Gi
      limits:
        memory: 12Gi
    volumeMounts:
      - name: buildkit-tls
        mountPath: /etc/buildkit-tls
        readOnly: true
volumes:
  - name: buildkit-tls
    secret:
      secretName: buildkit-client-tls
      defaultMode: 0440
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: forgejo-runner-instance
restartPolicy: Never
