---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multica
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/multica-ai/multica-backend
              tag: v0.7.1@sha256:36dd6d2325b5bb6b6873ef7ee19e0a15a084832771a68bdc2b50b0990a6eba38
            env:
              PORT: &apiPort 8080
              APP_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-multica-app
                    key: uri
              MULTICA_APP_URL: &url https://multica.vzkn.eu
              FRONTEND_ORIGIN: *url
              CORS_ALLOWED_ORIGINS: *url
              MULTICA_PUBLIC_URL: *url
              # Shown in the UI's daemon setup commands: daemons use the LAN API host.
              MULTICA_DAEMON_SERVER_URL: https://multica-api.vzkn.eu
              # Hook servers call back on the LAN API host.
              MULTICA_PLUGIN_API_URL: https://multica-api.vzkn.eu/v1
              # Sandboxed plugin iframes need their own cookie-less origin.
              MULTICA_PLUGIN_SURFACE_ORIGIN: https://multica-plugins.vzkn.eu
              # Owner account and both workspaces exist; nothing new gets created.
              ALLOW_SIGNUP: "false"
              ALLOWED_EMAILS: vrozaksen@protonmail.com
              DISABLE_WORKSPACE_CREATION: "true"
              # No phone-home: self-host telemetry and PostHog off.
              DO_NOT_TRACK: "1"
              ANALYTICS_DISABLED: "true"
              AUTH_TOKEN_TTL: 168h
              # Rate limits per client IP, not per Envoy pod.
              RATE_LIMIT_TRUSTED_PROXIES: &pods 10.69.0.0/16
              MULTICA_TRUSTED_PROXIES: *pods
              # Forgejo integration (Settings → Integrations): PR/issue links via webhooks.
              MULTICA_VCS_INTEGRATION_ENABLED: "true"
              # Realtime hub + auth rate limiting; without it both are single-node / off.
              REDIS_URL: redis://multica-dragonfly.ai.svc.cluster.local:6379/0
              # Login codes by mail (smtp-relay, no auth in-cluster).
              SMTP_HOST: smtp-relay.network.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_FROM_EMAIL: noreply@vzkn.eu  # bare address: Multica rejects "Name <addr>"
              MULTICA_DATABASE_STARTUP_TIMEOUT: 3m
              # Attachments in Garage; the backend proxies downloads (browsers never hit S3).
              S3_BUCKET: multica
              S3_REGION: eu-central-1
              AWS_ENDPOINT_URL: https://api.s3.vzkn.eu
              S3_USE_PATH_STYLE: "true"
              ATTACHMENT_DOWNLOAD_MODE: proxy
            envFrom:
              - secretRef:
                  name: multica-secret
              - secretRef:
                  name: multica-s3-secret
            probes:
              # Migrations run before the server listens; startup allows 10 min.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: *apiPort}
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: *apiPort}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: *apiPort}
                  periodSeconds: 15
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
      web:
        containers:
          app:
            image:
              repository: ghcr.io/multica-ai/multica-web
              tag: v0.7.1@sha256:a474b3874e2de19b9019a2b07ec07c22247ecc61f0f39fb6cf4d814504aaf316
            env:
              HOSTNAME: 0.0.0.0
              PORT: &webPort 3000
              REMOTE_API_URL: http://multica-backend.ai.svc.cluster.local:8080
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *webPort
                  periodSeconds: 30
              readiness: *webProbe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 768Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      backend:
        controller: backend
        ports:
          http:
            port: *apiPort
      web:
        controller: web
        ports:
          http:
            port: *webPort
    route:
      # Browser UI, home and away. No gateway OIDC: Kanidm kills the session when
      # parallel SPA requests replay one refresh token, so Multica's own login guards it.
      app:
        hostnames:
          - multica.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # API, auth, uploads and the WebSocket go straight to the backend.
          - matches:
              - path: {type: PathPrefix, value: /api}
              - path: {type: PathPrefix, value: /v1}
              - path: {type: PathPrefix, value: /auth}
              - path: {type: PathPrefix, value: /uploads}
              - path: {type: PathPrefix, value: /ws}
            backendRefs:
              - identifier: backend
                port: *apiPort
          - backendRefs:
              - identifier: web
                port: *webPort
      # LAN only, no OIDC: daemons and the CLI authenticate with Multica PATs.
      api:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: ai
            url: https://multica-api.vzkn.eu/healthz
        hostnames:
          - multica-api.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: backend
                port: *apiPort
      # Plugin surface origin: no session cookies, backend serves only /plugin-surfaces here.
      plugins:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - multica-plugins.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path: {type: PathPrefix, value: /plugin-surfaces}
            backendRefs:
              - identifier: backend
                port: *apiPort
    persistence:
      # Next.js image/fetch cache; the image dir is not writable for uid 1000.
      next-cache:
        type: emptyDir
        advancedMounts:
          web:
            app:
              - path: /app/apps/web/.next/cache
      tmp:
        type: emptyDir
        advancedMounts:
          backend:
            app:
              - path: /tmp
          web:
            app:
              - path: /tmp
