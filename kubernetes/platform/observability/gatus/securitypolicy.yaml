---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gatus
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/gatus
    clientID: gatus
    clientSecret:
      name: kanidm-gatus-oidc  # secret written by kanidm-provision, key client-secret
    redirectURL: https://status.vzkn.eu/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: vzkn.eu
    scopes:
      - "openid"
      - "email"
      - "profile"
  # app-template names the route `gatus` with one route and `gatus-app` with
  # several; cover both so a Helm rollback never leaves the app ungated
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gatus
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gatus-app
