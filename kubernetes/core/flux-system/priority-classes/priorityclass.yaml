---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cluster-low
value: -100
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Low priority workloads - can be preempted by normal priority pods"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-task
# Same value as unclassed pods, so they can't preempt a running CI job;
# Never keeps a pending CI job from preempting cluster-low pods (runners).
value: 0
globalDefault: false
preemptionPolicy: Never
description: "Forgejo CI task pods - never preempt, not preemptible by normal pods"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: monitoring
# Above unclassed pods (0), far below kubevirt (1e9) and system-* (2e9): after a node
# loss Prometheus/Alertmanager preempt app pods instead of sitting Pending.
value: 10000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Metrics and alerting core - may preempt normal workloads, never kubevirt or system pods"
