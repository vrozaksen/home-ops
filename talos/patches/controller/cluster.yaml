---
# What is left here has no typed document in 1.14: KubeClusterConfig carries
# only clusterName/endpoint, and etcd tuning never moved out of v1alpha1.
cluster:
  allowSchedulingOnControlPlanes: false
  etcd:
    advertisedSubnets:
      - "10.10.0.0/24"
    extraArgs:
      auto-compaction-mode: periodic
      auto-compaction-retention: "5m"
      listen-metrics-urls: http://0.0.0.0:2381
      quota-backend-bytes: "4294967296"  # 4 GiB
