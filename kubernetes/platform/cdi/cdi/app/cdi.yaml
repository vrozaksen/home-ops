---
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
    # Default importer limits are too small for qcow2 conversion (Sidero guide).
    podResourceRequirements:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 2Gi
  # Upstream requests 100m per component (~400m total) on CPU-tight workers;
  # observed idle usage is 2-12m.
  customizeComponents:
    patches:
      - resourceName: cdi-apiserver
        resourceType: Deployment
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-apiserver","resources":{"requests":{"cpu":"10m"}}}]}}}}'
      - resourceName: cdi-deployment
        resourceType: Deployment
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-deployment","resources":{"requests":{"cpu":"10m"}}}]}}}}'
      - resourceName: cdi-uploadproxy
        resourceType: Deployment
        type: strategic
        patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-uploadproxy","resources":{"requests":{"cpu":"10m"}}}]}}}}'
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  workload:
    nodeSelector:
      kubernetes.io/os: linux
