---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Local model (ragnarok, 10.100.0.102): llama.cpp Vulkan behind llama-swap, one model
# always loaded (nix-config modules/services/llama-swap.nix). Stopped while gaming, so
# a refused connection parks it (allowed_fails: 1) and traffic falls back.
# Pricing = electricity marginal cost.
# Hardware: 9800X3D + 9070 XT, 32GB RAM. Idle ~75W, inference ~300W extra.
# Electricity: 1.50 PLN/kWh ≈ 0.375 USD/kWh.
# Qwen3.8-27B UD-Q3_K_XL: ~36 tok/s output, ~1000 tok/s prefill (nix-config docs/llm-bench.md).
# Output: 300W × (1000/36)s = 8333J = 0.00231 kWh × 0.375 = 0.00087 USD/1K tok → 8.7e-07
# Input (prefill): 300W × 1s = 300J = 0.000083 kWh × 0.375 = 0.000031 USD/1K tok → 3.1e-08
# Rounded up to cover idle amortization during inference windows.
# timeout 600: llama-server runs 2 slots (-np 2), a third request queues; 120s would
# trip allowed_fails under normal load. maxInputTokens = llama-server -c.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-qwen38
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://10.100.0.102:9292/v1
    apiKey: not-needed
    additional:
      timeout: 600
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 65536
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 1e-06
