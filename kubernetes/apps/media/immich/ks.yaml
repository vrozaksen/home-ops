---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
spec:
  components:
    - ../../../components/gpu
    - ../../../components/kopiur
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: infisical-operator
      namespace: security
    - name: kanidm
      namespace: security
    - name: kopiur
      namespace: kopiur-system
    - name: plugin-barman-cloud
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  path: ./kubernetes/apps/media/immich
  postBuild:
    substitute:
      APP: *app
      NS: &ns media
      # Stock CNPG image + VectorChord (pgvector ships in the base already)
      CNPG_IMAGE: ghcr.io/tensorchord/cloudnative-vectorchord
      # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord
      CNPG_VERSION: 18.6-1.1.1
      CNPG_SIZE: 5Gi
      KOPIUR_CAPACITY: 100Gi
      KOPIUR_CACHE_CAPACITY: 10Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
