---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Vane: chat on `research` (local Qwen -> Haiku), embeddings on `embed` (TEI).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: vane
spec:
  proxyRef: litellm
  proxyNamespace: ai
  keyAlias: vane
  secretName: litellm-key-vane
  secretKey: api-key
  models:
    - embed
    - research
