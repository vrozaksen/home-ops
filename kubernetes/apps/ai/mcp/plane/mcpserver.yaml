---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: plane
spec:
  # Upstream publishes no semver or `latest` tag -- only branch names and
  # `stable`, so the digest is what actually pins this.
  image: docker.io/makeplane/plane-mcp-server:stable@sha256:7890d0a6cbbd062311907a5daa8ca612a81fcf101790ea4936e9350d2928ce55
  transport: stdio
  proxyPort: 8080
  args:
    - stdio
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: PLANE_BASE_URL
      value: https://plane.vzkn.eu
    - name: PLANE_WORKSPACE_SLUG
      value: vzkn
  secrets:
    - name: plane-mcp-secret
      key: PLANE_API_KEY
      targetEnvName: PLANE_API_KEY
---
# Same image and token as `plane`; the server binds one workspace per process.
# The API key is user-scoped (api_tokens.workspace_id is NULL), so it reaches
# every workspace the owner is a member of.
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: plane-omnichassis
spec:
  image: docker.io/makeplane/plane-mcp-server:stable@sha256:7890d0a6cbbd062311907a5daa8ca612a81fcf101790ea4936e9350d2928ce55
  transport: stdio
  proxyPort: 8080
  args:
    - stdio
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: PLANE_BASE_URL
      value: https://plane.vzkn.eu
    - name: PLANE_WORKSPACE_SLUG
      value: omnichassis
  secrets:
    - name: plane-mcp-secret
      key: PLANE_API_KEY
      targetEnvName: PLANE_API_KEY
