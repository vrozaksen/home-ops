---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app intel-hub
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      intel-hub:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          # Consumers (RouterOS, Wazuh, Security Onion) pull their formats from
          # here rather than from the upstreams. AbuseIPDB's blacklist quota is
          # five calls per day per ACCOUNT, so four clients querying directly
          # would exhaust it on the first day -- and the key would have to be
          # copied to a router and an appliance that store config in clear text.
          app:
            image:
              repository: registry.vzkn.eu/containers/intel-hub
              tag: 1.0.0
            env:
              ABUSEIPDB_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: abuseipdb-secret
                    key: ABUSEIPDB_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: 8080}
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              # Deliberately gated on having a rendered snapshot: an endpoint
              # that answers with an empty list is worse than one that refuses,
              # because the router would import it and clear its block list.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /readyz, port: 8080}
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
