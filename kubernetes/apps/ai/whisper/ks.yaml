---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app whisper
spec:
  # Gen9 iGPU: OpenVINO and SYCL are out (Intel moved it to legacy1 packages),
  # Vulkan is all that is left and it has measured slower than CPU on Intel.
  # Check before trusting it -- `whisper-bench -m <model>` with and without -ng;
  # if -ng wins, add --no-gpu to the server args and drop this component.
  components:
    - ../../../components/gpu
  interval: 1h
  path: ./kubernetes/apps/ai/whisper
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
