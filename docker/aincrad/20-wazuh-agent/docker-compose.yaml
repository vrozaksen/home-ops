---
name: wazuh-agent

services:
  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.3
    container_name: wazuh-agent
    restart: unless-stopped
    # Matches the manager: agents newer than the manager are unsupported.
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/wazuh.png"
    # NO `pid: host`. This image runs s6, whose shutdown sequence signals every
    # process in its PID namespace -- sharing the host's meant that stopping the
    # container killed all of Unraid's userspace, kernel and NFS aside.
    # Losing it costs rootcheck's process and port checks, nothing FIM needs.
    cap_add:
      - DAC_READ_SEARCH
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - wazuh-agent-state:/var/ossec/queue
      - wazuh-agent-etc:/var/ossec/etc
      # Read-only: the agent watches these, it must never alter them.
      - /boot/config:/boot/config:ro
      - /mnt/blaze/appdata:/mnt/blaze/appdata:ro
      - /var/log:/var/log:ro
    secrets:
      - authd_pass
    # Not `deploy.resources`, which is a swarm construct and gets ignored here.
    # FIM hashing is CPU and I/O heavy, and this host has no swap -- the agent
    # must never be able to starve the NAS it is watching.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-agentd is running'"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  wazuh-agent-state:
  wazuh-agent-etc:

secrets:
  authd_pass:
    environment: WAZUH_AUTHD_PASS

networks:
  default:
    name: aincrad
    external: true
