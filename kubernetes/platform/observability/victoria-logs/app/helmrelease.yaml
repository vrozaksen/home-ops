---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-logs
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.13.10
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      retentionPeriod: 14d
      route:
        enabled: true
        hostnames:
          - vlogs.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
      # Syslog receiver for RouterOS (RB5009/CRS326), which sits outside the
      # cluster and needs a routable address.
      extraVolumes:
        - name: auth-keys
          secret:
            secretName: victoria-logs-auth
            defaultMode: 0440
      extraVolumeMounts:
        - name: auth-keys
          mountPath: /etc/victoria-logs-auth
          readOnly: true
      extraArgs:
        partitionManageAuthKey: file:///etc/victoria-logs-auth/partition-manage
        forceMergeAuthKey: file:///etc/victoria-logs-auth/force-merge
        forceFlushAuthKey: file:///etc/victoria-logs-auth/force-flush
        logNewStreamsAuthKey: file:///etc/victoria-logs-auth/log-new-streams
        syslog.listenAddr.udp: :514
        syslog.useLocalTimestamp.udp: "true"
        syslog.streamFields.udp: '["hostname","app_name"]'
