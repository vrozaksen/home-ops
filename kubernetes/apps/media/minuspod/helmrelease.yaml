---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minuspod
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minuspod:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/ttlequals0/minuspod
              repository: docker.io/ttlequals0/minuspod
              # -cpu: the default tag bundles ~9GB of unusable CUDA wheels.
              tag: 2.97.10-cpu@sha256:a5604e3030aed2e24d78f6474da7d2f87ebe2d95320b23f7bd558c3de97610d4
            env:
              TZ: Europe/Warsaw
              BASE_URL: https://minuspod.vzkn.eu
              MINUSPOD_PORT: &port 8000
              # The LLM that locates ad segments in the transcript. Key comes
              # from Infisical; model choice is made in the UI.
              LLM_PROVIDER: anthropic
              # Offloaded to whisper in `ai`; in-process faster-whisper pins
              # batch_size=8 on CPU, which is what OOM-killed this pod.
              WHISPER_BACKEND: openai-api
              WHISPER_API_BASE_URL: http://whisper.ai.svc.cluster.local:8765/v1
              # Ignored by whisper.cpp, but the app demands a value.
              WHISPER_API_MODEL: whisper-1
              WHISPER_DEVICE: cpu
              # EN + PL feeds. Also DB-seeded: set Language = auto and
              # Concurrent chunks = 3 in Settings > Transcription.
              WHISPER_LANGUAGE: auto
              TRANSCRIBE_CONCURRENT_CHUNKS: "3"
              # FLAC only exists to shrink cloud uploads; whisper.cpp takes WAV.
              SKIP_FLAC_COMPRESSION: "true"
              MINUSPOD_REQUIRE_AUTH: "true"
              # No OIDC support -- this app has its own login only.
              MINUSPOD_ALLOW_PUBLIC_PROCESSING: "false"
              # Without this the real client IP never reaches the app, so login
              # lockout and per-IP rate limits silently never fire. One hop.
              MINUSPOD_TRUSTED_PROXY_COUNT: "1"
              MINUSPOD_ENABLE_HSTS: "true"
              SESSION_COOKIE_SECURE: "auto"
            envFrom:
              - secretRef:
                  name: minuspod-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              # entrypoint.sh fixes volume ownership as root, then drops to the
              # bundled minuspod user (1000) with setpriv.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              # Whisper moved out; ffmpeg + the LLM step are what is left.
              limits:
                memory: 6Gi
    defaultPodOptions:
      # Transcoding a backlog must not be interrupted mid-episode.
      terminationGracePeriodSeconds: 360
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: minuspod
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: media
        hostnames:
          - minuspod.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        # The UI lives under /ui/ and nothing is served at /, which just 404s.
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/
                  statusCode: 302
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: minuspod
                port: 8000
    persistence:
      data:
        existingClaim: minuspod
        globalMounts:
          - path: /app/data
