---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperclip:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/paperclipai/paperclip
              tag: latest
            env:
              HOST: "0.0.0.0"
              PORT: "3100"
              SERVE_UI: "true"
              PAPERCLIP_HOME: /paperclip
              PAPERCLIP_PUBLIC_URL: https://paperclip.vzkn.eu
              PAPERCLIP_DEPLOYMENT_MODE: authenticated
              PAPERCLIP_DEPLOYMENT_EXPOSURE: private
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-paperclip-app
                    key: uri
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              ANTHROPIC_BASE_URL: http://litellm.ai.svc.cluster.local:4000
            envFrom:
              - secretRef:
                  name: paperclip-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3100
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3100
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paperclip
        ports:
          http:
            port: 3100
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: ai
        hostnames:
          - "{{ .Release.Name }}.vzkn.eu"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: paperclip
        globalMounts:
          - path: /paperclip
