---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# renovate: datasource=docker depName=registry.k8s.io/kube-apiserver
image: registry.k8s.io/kube-apiserver:v1.37.1
certExtraSANs:
  - 10.10.0.20
  - 127.0.0.1
extraArgs:
  enable-aggregator-routing: "true"
  # Faster pod eviction from unreachable nodes (default: 300s)
  default-not-ready-toleration-seconds: "60"
  default-unreachable-toleration-seconds: "60"
  # HTTP/2 clients never leave an apiserver once connected, so every restart piles
  # them onto the survivors (eir: 5.3Gi live heap vs 1.3Gi on skuld, 2026-10-13).
  # 1-in-1000 GOAWAY makes them reconnect and spreads load back out (upstream rec).
  goaway-chance: "0.001"
