---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-caldav
spec:
  dependsOn:
    - name: stalwart
      namespace: self-hosted
    - name: toolhive-public
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/mcp-servers/caldav
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
