---
# kubeconfig for agent runs: in-cluster API with the pod's read-only ServiceAccount token (rbac.yaml).
# Agents set KUBECONFIG=/etc/kube/kubeconfig in their adapter env; the pod env is filtered for agent runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-kubeconfig
data:
  kubeconfig: |-
    apiVersion: v1
    kind: Config
    clusters:
      - name: home-ops
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: paperclip
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: home-ops
        context:
          cluster: home-ops
          user: paperclip
    current-context: home-ops
