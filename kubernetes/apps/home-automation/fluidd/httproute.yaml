---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fluidd
  annotations:
    # Behind OIDC: a probe only ever sees the login redirect
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - q2.vzkn.eu
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: fluidd
          port: 80
