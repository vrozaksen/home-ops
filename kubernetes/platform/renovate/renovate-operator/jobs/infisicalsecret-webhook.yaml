---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: renovate-webhook-token
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/renovate/webhook
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: renovate-webhook-token
      secretNamespace: renovate
      secretType: Opaque
      template:
        includeAllSecrets: false
        metadata:
          labels:
            # operator refuses arbitrary-key secret refs without this opt-in
            renovate-operator.mogenius.com/allow-ref: "true"
        data:
          token: '{{ .WEBHOOK_TOKEN.Value }}'
