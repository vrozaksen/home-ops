---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      memos:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/usememos/memos
              repository: ghcr.io/usememos/memos
              tag: 0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
            env:
              MEMOS_PORT: &port 5230
              MEMOS_DATA: /var/opt/memos
              MEMOS_DRIVER: postgres
              TZ: Europe/Warsaw
              # Bypasses the pooler: a single-user capture app does not need it,
              # and CNPG only mints a ready-made URI for the cluster service.
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: postgres-memos-app
                    key: fqdn-uri
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        # entrypoint.sh only chowns and su-execs when it starts as root, so a
        # non-root start skips that path entirely -- fsGroup handles the volume.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: memos
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: self-hosted
        hostnames:
          - memos.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: memos
        globalMounts:
          - path: /var/opt/memos
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
