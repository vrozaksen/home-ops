---
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # virt-handler is a privileged DaemonSet with host mounts; upstream ships
    # this namespace as privileged too. VM pods run in their own namespaces.
    kubevirt.io: ""
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
