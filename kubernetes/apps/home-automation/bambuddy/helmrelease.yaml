---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      bambuddy:
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.6
            env:
              PORT: &httpPort 8000
              HA_URL: https://hass.vzkn.eu
              HA_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-secret
                    key: HA_TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          # Server-side slicing sidecar (BambuStudio CLI + HTTP wrapper).
          # Bambuddy UI: Settings -> Workflow -> Slicer -> http://localhost:3001
          bambu-studio:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.2.5.6
            env:
              NODE_ENV: production
              PORT: &bambuPort 3001
              HOME: /home/ubuntu
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &bambuProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *bambuPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *bambuProbes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
          # Server-side slicing sidecar (OrcaSlicer CLI + HTTP wrapper).
          # Bambuddy UI: Settings -> Workflow -> Slicer -> http://localhost:3003
          slicer:
            image:
              repository: ghcr.io/maziggy/orca-slicer-api
              tag: bambuddy-1.2.5.6
            env:
              NODE_ENV: production
              PORT: &slicerPort 3003
              HOME: /home/ubuntu
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &slicerProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *slicerProbes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: bambuddy
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *httpPort
      # Virtual printer
      vp:
        controller: bambuddy
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.0.45
        ports:
          bind:
            port: 3000
          detect:
            port: 3002
          ssdp:
            port: 2021
            protocol: UDP
          mqtt:
            port: 8883
          ftps:
            port: 990
          # A1/P1 stream chamber images on 6000; X1/H2 would need 322 instead
          camera:
            port: 6000
          # Passive FTP slice for VP id 1 (base 50000, 10 ports per VP).
          # A second VP would need 50010-50019 added here.
          ftp-pasv-0:
            port: 50000
          ftp-pasv-1:
            port: 50001
          ftp-pasv-2:
            port: 50002
          ftp-pasv-3:
            port: 50003
          ftp-pasv-4:
            port: 50004
          ftp-pasv-5:
            port: 50005
          ftp-pasv-6:
            port: 50006
          ftp-pasv-7:
            port: 50007
          ftp-pasv-8:
            port: 50008
          ftp-pasv-9:
            port: 50009
    # Metrics need a one-time UI toggle: Settings -> Network -> Prometheus Metrics
    serviceMonitor:
      app:
        serviceName: bambuddy
        endpoints:
          - port: http
            path: /api/v1/metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: home-automation
        hostnames:
          - bambuddy.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: bambuddy
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
                subPath: data
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/logs
                subPath: logs
            bambu-studio:
              - path: /tmp
                subPath: bambu-tmp
            slicer:
              - path: /tmp
                subPath: slicer-tmp
      # Scratch space for slice jobs (models + gcode); ephemeral by design,
      # presets live in bambuddy's own DB
      slicer-data:
        type: emptyDir
        sizeLimit: 10Gi
        advancedMounts:
          bambuddy:
            bambu-studio:
              - path: /app/data
                subPath: bambu
            slicer:
              - path: /app/data
                subPath: orca
