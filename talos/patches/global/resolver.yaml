---
# Router is the only resolver; it forwards upstream itself. disableDefault stops
# Talos deriving a search domain from the hostname FQDN -- DHCP-provided ones
# still land here, which is new in 1.14.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.10.0.1
searchDomains:
  disableDefault: true
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true  # Requires Cilium socketLB features
