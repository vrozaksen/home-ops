<!--
  Wazuh agent - bifrost (Debian VPS, internet-facing).
  Reaches the manager through the towonel hub on the `edge` network, so nothing
  is published on the public interface.
-->
<ossec_config>
  <client>
    <server>
      <address>towonel-hub</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <!-- The manager drops an agent to "disconnected" after 20s of silence. -->
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>towonel-hub</manager_address>
      <port>1515</port>
      <agent_name>bifrost</agent_name>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Host paths live under /host: mounting the host's /etc over the
       container's own would replace the passwd and resolv.conf it needs. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <process_priority>19</process_priority>
    <max_eps>50</max_eps>

    <!-- Accounts, sudo grants and scheduled jobs: the three things an intruder
         edits to keep a foothold. -->
    <directories check_all="yes" realtime="yes">/host/etc/ssh</directories>
    <directories check_all="yes" realtime="yes">/host/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/host/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/host/etc/passwd,/host/etc/shadow,/host/etc/group,/host/etc/sudoers,/host/etc/crontab</directories>
    <directories check_all="yes" realtime="yes">/host/root/.ssh</directories>
    <directories check_all="yes" realtime="yes">/home/debian/.ssh</directories>

    <!-- No report_changes anywhere: the image ships no `diff`, so it would only
         emit error 6714 on every change it detects. -->
    <ignore type="sregex">\.log$|\.tmp$|\.swp$</ignore>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>

  <!-- Off: both need the host PID namespace, and sharing it lets the image's s6
       shutdown signal every process on the host. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <!-- The real value here: sshd auth failures, sudo, and CrowdSec decisions,
       all matched against Wazuh's own rule set. -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
