---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./infisicalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: forgejo-runner-resources
    files:
      - ./resources/podspec-large.yaml
      - ./resources/podspec-medium.yaml
      - ./resources/podspec-small.yaml
      - ./resources/runner-large.yaml
      - ./resources/runner-medium.yaml
      - ./resources/runner-small.yaml
generatorOptions:
  disableNameSuffixHash: true
