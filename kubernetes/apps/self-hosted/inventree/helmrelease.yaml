---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inventree
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      inventree:
        # RWO data PVC shared by server and worker: one pod, no rolling overlap
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Migrations + collectstatic; the image only runs them on demand (invoke update)
          migrate:
            image: &image
              repository: docker.io/inventree/inventree
              tag: 1.6.3@sha256:3e33b4203a0df94e40f43e958ac9b3ef075d877a5de9a54eda0e16f4c2a623e3
            args:
              - invoke
              - update
              - --skip-backup
            env: &env
              INVENTREE_SITE_URL: https://inventree.vzkn.eu
              INVENTREE_TIMEZONE: Europe/Warsaw
              INVENTREE_LOG_LEVEL: WARNING
              INVENTREE_GUNICORN_WORKERS: "2"
              INVENTREE_BACKGROUND_WORKERS: "2"
              INVENTREE_AUTO_UPDATE: "True"
              # Envoy terminates TLS and forwards through Caddy
              INVENTREE_USE_X_FORWARDED_HOST: "True"
              INVENTREE_USE_X_FORWARDED_PORT: "True"
              INVENTREE_USE_X_FORWARDED_PROTO: "True"
              # Static files are regenerated by the init container; Caddy serves them
              INVENTREE_STATIC_ROOT: /static
              # Plugins: builtin supplier-barcode, label-sheet and automation plugins forced on
              INVENTREE_PLUGINS_ENABLED: "True"
              INVENTREE_PLUGINS_MANDATORY: digikeyplugin,mouserplugin,lcscplugin,tmeplugin,inventreelabelsheet,autocreatebuilds,autoiissueorders
              # Database via PgBouncer pooler (session mode), CNPG-generated app credentials
              INVENTREE_DB_ENGINE: postgresql
              INVENTREE_DB_NAME: inventree
              INVENTREE_DB_HOST: pooler-inventree-rw.self-hosted.svc.cluster.local
              INVENTREE_DB_PORT: "5432"
              INVENTREE_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-inventree-app
                    key: username
              INVENTREE_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-inventree-app
                    key: password
              # Cache and worker task locking (dedicated Dragonfly instance)
              INVENTREE_CACHE_ENABLED: "True"
              INVENTREE_CACHE_HOST: inventree-dragonfly.self-hosted.svc.cluster.local
              INVENTREE_CACHE_PORT: "6379"
              # Mail via the in-cluster smtp-relay (no auth, no TLS on 25)
              INVENTREE_EMAIL_HOST: smtp-relay.network.svc.cluster.local
              INVENTREE_EMAIL_PORT: "25"
              INVENTREE_EMAIL_TLS: "False"
              INVENTREE_EMAIL_SSL: "False"
              INVENTREE_EMAIL_SENDER: InvenTree <noreply@vzkn.eu>
              # Read-only in the UI, so SSO and currency survive a database restore
              INVENTREE_GLOBAL_SETTINGS: '{"INVENTREE_COMPANY_NAME":"Vzkn.eu","INVENTREE_DEFAULT_CURRENCY":"EUR","CURRENCY_CODES":"EUR,PLN,USD","LOGIN_ENABLE_REG":false,"LOGIN_ENABLE_SSO":true,"LOGIN_ENABLE_SSO_REG":true}'
              # Kanidm OIDC without a DB social app. $(VAR) only expands variables listed before
              # it and app-template sorts env keys, so keep this secret's name sorted before
              # INVENTREE_SOCIAL_PROVIDERS.
              AUTH_KANIDM_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-inventree-oidc
                    key: client-secret
              INVENTREE_SOCIAL_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"kanidm","name":"Kanidm","client_id":"inventree","secret":"$(AUTH_KANIDM_SECRET)","settings":{"server_url":"https://idm.vzkn.eu/oauth2/openid/inventree","fetch_userinfo":true}}]}}'
            envFrom: &envFrom
              - secretRef:
                  name: inventree-secret
            # The image starts as root and does not drop privileges
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            probes:
              # Host header must match INVENTREE_SITE_URL (ALLOWED_HOSTS)
              startup: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/health/
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: inventree.vzkn.eu
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/system/health/
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: inventree.vzkn.eu
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/system/health/
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: inventree.vzkn.eu
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1536Mi
          worker:
            image: *image
            args:
              - invoke
              - worker
            env: *env
            envFrom: *envFrom
            probes:
              startup: &workerprobe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - invoke
                      - worker-health
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 20
              liveness:
                <<: *workerprobe
                spec:
                  exec:
                    command:
                      - invoke
                      - worker-health
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: {enabled: false}
            securityContext: *securityContext
            resources:
              requests:
                cpu: 25m
                memory: 384Mi
              limits:
                memory: 1Gi
          # Static + authenticated media files, reverse proxy to gunicorn
          proxy:
            image:
              repository: docker.io/library/caddy
              tag: 2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
            probes:
              liveness: &caddyprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9090
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *caddyprobe
              startup: {enabled: false}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: inventree
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: self-hosted
        hostnames:
          - "inventree.vzkn.eu"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    configMaps:
      caddy:
        data:
          Caddyfile: |-
            {
                admin off
                auto_https off
                servers {
                    # Keep X-Forwarded-Proto/For set by Envoy
                    trusted_proxies static private_ranges
                }
            }

            :9090 {
                respond /healthz 200
            }

            :8080 {
                log
                encode gzip
                request_body {
                    max_size 100MB
                }

                handle_path /static/* {
                    header Access-Control-Allow-Origin *
                    header Access-Control-Allow-Methods GET,HEAD,OPTIONS
                    header Access-Control-Allow-Headers Authorization,Content-Type,User-Agent,traceparent
                    @preflight method OPTIONS
                    respond @preflight 204
                    root * /static
                    file_server
                }

                # Media is only served after gunicorn confirms the session (/auth/)
                handle_path /media/* {
                    root * /media
                    file_server
                    header Content-Disposition attachment
                    forward_auth 127.0.0.1:8000 {
                        uri /auth/
                    }
                }

                reverse_proxy 127.0.0.1:8000
            }
    persistence:
      data:
        existingClaim: inventree
        advancedMounts:
          inventree:
            migrate:
              - path: /home/inventree/data
            app:
              - path: /home/inventree/data
            worker:
              - path: /home/inventree/data
            proxy:
              - path: /media
                subPath: media
                readOnly: true
      static:
        type: emptyDir
        advancedMounts:
          inventree:
            migrate:
              - path: /static
            app:
              - path: /static
            proxy:
              - path: /static
                readOnly: true
      caddy-state:
        type: emptyDir
        advancedMounts:
          inventree:
            proxy:
              - path: /data
                subPath: data
              - path: /config
                subPath: config
      caddyfile:
        type: configMap
        identifier: caddy
        advancedMounts:
          inventree:
            proxy:
              - path: /etc/caddy/Caddyfile
                subPath: Caddyfile
                readOnly: true
