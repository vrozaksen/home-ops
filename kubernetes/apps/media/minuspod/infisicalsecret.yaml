---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name minuspod-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/media/minuspod
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          MINUSPOD_MASTER_PASSPHRASE: '{{ .MINUSPOD_MASTER_PASSPHRASE.Value }}'
          # LiteLLM virtual key (alias minuspod) — used for both LLM and Whisper
          OPENAI_API_KEY: '{{ .LITELLM_API_KEY.Value }}'
          WHISPER_API_KEY: '{{ .LITELLM_API_KEY.Value }}'
