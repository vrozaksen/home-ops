---
# yaml-language-server: $schema=https://schemas.vzkn.eu/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status
spec:
  providerRef:
    name: github-status
  # Kustomization events carry the origin Git revision (OCI artifact metadata).
  eventSources:
    - kind: Kustomization
      name: "*"
