exclude:
  platforms:
    - Doom
    - ports
    - psvita
    - ZBIOS
  roms:
    single_file:
      names:
        - "_info.txt"
        - "._*"
        - "zzz_*"
      extensions:
        - keys
        - txt
    multi_file:
      names: # Azahar user data in roms/3ds
        - cheats
        - config
        - gpu_drivers
        - log
        - nand
        - sdmc
        - shaders
        - sysdata

system:
  platforms:
    amiga1200: amiga
    ps: psx
