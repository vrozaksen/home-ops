---
### Token Auth (break-glass fallback for when Kanidm/OIDC is unavailable).
### Deliberately NOT replicated to Infisical — retrieve on demand with:
###   kubectl -n flux-system get secret headlamp-admin -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: flux-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: Secret
metadata:
  name: &name headlamp-admin
  namespace: flux-system
  annotations:
    kubernetes.io/service-account.name: *name
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: &name headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: *name
    namespace: flux-system
---
### OIDC Auth - Authentik admin group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: admin
    apiGroup: rbac.authorization.k8s.io
