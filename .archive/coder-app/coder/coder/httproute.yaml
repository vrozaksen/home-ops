---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  annotations:
    gatus.home-operations.com/endpoint: |-
      group: coder
spec:
  # The wildcard carries workspace apps: <app>--<workspace>--<user>.coder.vzkn.eu
  hostnames:
    - coder.vzkn.eu
    - "*.coder.vzkn.eu"
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: coder
          port: 80
