---
# Declarative role management, migrated from Cluster.spec.managed.roles (CNPG 1.30).
# Each role keeps its own lifecycle/status; passwords stay in the InfisicalSecret-
# materialized credentials. databaseRoleReclaimPolicy defaults to retain, so deleting
# a DatabaseRole leaves the PostgreSQL role (and its owned database) intact.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: bazarr
spec:
  cluster:
    name: postgres-arr
  name: bazarr
  ensure: present
  login: true
  passwordSecret:
    name: postgres-arr-bazarr-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: bazarr-anime
spec:
  cluster:
    name: postgres-arr
  name: bazarr_anime
  ensure: present
  login: true
  passwordSecret:
    name: postgres-arr-bazarr-anime-credentials
