---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./infisicalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # Patched animesubinfo provider (declares SSA/ASS source format) —
  # mounted over the upstream file, see persistence.provider-patch in the HR.
  - name: bazarr-anime-patches
    files:
      - animesubinfo.py=./resources/animesubinfo.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
