---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: printcost-app
    files:
      - ./app/Caddyfile
      - ./app/config.json
      - ./app/index.html
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # index.html is full of JS template literals (${...})
    kustomize.toolkit.fluxcd.io/substitute: disabled
