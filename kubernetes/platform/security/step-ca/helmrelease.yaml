---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: smallstep
spec:
  interval: 1h
  url: https://smallstep.github.io/helm-charts/
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-ca
spec:
  interval: 1h
  chart:
    spec:
      chart: step-certificates
      version: 1.30.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: smallstep
  values:
    fullnameOverride: step-ca
    # Chart bootstrap runs `step ca init` without --ssh — see README.
    bootstrap:
      enabled: false
    existingSecrets:
      enabled: true
      ca: true
      issuer: true
      certsAsSecret: true
      sshUserCa: true
      sshHostCa: true
      configAsSecret: false
    ca:
      name: vzkn.eu
      dns: ca.vzkn.eu,step-ca.security.svc.cluster.local,127.0.0.1
      address: :9000
      url: https://ca.vzkn.eu
      db:
        enabled: true
        persistent: true
        size: 1Gi
        storageClass: ceph-block
  postRenderers:
    - kustomize:
        patches:
          # Chart creates this ConfigMap empty and will not fill it while
          # existingSecrets is on, so the config is patched in — in git,
          # not in a secret.
          - target:
              kind: ConfigMap
              name: step-ca-config
            patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: step-ca-config
              data:
                ca.json: |
                  {
                    "root": "/home/step/certs/root_ca.crt",
                    "federateRoots": [],
                    "crt": "/home/step/certs/intermediate_ca.crt",
                    "key": "/home/step/secrets/intermediate_ca_key",
                    "address": "0.0.0.0:9000",
                    "dnsNames": [
                      "ca.vzkn.eu",
                      "step-ca.security.svc.cluster.local",
                      "127.0.0.1"
                    ],
                    "logger": {
                      "format": "json"
                    },
                    "db": {
                      "type": "badger",
                      "dataSource": "/home/step/db"
                    },
                    "ssh": {
                      "hostKey": "/home/step/secrets/ssh_host_ca_key",
                      "userKey": "/home/step/secrets/ssh_user_ca_key"
                    },
                    "authority": {
                      "claims": {
                        "minTLSCertDuration": "5m",
                        "maxTLSCertDuration": "24h",
                        "defaultTLSCertDuration": "24h",
                        "disableRenewal": false,
                        "minHostSSHCertDuration": "5m",
                        "maxHostSSHCertDuration": "1680h",
                        "defaultHostSSHCertDuration": "720h",
                        "minUserSSHCertDuration": "5m",
                        "maxUserSSHCertDuration": "24h",
                        "defaultUserSSHCertDuration": "16h"
                      },
                      "provisioners": [
                        {
                          "type": "OIDC",
                          "name": "kanidm",
                          "configurationEndpoint": "https://idm.vzkn.eu/oauth2/openid/step-ca/.well-known/openid-configuration",
                          "listenAddress": ":10000",
                          "claims": {
                            "enableSSHCA": true
                          }
                        }
                      ]
                    },
                    "tls": {
                      "cipherSuites": [
                        "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
                        "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
                        "TLS_AES_128_GCM_SHA256"
                      ],
                      "minVersion": 1.2,
                      "maxVersion": 1.3,
                      "renegotiation": false
                    }
                  }
                defaults.json: |
                  {
                    "ca-url": "https://ca.vzkn.eu",
                    "ca-config": "/home/step/config/ca.json",
                    "fingerprint": "a14616d00206a142b616ee62738f587f28778af01c4c93b97ccfd48b6eb04424",
                    "root": "/home/step/certs/root_ca.crt"
                  }
