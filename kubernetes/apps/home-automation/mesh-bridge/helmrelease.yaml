---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mesh-bridge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mesh-bridge:
        containers:
          app:
            image:
              repository: registry.vzkn.eu/containers/meshtastic-bridge
              tag: 2.7.11
              digest: sha256:4e600c88134cd62608e601547b4b81b324a164e95d92cab65a2e275a664fbb1d
            env:
              MESH_HOST: 10.20.0.215
              MQTT_HOST: mosquitto.database.svc.cluster.local
              CONTROL_TOPIC: vzkn/mesh/send
              STATUS_TOPIC: vzkn/mesh/status
              DEFAULT_CHANNEL: "2"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
