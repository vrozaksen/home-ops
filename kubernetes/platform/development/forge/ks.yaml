---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forge
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: infisical-operator
      namespace: security
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/platform/development/forge
  postBuild:
    substitute:
      APP: *app
      NS: &ns development
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_PGID: "1000"  # home is 1000:1000; default PGID 100 would restore wrong group
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
