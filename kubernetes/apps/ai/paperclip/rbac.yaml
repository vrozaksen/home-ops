---
# Read-only cluster access for agent runs (Review watches reconcile after merges). No secrets, no write verbs, no exec.
# The `paperclip` ServiceAccount is created by app-template; this file only grants it read access.
# yaml-language-server: $schema=https://schemas.vzkn.eu/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paperclip-agent-readonly
rules:
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs: &read
      - get
      - list
      - watch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs: *read
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - ocirepositories
    verbs: *read
  - apiGroups:
      - ""
    resources:
      - events
      - pods
      - pods/log
    verbs: *read
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs: *read
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - statefulsets
    verbs: *read
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs: *read
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paperclip-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: paperclip-agent-readonly
subjects:
  - kind: ServiceAccount
    name: paperclip
    namespace: ai
