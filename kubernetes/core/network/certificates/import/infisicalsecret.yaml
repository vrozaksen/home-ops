---
# NOTE: Bootstrap fallback - imports TLS cert from Infisical
# In Infisical, store tls.crt and tls.key as separate secrets in /kubernetes/network/certificates-import/
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name vzkn-eu-tls
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 0s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/network/certificates-import
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: network
      secretType: kubernetes.io/tls
      creationPolicy: Orphan
      template:
        includeAllSecrets: false
        metadata:
          # Must match what cert-manager writes for Certificate network/vzkn-eu
          # (../export/certificate.yaml): a wrong certificate-name or alt-names makes it
          # treat the secret as foreign (IncorrectCertificate) and reissue until LE rate-limits.
          annotations:
            cert-manager.io/alt-names: "*.home.vzkn.eu,*.s3.vzkn.eu,*.vzkn.eu,vzkn.eu"
            cert-manager.io/certificate-name: vzkn-eu
            cert-manager.io/common-name: ""
            cert-manager.io/ip-sans: ""
            cert-manager.io/issuer-group: ""
            cert-manager.io/issuer-kind: ClusterIssuer
            cert-manager.io/issuer-name: letsencrypt-production
            cert-manager.io/uri-sans: ""
          labels:
            controller.cert-manager.io/fao: "true"
        data:
          # The export pushes these base64-encoded (pushsecret.yaml: b64enc); decode
          # back to PEM or the gateways reject the secret and drop every HTTPS listener.
          tls.crt: '{{ .TLS_CRT.Value | b64dec }}'
          tls.key: '{{ .TLS_KEY.Value | b64dec }}'
