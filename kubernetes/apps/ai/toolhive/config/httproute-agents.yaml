---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
# LAN entry to the internal (read-only kubectl) gateway for agent daemons.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-agents
  annotations:
    gatus.home-operations.com/endpoint: |-
      group: ai
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - mcp-agents.vzkn.eu
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-gateway-internal
          port: 4483
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-agents
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-agents
  apiKeyAuth:
    credentialRefs:
      - name: mcp-gateway-api-keys
    extractFrom:
      - headers:
          - "X-API-Key"
    # The key never reaches the gateway backends.
    sanitize: true
