---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Local Ollama models (ragnarok, 10.100.0.102). Zero cost, often powered off.
# Timeout 120s = connect timeout; powered-off host must not hold requests long.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-qwen3
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: ollama_chat/qwen3:14b
    apiBase: http://10.100.0.102:11434
    timeout: 120
    additional:
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 40960
    maxOutputTokens: 8192
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-gemma3
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: ollama_chat/gemma3:12b
    apiBase: http://10.100.0.102:11434
    timeout: 120
    additional:
      order: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 8192
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
