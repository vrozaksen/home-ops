---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app abuse-reporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      abuse-reporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.vzkn.eu/containers/abuse-reporter
              tag: 1.0.0
            env:
              VICTORIALOGS_URL: http://victoria-logs.observability.svc.cluster.local:9428
              # Every report is a public, irreversible accusation, so sending is
              # opt-in and the tool refuses to start live without a key.
              DRY_RUN: "false"
              INTERVAL: 15m
              LOOKBACK: 20m
              DEDUP_TTL: 1h
              # A single connection with no login attempt is not evidence; that
              # alone drops roughly two thirds of the addresses seen.
              MIN_EVENTS: "2"
              MAX_REPORTS_PER_RUN: "100"
              MAX_REPORTS_PER_DAY: "900"
              # Ours, and so never reportable whatever the logs say: the
              # honeypot itself, bifrost, the home WAN address and Quad9.
              ALLOWLIST: 92.222.25.174/32,145.239.84.25/32,78.88.32.114/32,9.9.9.9/32,149.112.112.112/32
              ABUSEIPDB_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: abuseipdb-secret
                    key: ABUSEIPDB_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: 8080}
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /readyz, port: 8080}
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
