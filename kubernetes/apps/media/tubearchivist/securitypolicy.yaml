---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tubearchivist
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/tubearchivist
    clientID: tubearchivist
    clientSecret:
      name: kanidm-tubearchivist-oidc  # secret written by kanidm-provision, key client-secret
    redirectURL: https://tubearchivist.vzkn.eu/oauth2/callback
    # /logout is taken by TA itself
    logoutPath: /oauth2/logout
    cookieDomain: tubearchivist.vzkn.eu
    # Background fetch/XHR gets 401, not a 302: every redirect sets a fresh nonce
    # cookie pair and a polling tab overflows HTTP/2 headers (too_many_headers).
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    scopes:
      - "openid"
      - "email"
      - "profile"
  # app-template names the route `tubearchivist` with one route and
  # `tubearchivist-app` with several; cover both so a Helm rollback across
  # that change never leaves the app ungated
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tubearchivist
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tubearchivist-app
