---
cache:
  enabled: true
  # Pinned so the job-pod CNP can allow it (random port otherwise).
  port: 8088
  dir: /data/cache
container:
  docker_host: "-"
  workdir_parent: shared/workdir
host:
  workdir_parent: /data/act
log:
  level: info
plugins:
  k8s:
    address: unix:///plugin/forgejo-runner-k8s.sock
    options:
      namespace: development
      poll_timeout: 30m
      labels: "app.kubernetes.io/name=forgejo-runner-instance,app.kubernetes.io/instance=forgejo-runner"
runner:
  # 4 x 1Gi. Default class; ubuntu-latest and the legacy aliases.
  capacity: 4
  labels:
    - ubuntu-latest:k8s:/config/podspec-medium.yaml
    - cluster:k8s:/config/podspec-medium.yaml
    - ubuntu-24.04:k8s:/config/podspec-medium.yaml
    - default:k8s:/config/podspec-medium.yaml
    - docker:k8s:/config/podspec-medium.yaml
  timeout: 2h
  # Lets in-flight jobs finish on rollout; within terminationGracePeriodSeconds.
  shutdown_timeout: 3m
