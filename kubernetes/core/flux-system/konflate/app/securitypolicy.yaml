---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: konflate
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/konflate
    clientID: konflate
    clientSecret:
      name: kanidm-konflate-oidc  # secret written by kanidm-provision, key client-secret
    redirectURL: https://konflate.vzkn.eu/oauth2/callback
    logoutPath: /oauth2/logout
    cookieDomain: konflate.vzkn.eu
    # Background fetch/XHR gets 401, not a 302: every redirect sets a fresh nonce
    # cookie pair and a polling tab overflows HTTP/2 headers (too_many_headers).
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    scopes:
      - "openid"
      - "email"
      - "profile"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: konflate
