---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: printguard
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/printguard
    clientID: printguard
    clientSecret:
      name: kanidm-printguard-oidc  # secret written by kanidm-provision, key client-secret
    redirectURL: https://printguard.vzkn.eu/oauth2/callback
    logoutPath: /logout
    cookieDomain: printguard.vzkn.eu
    # The SPA polls and streams: those get 401 instead of a 302 nonce-cookie pile-up
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    scopes:
      - "openid"
      - "email"
      - "profile"
      - "groups"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: printguard
