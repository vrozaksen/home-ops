---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      whisper:
        annotations:
          reloader.stakater.com/auto: "true"
        # One per worker (anti-affinity below), so a surge pod has nowhere to go.
        replicas: 3
        strategy: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        initContainers:
          fetch-model:
            image: &whisperImage
              # renovate: datasource=docker depName=ghcr.io/ggml-org/whisper.cpp
              repository: ghcr.io/ggml-org/whisper.cpp
              tag: main-vulkan@sha256:ee6734843c531c7cbc7911d45842a280327267f5168db199527b18f183cde193
            # ENTRYPOINT is ["bash", "-c"] -> one arg. No shell vars, Flux eats them.
            args:
              - >-
                set -e;
                if [ ! -s /models/ggml-large-v3-turbo-q5_0.bin ]; then
                curl -fsSL --retry 5 --retry-delay 5
                -o /models/ggml-large-v3-turbo-q5_0.bin.part
                https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin;
                mv /models/ggml-large-v3-turbo-q5_0.bin.part
                /models/ggml-large-v3-turbo-q5_0.bin;
                fi
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *whisperImage
            # --dtw = word timestamps for MinusPod's ad boundaries; flash attn
            # silently kills it. Add --no-gpu to force CPU (see ks.yaml).
            args:
              - >-
                whisper-server
                --host 0.0.0.0
                --port 8765
                --model /models/ggml-large-v3-turbo-q5_0.bin
                --inference-path /v1/audio/transcriptions
                --dtw large.v3.turbo
                --no-flash-attn
                --threads 4
            env:
              MESA_SHADER_CACHE_DIR: /tmp/mesa
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8765
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              # Shader compile + model load.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
            # Root: Talos has no render group, so a non-root UID cannot open
            # the /dev/dri node the DRA driver injects.
            securityContext: *hardened
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      labels:
        app.kubernetes.io/component: &component whisper
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: *component
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: whisper-gpu
    service:
      app:
        controller: whisper
        ports:
          http:
            port: *port
    persistence:
      # ~574MB, re-fetched per pod start; no RWX class to share it from.
      models:
        type: emptyDir
        advancedMounts:
          whisper:
            fetch-model:
              - path: /models
            app:
              - path: /models
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          whisper:
            fetch-model:
              - path: /tmp
            app:
              - path: /tmp
