---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app multica-agent
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: multica
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/multica-agent
  postBuild:
    substitute:
      APP: *app
      NS: &ns ai
      # Claude login, repo checkouts, mise toolchains and caches.
      KOPIUR_CAPACITY: 40Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
