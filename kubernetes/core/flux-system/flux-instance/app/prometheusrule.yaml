---
# yaml-language-server: $schema=https://schemas.vzkn.eu/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 15m
          annotations:
            summary: Flux instance metric is missing
            description: |
              The flux_instance_info metric for the Flux instance in namespace {{ $labels.exported_namespace }} is not available.
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 15m
          annotations:
            summary: Flux instance {{ $labels.name }} is not ready
            description: |
              The Flux instance in namespace {{ $labels.exported_namespace }} is not ready.
              Reason: {{ $labels.reason }}
          labels:
            severity: critical

        - alert: HelmReleaseReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="HelmRelease", ready!="True"} == 1
          for: 30m
          annotations:
            summary: >-
              HelmRelease {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: warning

        - alert: KustomizationReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="Kustomization", ready!="True"} == 1
          for: 30m
          annotations:
            summary: >-
              Kustomization {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: warning

        # Sync source health (HOPS-67). SourceVerified=False also flips Ready.
        - alert: FluxSyncSourceNotReady
          expr: |-
            gotk_resource_info{customresource_kind=~"GitRepository|OCIRepository", exported_namespace="flux-system", name="flux-system", ready!="True"} == 1
          for: 15m
          annotations:
            summary: >-
              Flux sync source {{ $labels.customresource_kind }}/flux-system is not ready
            description: |
              The cluster keeps running the last good artifact but receives no new changes.
              Check the source conditions (fetch, cosign verification) and the flux-publish workflow.
          labels:
            severity: critical

        # Dual-run only: the OCI artifact must follow Git. OCI revision is tag@digest,
        # so compare the commit from origin_revision. Remove with the GitRepository.
        - alert: FluxOCIArtifactBehindGit
          expr: |-
            label_replace(gotk_resource_info{customresource_kind="GitRepository", exported_namespace="flux-system", name="flux-system"}, "sha", "$1", "revision", ".*sha1:([0-9a-f]+)")
            unless on (sha)
            label_replace(gotk_resource_info{customresource_kind="OCIRepository", exported_namespace="flux-system", name="flux-system"}, "sha", "$1", "origin_revision", ".*sha1:([0-9a-f]+)")
          for: 30m
          annotations:
            summary: OCI artifact flux-system lags behind the Git revision for 30m
            description: |
              Git is at {{ $labels.revision }} but the OCIRepository has not caught up.
              Likely a failed flux-publish run or a failed signature verification.
          labels:
            severity: warning
