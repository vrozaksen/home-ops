---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# API key auth for external clients that can't do OIDC (Paperclip, scripts).
# Extracts x-api-key header; validates against Secret keys.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-gateway-api-key
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-gateway
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: mcp-gateway-api-keys
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
