---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memini
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              # Embeddings via in-cluster TEI (bge-m3, 1024-dim) — zero cost, no LLM.
              MEMINI_EMBED_BASE_URL: http://text-embeddings-inference.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: BAAI/bge-m3
              MEMINI_EMBED_DIMS: "1024"
              # LLM pipeline (consolidation, memory_answer, query rewrite).
              # Local Ollama first via LiteLLM "assistant" alias; Haiku fallback
              # when ragnarok is off (tiny background cost only, never per-message).
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: assistant
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini-llm
                    key: api-key
              MEMINI_LLM_MAX_TOKENS: "4096"
              MEMINI_DISTILL_ON_WRITE: false
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
            envFrom:
              - secretRef:
                  name: memini
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
          ui:
            port: 8081
    route:
      ui:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: ai
        hostnames:
          - "{{ .Release.Name }}.vzkn.eu"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: memini
      api-keys:
        enabled: true
        type: secret
        name: memini-api-keys
        globalMounts:
          - path: /etc/memini/api-keys.yaml
            subPath: api-keys.yaml
            readOnly: true
    serviceMonitor:
      main:
        enabled: true
