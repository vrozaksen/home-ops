---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Local Ollama models (ragnarok, 10.100.0.102). Pricing = electricity marginal cost.
# Hardware: 9800X3D + 9070 XT, 32GB RAM. Idle ~75W, inference ~300W extra.
# Electricity: 1.50 PLN/kWh ≈ 0.375 USD/kWh.
# Qwen3 14B: ~35 tok/s output, ~1000 tok/s prefill on 9070 XT.
# Output: 300W × (1000/35)s = 8571J = 0.00238 kWh × 0.375 = 0.00089 USD/1K tok → 8.9e-07
# Input (prefill): 300W × 1s = 300J = 0.000083 kWh × 0.375 = 0.000031 USD/1K tok → 3.1e-08
# Rounded up to cover idle amortization during inference windows.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-qwen3
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: ollama_chat/qwen3:14b
    apiBase: http://10.100.0.102:11434
    additional:
      timeout: 120
      order: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 40960
    maxOutputTokens: 8192
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 1e-06
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Gemma3 12B: ~40 tok/s output on 9070 XT. Slightly cheaper per token.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-gemma3
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: ollama_chat/gemma3:12b
    apiBase: http://10.100.0.102:11434
    additional:
      timeout: 120
      order: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 8192
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 8e-07
