---
# yaml-language-server: $schema=https://schemas.vzkn.eu/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-capacity-rules
spec:
  groups:
    - name: cluster-capacity.rules
      rules:
        - alert: NodeMemoryPressure
          expr: |-
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
          for: 10m
          annotations:
            summary: >-
              Node {{ $labels.instance }} memory >85% for 10m ({{ $value | humanizePercentage }})
          labels:
            severity: warning

        - alert: NodeMemoryStalled
          # PSI full-stall, not a % threshold: 12Gi CP nodes sit at >93% used
          # from apiserver working set while nothing OOMs. Real pre-OOM pressure
          # shows as the kernel spending time with ALL tasks stalled on reclaim.
          expr: |-
            rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.10
          for: 2m
          annotations:
            summary: >-
              Node {{ $labels.instance }} under real memory pressure — {{ $value | humanizePercentage }} of time fully stalled on reclaim (OOM precursor)
          labels:
            severity: critical

        - alert: KubeAPIServerHighMemory
          expr: |-
            container_memory_working_set_bytes{container="kube-apiserver"} > 6e9
          for: 15m
          annotations:
            summary: >-
              kube-apiserver on {{ $labels.node }} using {{ $value | humanize1024 }}B — approaching OOM on 8.8Gi allocatable CP
          labels:
            severity: warning

        - alert: NasArrayAlmostFull
          # Stock NodeFilesystem* % thresholds are silenced for /mnt/user: on a 62TB
          # array 1% is ~600GB and free space has sat at 1.1-1.5% for months.
          expr: |-
            node_filesystem_avail_bytes{instance="aincrad.home.vzkn.eu:9100",mountpoint="/mnt/user"}
              / node_filesystem_size_bytes{instance="aincrad.home.vzkn.eu:9100",mountpoint="/mnt/user"} * 100 < 0.5
          for: 1h
          annotations:
            summary: >-
              aincrad /mnt/user has only {{ $value | printf "%.2f" }}% free
          labels:
            severity: warning

    - name: etcd-disk.rules
      rules:
        - alert: EtcdQuorumDisksSlow
          # One slow CP disk is tolerated (skuld has sat at ~4-5ms for weeks).
          # Two means every quorum waits on a slow fsync -> leader elections and
          # the etcd* alert storm, which the AlertmanagerConfig inhibits behind this.
          expr: |-
            count(
              (
                rate(node_disk_write_time_seconds_total{device=~"sd.|nvme.n."}[15m])
                / rate(node_disk_writes_completed_total{device=~"sd.|nvme.n."}[15m])
              ) * on (instance) group_left (nodename) node_uname_info
              and on (nodename) label_replace(kube_node_role{role="control-plane"}, "nodename", "$1", "node", "(.*)")
              > 0.002
            ) >= 2
          for: 30m
          annotations:
            summary: >-
              {{ $value }} control-plane disks average >2ms per write — etcd quorum is fsync-bound, expect leader elections
          labels:
            severity: critical
