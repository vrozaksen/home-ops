---
# yaml-language-server: $schema=https://schemas.vzkn.eu/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embed-tools-optimizer
spec:
  modelName: embed-tools
  proxyRef: litellm
  params:
    model: openai/intfloat/multilingual-e5-base
    apiBase: http://text-embeddings-optimizer.ai.svc.cluster.local:8080/v1
    # TEI doesn't authenticate, but LiteLLM's OpenAI client requires a non-empty key.
    apiKey: not-needed
  info:
    mode: embedding
    maxInputTokens: 512
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
