---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    # One runner per size class: capacity is per runner process, so this is
    # the only way to cap concurrency per class. Config lives in ./resources.
    controllers:
      small: &controller
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
          labels:
            app.kubernetes.io/component: forgejo-runner
          securityContext:
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 100
            runAsNonRoot: true
            runAsUser: 1000
          # Covers runner shutdown_timeout (3m) plus the plugin's job cleanup.
          terminationGracePeriodSeconds: 300
        initContainers:
          # Native sidecar: outlives the runner, so jobs drain on shutdown.
          k8s-plugin:
            image:
              repository: git.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            restartPolicy: Always
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          runner: &runner
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner-small.yaml \
                  --url "http://forgejo-http:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/small-uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/small-token
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext: *securityContext
      medium:
        <<: *controller
        containers:
          runner:
            <<: *runner
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner-medium.yaml \
                  --url "http://forgejo-http:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/medium-uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/medium-token
      large:
        <<: *controller
        containers:
          runner:
            <<: *runner
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner-large.yaml \
                  --url "http://forgejo-http:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/large-uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/large-token
    defaultPodOptions:
      priorityClassName: cluster-low
    persistence:
      config:
        type: configMap
        name: forgejo-runner-resources
        globalMounts:
          - path: /config
            readOnly: true
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        globalMounts:
          - path: /etc/forgejo-runner-secret
            readOnly: true
    rbac:
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner
      roles:
        forgejo-runner:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - list
                - watch
                - create
                - get
                - delete
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - list
                - watch
                - get
            - apiGroups:
                - batch
              resources:
                - jobs
              verbs:
                - list
                - watch
                - create
                - get
                - delete
    serviceAccount:
      forgejo-runner: {}
