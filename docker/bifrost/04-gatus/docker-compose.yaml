---
name: gatus

services:
  gatus:
    image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    restart: unless-stopped
    environment:
      GATUS_DELAY_START_SECONDS: 5
      GATUS_CONFIG_PATH: /config
      GATUS_WEB_PORT: 8080
      PUSHOVER_TOKEN: ${GATUS_PUSHOVER_TOKEN}
      PUSHOVER_USER_KEY: ${GATUS_PUSHOVER_KEY}
      REMOTE_STATUS_HOSTNAME: status.vzkn.eu
      REMOTE_HEARTBEAT_TOKEN: ${BIFROST_HEARTBEAT_TOKEN}
    volumes:
      - gatus-config:/config
    configs:
      - source: gatus_config
        target: /config/config.yaml
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gatus-config:

configs:
  gatus_config:
    file: ./config/config.yaml

networks:
  default:
    name: edge
    external: true
