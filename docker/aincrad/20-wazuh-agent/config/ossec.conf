<!--
  Wazuh agent - aincrad (Unraid).
  Cilium announces LoadBalancer IPs over BGP only, so this host - which shares
  the Servers VLAN with the pool - reaches the manager via a node IP + nodePort.
-->
<ossec_config>
  <client>
    <server>
      <address>10.10.0.21</address>
      <port>31053</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>60</notify_time>
    <time-reconnect>120</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.10.0.21</manager_address>
      <port>30558</port>
      <agent_name>aincrad</agent_name>
      <!-- Compose places secrets under /run/secrets regardless of target. -->
      <authorization_pass_path>/run/secrets/authd_pass</authorization_pass_path>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Unraid keeps / on a RAM disk rebuilt at boot, so only persistent paths
       are worth watching: the flash config and the appdata pool. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Yield to everything else on the NAS: lowest scheduling priority and a
         capped event rate, so a scan degrades rather than starves the host. -->
    <process_priority>19</process_priority>
    <max_eps>50</max_eps>

    <!-- Shares, users, SSH host keys, plugin state. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/boot/config</directories>
    <!-- App configs and the *.vzkn.eu wildcard private key. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/mnt/blaze/appdata/caddy</directories>

    <!-- appdata as a whole is deliberately NOT watched. It is mostly
         application payload -- node_modules, caches, databases -- which hit the
         100k entry limit on tdarr alone and took the host down within minutes
         of every scan. Add individual config paths here instead. -->

    <!-- Belt and braces, in case a watched path ever grows one of these. -->
    <ignore type="sregex">/node_modules/|/\.git/|/cache/|/logs?/</ignore>

    <!-- Churn with no security value. -->
    <ignore type="sregex">\.log$|\.tmp$|\.db-journal$|\.sqlite-wal$|\.sqlite-shm$</ignore>
    <ignore>/mnt/blaze/appdata/doco-cd/data</ignore>
    <ignore>/boot/config/plugins/dynamix/dynamix.cfg</ignore>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- Unraid keeps syslog in RAM only, so these exist only while the box is up.
       Enabling its syslog server would make this materially more useful. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
