---
# Pauses lower-priority Paperclip agents as the shared Claude Max windows fill up,
# and resumes only the agents it paused itself. No LLM involved.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-usage-guard
data:
  policy.json: |-
    {
      "connection": {"company": "48850f6e-4d59-4e74-846b-9b754fcbf9f8", "id": "3913531e-b2b5-47c9-bdde-bb4ee1eaaf2c"},
      "companies": ["48850f6e-4d59-4e74-846b-9b754fcbf9f8", "d07a207c-256c-43c1-a32f-db767791c9bc"],
      "hysteresis": 10,
      "tiers": [
        {"name": "low", "fiveHour": 70, "weekly": 75, "weekAhead": 15,
         "agents": ["Apps", "Deps", "Watch", "SecOps", "Verification", "Platform", "Mechanical", "Procurement"]},
        {"name": "high", "fiveHour": 90, "weekly": 90, "weekAhead": 30,
         "agents": ["SRE", "Review", "Firmware", "OS", "Hardware", "Security"]}
      ]
    }
  guard.py: |-
    import datetime, json, os, urllib.request

    API = os.environ["PAPERCLIP_API"]
    TOKEN = os.environ["PAPERCLIP_TOKEN"]
    POLICY = json.load(open("/etc/guard/policy.json"))
    FLAG = "usageGuardPaused"

    def call(method, path, body=None):
        req = urllib.request.Request(API + path, method=method,
                                     data=json.dumps(body).encode() if body is not None else None,
                                     headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
            return json.loads(raw) if raw else None

    conn = POLICY["connection"]
    usage = call("GET", f"/companies/{conn['company']}/ai-connections/{conn['id']}/usage")
    limits = {l["id"]: l for l in usage.get("limits", [])}
    five = (limits.get("five_hour") or {}).get("usedPercent")
    week = limits.get("seven_day") or {}
    weekly = week.get("usedPercent")
    if five is None or weekly is None:
        print("usage unavailable; no change")
        raise SystemExit(0)
    ahead = 0.0
    if week.get("resetsAt"):
        reset = datetime.datetime.fromisoformat(week["resetsAt"].replace("Z", "+00:00"))
        left = (reset - datetime.datetime.now(datetime.timezone.utc)).total_seconds()
        elapsed_pct = max(0.0, min(100.0, 100 * (1 - left / 604800)))
        ahead = weekly - elapsed_pct
    print(f"five_hour={five}% weekly={weekly}% week_ahead={ahead:+.0f}pp")

    hyst = POLICY["hysteresis"]
    want_paused, may_resume = set(), set()
    for tier in POLICY["tiers"]:
        over = five >= tier["fiveHour"] or weekly >= tier["weekly"] or ahead >= tier["weekAhead"]
        clear = five < tier["fiveHour"] - hyst and weekly < tier["weekly"] - hyst and ahead < tier["weekAhead"] - hyst
        if over:
            want_paused.update(tier["agents"])
        elif clear:
            may_resume.update(tier["agents"])

    for company in POLICY["companies"]:
        for agent in call("GET", f"/companies/{company}/agents"):
            name, meta = agent["name"], agent.get("metadata") or {}
            mine = bool(meta.get(FLAG))
            if name in want_paused and agent["status"] != "paused":
                call("POST", f"/agents/{agent['id']}/pause", {})
                call("PATCH", f"/agents/{agent['id']}", {"metadata": {**meta, FLAG: True}})
                print(f"paused {name}")
            elif name in may_resume and mine and agent["status"] == "paused":
                call("POST", f"/agents/{agent['id']}/resume", {})
                call("PATCH", f"/agents/{agent['id']}", {"metadata": {k: v for k, v in meta.items() if k != FLAG}})
                print(f"resumed {name}")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperclip-usage-guard
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: guard
              image: docker.io/library/python:3.15-alpine
              command:
                - "python3"
                - "/etc/guard/guard.py"
              env:
                - name: PAPERCLIP_API
                  value: https://paperclip.vzkn.eu/api
                - name: PAPERCLIP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: paperclip-usage-guard
                      key: PAPERCLIP_USAGE_GUARD_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              volumeMounts:
                - name: guard
                  mountPath: /etc/guard
          volumes:
            - name: guard
              configMap:
                name: paperclip-usage-guard
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name paperclip-usage-guard
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/paperclip
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          PAPERCLIP_USAGE_GUARD_TOKEN: '{{ .PAPERCLIP_USAGE_GUARD_TOKEN.Value }}'
