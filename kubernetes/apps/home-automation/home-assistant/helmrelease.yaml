---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 130m
                memory: 640Mi
              limits:
                memory: 1280Mi
          codeserver:
            image: &codeserverImage
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            args:
              - "--auth"
              - "none"
              - "--user-data-dir"
              - "/config/.vscode"
              - "--extensions-dir"
              - "/config/.vscode"
              - "--port"
              - "12321"
              - "/config"
            env:
              # HOME is ephemeral; keep Claude Code sessions/settings on the PVC
              CLAUDE_CONFIG_DIR: /config/.claude
              <<: &miseEnv
                MISE_DATA_DIR: /mise
                MISE_CACHE_DIR: /mise/cache
                MISE_STATE_DIR: /mise/state
                # writable global config, so `mise use -g` persists
                MISE_CONFIG_DIR: /mise/config
                PATH: /mise/bin:/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            probes:
              liveness: &codeserver-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &codeserverPort 12321
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *codeserver-probes
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 30m
                memory: 256Mi
              limits:
                # headroom for Claude Code (node process) in the terminal
                memory: 2Gi
          # Installs the toolchain from /etc/mise/config.toml onto /mise in the
          # background; best effort, never blocks or fails the pod.
          tools:
            image: *codeserverImage
            command:
              - /bin/sh
              - -c
              - |
                set -u
                bin=/mise/bin/mise
                if [ "v$($bin --version 2>/dev/null | cut -d' ' -f1)" != "$MISE_VERSION" ]; then
                  mkdir -p /mise/bin /tmp/mise-dl && cd /tmp/mise-dl &&
                  base="https://github.com/jdx/mise/releases/download/$MISE_VERSION" &&
                  curl -fsSLO "$base/mise-$MISE_VERSION-linux-x64" &&
                  curl -fsSL "$base/SHASUMS256.txt" | grep " \./mise-$MISE_VERSION-linux-x64\$" | sed 's# \./# #' | sha256sum -c - &&
                  install -m 0755 "mise-$MISE_VERSION-linux-x64" "$bin" ||
                  echo "mise $MISE_VERSION download failed"
                  rm -rf /tmp/mise-dl
                fi
                $bin install --yes || echo "mise install failed"
                exec sleep infinity
            env:
              <<: *miseEnv
              # renovate: datasource=github-releases depName=jdx/mise
              MISE_VERSION: v2026.11.10
            securityContext:
              allowPrivilegeEscalation: false
              # mise/curl write to /tmp and $HOME
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.0.43
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
          codeserver:
            port: *codeserverPort
          # Shelly gen1 CoIoT push; DSR keeps the device source IP HA matches on
          coiot:
            port: 5683
            protocol: UDP
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: home-automation
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.vzkn.eu"
          - hass.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
      codeserver:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: home-automation
        hostnames:
          - hass-code.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *codeserverPort
    configMaps:
      mise:
        data:
          # Baseline CLI tools for Claude Code in the code-server terminal.
          config.toml: |
            [tools]
            bun = "latest"
            deno = "latest"
            jq = "latest"
            # node 26+ needs libatomic.so.1, absent from the code-server image
            node = "24"
            python = "3.14"
            uv = "latest"
            yq = "latest"
    persistence:
      mise:
        existingClaim: "{{ .Release.Name }}-tools"
        advancedMounts:
          home-assistant:
            codeserver:
              - path: /mise
            tools:
              - path: /mise
      mise-config:
        type: configMap
        identifier: mise
        advancedMounts:
          home-assistant:
            codeserver: &miseConfigMount
              - path: /etc/mise/config.toml
                subPath: config.toml
                readOnly: true
            tools: *miseConfigMount
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
