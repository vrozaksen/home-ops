---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orphan-secrets
automountServiceAccountToken: false
---
# Cluster-wide read on Secrets is unavoidable for this check; it is bound only to
# this ServiceAccount, and the Job never prints anything but namespace/name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-secrets
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "secrets.infisical.com"
    resources:
      - "infisicalsecrets"
    verbs:
      - "get"
      - "list"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-secrets
subjects:
  - kind: ServiceAccount
    name: orphan-secrets
    namespace: security
