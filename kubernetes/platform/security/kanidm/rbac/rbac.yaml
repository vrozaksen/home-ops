---
# One Role per namespace that has a kanidm-provision-oauth2-* ConfigMap (data.targetNamespace in
# ../provisioning/oauth2.yaml); keep the two lists in sync. Lives in its own Flux Kustomization
# (kanidm-rbac) because the kanidm one forces targetNamespace: security.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanidm-provision-write-secret
  namespace: ai
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanidm-provision-write-secret
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kanidm-provision-write-secret
subjects:
  - kind: ServiceAccount
    name: kanidm-provision
    namespace: security
---
