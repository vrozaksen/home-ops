apiVersion: v1
kind: ConfigMap
metadata:
  name: kanidm-provision-oauth2-external
  labels:
    kanidm_config: "1"
  annotations:
    reloader.stakater.com/match: "true"
data:
  # External apps (aincrad NAS) — no k8s block, no secret write-back; manage their secrets manually.
  # unraid-api 4.37 sends PKCE only for its built-in Unraid.net provider and strips usePkce from custom ones.
  oauth2.json: |-
    {
      "groups": {}, "persons": {}, "systems": { "oauth2": {
        "unraid": {
          "present": true, "displayName": "Unraid",
          "originUrl": [
            "https://aincrad.home.vzkn.eu:4443/graphql/api/auth/oidc/callback",
            "https://10-10-0-11.3828b3207b44b41ec022cef26f1c8d3490778869.myunraid.net:4443/graphql/api/auth/oidc/callback"
          ],
          "originLanding": "https://10-10-0-11.3828b3207b44b41ec022cef26f1c8d3490778869.myunraid.net:4443/",
          "scopeMaps": { "admins": ["openid", "email", "profile", "groups"] },
          "allowInsecureClientDisablePkce": true
        },
        "silo": {
          "present": true, "displayName": "Silo",
          "originUrl": "https://silo.vzkn.eu/api/v2/auth/oauth/7/callback",
          "originLanding": "https://silo.vzkn.eu/",
          "scopeMaps": { "users": ["openid", "email", "profile", "groups"] },
          "preferShortUsername": true
        }
      } } }
