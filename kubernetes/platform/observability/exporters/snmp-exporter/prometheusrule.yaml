---
# yaml-language-server: $schema=https://schemas.vzkn.eu/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter-rules
spec:
  groups:
    - name: snmp-exporter.rules
      rules:
        # Thresholds mirror the PDU's own: near-overload 8A, overload 10A
        - alert: PDUNearOverload
          expr: rPDULoadStatusLoad / 10 >= 8
          for: 5m
          annotations:
            summary: >-
              PDU {{ $labels.instance }} load is {{ $value }}A, near overload (>=8A)
          labels:
            severity: warning

        - alert: PDUOverload
          expr: rPDULoadStatusLoad / 10 >= 10
          for: 1m
          annotations:
            summary: >-
              PDU {{ $labels.instance }} load is {{ $value }}A, overload (>=10A)
          labels:
            severity: critical

        - alert: PDUScrapeFailed
          expr: up{job="snmp-exporter"} == 0
          for: 15m
          annotations:
            summary: >-
              SNMP scrape of PDU {{ $labels.instance }} has been failing for 15m
          labels:
            severity: warning
