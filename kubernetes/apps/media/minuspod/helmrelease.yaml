---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minuspod
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      minuspod:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/ttlequals0/minuspod
              repository: docker.io/ttlequals0/minuspod
              tag: 2.97.27-cpu@sha256:83c8d88f43964c1581d5d76c8659adbbc1827b4873d78dd6f3c99d3e23090ef3
            env:
              TZ: Europe/Warsaw
              BASE_URL: https://minuspod.vzkn.eu
              MINUSPOD_PORT: &port 8000
              # The LLM that locates ad segments in the transcript. Key comes
              # from Infisical; model choice is made in the UI.
              LLM_PROVIDER: anthropic
              MINUSPOD_REQUIRE_AUTH: "true"
              # No OIDC support -- this app has its own login only.
              MINUSPOD_ALLOW_PUBLIC_PROCESSING: "false"
              # Without this the real client IP never reaches the app, so login
              # lockout and per-IP rate limits silently never fire. One hop.
              MINUSPOD_TRUSTED_PROXY_COUNT: "1"
              MINUSPOD_ENABLE_HSTS: "true"
              SESSION_COOKIE_SECURE: "auto"
            envFrom:
              - secretRef:
                  name: minuspod-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              # entrypoint.sh fixes volume ownership as root, then drops to the
              # bundled minuspod user (1000) with setpriv.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Transcoding a backlog must not be interrupted mid-episode.
      terminationGracePeriodSeconds: 360
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: minuspod
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: media
        hostnames:
          - minuspod.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
        # The UI lives under /ui/ and nothing is served at /, which just 404s.
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /ui/
                  statusCode: 302
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: minuspod
                port: 8000
    persistence:
      data:
        existingClaim: minuspod
        globalMounts:
          - path: /app/data
