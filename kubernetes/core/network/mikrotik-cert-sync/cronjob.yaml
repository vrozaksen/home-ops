---
# yaml-language-server: $schema=https://schemas.vzkn.eu/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mikrotik-cert-sync
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: mikrotik-cert-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            # Secret volumes land as root-owned; without fsGroup the 0440 key
            # is unreadable to uid 65534.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cert-sync
              # Tools baked in rather than `apk add`ed at runtime, which made
              # every binary newer than the image layer and fired seven Falco
              # criticals per run.
              # renovate: datasource=docker depName=registry.vzkn.eu/containers/toolbox
              image: registry.vzkn.eu/containers/toolbox:3.24@sha256:c1b864a0a0b227534844d801f145a9e64693d4f266dc2922a282a9d40ad43d28
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # -i everywhere: OpenSSH takes the default ~/.ssh from the
                  # passwd entry rather than the HOME env var, and uid 65534
                  # resolves to nobody, whose home is /.
                  KEY=/tmp/.ssh/id_ed25519
                  mkdir -p /tmp/.ssh
                  cat /ssh-key/SSH_PRIVATE_KEY > "$$KEY"
                  echo >> "$$KEY"
                  chmod 600 "$$KEY"

                  KUBE_TOKEN=$$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  SECRET=$$(curl -sS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: Bearer $$KUBE_TOKEN" \
                    "https://kubernetes.default.svc/api/v1/namespaces/network/secrets/vzkn-eu-tls")

                  echo "$$SECRET" | jq -r '.data["tls.crt"]' | base64 -d > /tmp/router.crt
                  echo "$$SECRET" | jq -r '.data["tls.key"]' | base64 -d > /tmp/router.key

                  echo "Certificate details:"
                  openssl x509 -in /tmp/router.crt -noout -subject -dates | tr '\n' ' '
                  echo

                  SSH_OPTS="-i $$KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
                  ROUTER_HOST="router.home.vzkn.eu"
                  ROUTER_USER="cert-sync"

                  scp $$SSH_OPTS /tmp/router.crt /tmp/router.key "$${ROUTER_USER}@$${ROUTER_HOST}:/"

                  ssh $$SSH_OPTS "$${ROUTER_USER}@$${ROUTER_HOST}" '
                    /certificate remove [find where name~"router"]
                    /certificate import file-name=router.crt passphrase=""
                    /certificate import file-name=router.key passphrase=""
                    :delay 1s
                    /ip service set www-ssl certificate=router.crt_0
                    /ip service set api-ssl certificate=router.crt_0
                  '
                  echo "Certificate synced to MikroTik router"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              volumeMounts:
                - name: ssh-key
                  mountPath: /ssh-key
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: ssh-key
              secret:
                secretName: mikrotik-cert-sync-secret
                defaultMode: 0440
            - name: tmp
              emptyDir: {}
