---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Publish Flux Artifact"

on:
  workflow_dispatch:
  # Self-heal: a failed run on the last commit of the day would otherwise leave
  # the cluster behind main until the next push. Same SHA -> same digest.
  schedule:
    - cron: "23 * * * *"
  # No paths filter: every commit gets an artifact, so the synced revision always
  # equals main HEAD (commit statuses, FluxOCIArtifactBehindGit alert).
  push:
    branches:
      - "main"

permissions:
  contents: read

# Never cancel a running publish (it could stop between push and tag). GitHub
# keeps one pending run per group, so superseded pending runs are cancelled and
# `main` always ends on the newest commit.
concurrency:
  group: flux-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Flux Artifact
    # GitHub-hosted on purpose: the cluster must never build its own sync source.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless (Fulcio OIDC)
    env:
      ARTIFACT: ghcr.io/${{ github.repository_owner }}/manifests/home-ops
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Scheduled runs only republish when main moved past the published revision;
      # re-signing the same digest would pile signatures onto its sha256-* tag.
      - name: Check Published Revision
        id: check
        if: github.event_name == 'schedule'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo="${ARTIFACT#ghcr.io/}"
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          cur=$(curl -fsS -H "Authorization: Bearer ${tok}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${repo}/manifests/main" \
            | jq -r '.annotations["org.opencontainers.image.revision"] // ""') || cur=""
          if [ "${cur}" = "${REF_NAME}@sha1:${GITHUB_SHA}" ]; then
            echo "published revision is current (${cur}), nothing to do"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Mise
        if: steps.check.outputs.skip != 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          cache: false
          # Install only what this job needs; the repo .mise.toml has ~20 tools and
          # one broken bump (infisical 0.43.144, no linux asset) failed the publish.
          install_args: github:fluxcd/flux2 github:home-operations/flate
          tool_versions: |
            github:fluxcd/flux2 2.9.6
            github:home-operations/flate 0.6.5

      - name: Setup Cosign
        if: steps.check.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Gate: an artifact that fails to render must never reach the registry.
      # Retried: it fetches every chart, and one upstream registry blip (falco on
      # ghcr, 2026-10-13) must not block publishing for the whole cluster.
      - name: Validate Manifests
        if: steps.check.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            flate test all -p ./kubernetes/flux/cluster --no-progress --allow-missing-secrets && exit 0
            echo "::warning::validation attempt ${attempt} failed, retrying"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push, sign and move `main` in ONE job: `main` must never point at an
      # unsigned digest, or source-controller verification blocks the cluster.
      - name: Push Artifact
        if: steps.check.outputs.skip != 'true'
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          digest_ref=$(flux push artifact "oci://${ARTIFACT}:sha-${GITHUB_SHA}" \
            --path=. \
            --ignore-paths='/*,!/kubernetes/,.git/' \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${REF_NAME}@sha1:${GITHUB_SHA}" \
            --reproducible \
            --output json | jq -r '.repository + "@" + .digest')
          [ -n "${digest_ref}" ] && [ "${digest_ref}" != "@" ] || { echo "no digest from flux push"; exit 1; }
          echo "digest-ref=${digest_ref}" >> "${GITHUB_OUTPUT}"

      - name: Sign Artifact
        if: steps.check.outputs.skip != 'true'
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest-ref }}
        run: cosign sign --yes "${DIGEST_REF}"

      - name: Tag Artifact
        if: steps.check.outputs.skip != 'true'
        run: flux tag artifact "oci://${ARTIFACT}:sha-${GITHUB_SHA}" --tag main

      # Optional until the generic-hmac Receiver exists (HOPS-64); skipped when unset.
      - name: Notify Flux Receiver
        if: steps.check.outputs.skip != 'true'
        env:
          RECEIVER_URL: ${{ secrets.FLUX_OCI_RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.FLUX_OCI_RECEIVER_TOKEN }}
        run: |-
          if [ -z "${RECEIVER_URL}" ] || [ -z "${RECEIVER_TOKEN}" ]; then
            echo "receiver not configured, relying on OCIRepository interval"
            exit 0
          fi
          body=$(jq -cn --arg sha "${GITHUB_SHA}" '{revision: $sha}')
          sig=$(printf '%s' "${body}" | openssl dgst -sha256 -hmac "${RECEIVER_TOKEN}" | awk '{print $2}')
          curl -fsS --retry 3 -H "Content-Type: application/json" \
            -H "X-Signature: sha256=${sig}" -d "${body}" "${RECEIVER_URL}"
