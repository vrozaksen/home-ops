spec:
  modelName: writer
  proxyRef: litellm
  params:
    model: anthropic/claude-haiku-4-5
    apiKey: os.environ/ANTHROPIC_API_KEY
    additional:
      order: 2
  info:
    mode: chat
    maxInputTokens: 200000
    maxOutputTokens: 64000
    supportsVision: true
    extra:
      input_cost_per_token: 1e-06
      output_cost_per_token: 5e-06
