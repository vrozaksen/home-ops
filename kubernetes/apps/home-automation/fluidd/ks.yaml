---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app fluidd
spec:
  dependsOn:
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/home-automation/fluidd
  postBuild:
    substitute:
      APP: *app
      NS: &ns home-automation
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
