---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.64.0@sha256:b46002c29618df79b708872c9380129481afd17ad1423940cc3b16b81f4282fe
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount: flux-mcp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
          env:
            # In-cluster mode: no KUBECONFIG; uses the pod service account.
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
  groupRef:
    name: mcp-tools
