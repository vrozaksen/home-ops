---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      # 1000:100 matches the owner of the 3dprint share, so files stay editable from the workstation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      manyfold:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              # Rootless rebuild of manyfold3d/manyfold (upstream image is s6 as root)
              repository: ghcr.io/bjw-s-labs/manyfold
              tag: 0.154.4@sha256:ebb4590f5a49dea22309ed986ceec8bb371297540af9ed312993174be6d15e65
            # Ruby's Dir.tmpdir rejects world-writable dirs without the sticky bit (emptyDir is 0777)
            command:
              - /bin/sh
              - -c
              - mkdir -p -m 0700 /tmp/app && exec /usr/bin/catatonit -- /entrypoint.sh
            env: &env
              TMPDIR: /tmp/app
              XDG_CACHE_HOME: /app/tmp/cache
              PLUGINS_PATH: /plugins
              PORT: &port 3214
              WEB_CONCURRENCY: "2"
              RAILS_MAX_THREADS: "5"
              PUBLIC_HOSTNAME: manyfold.vzkn.eu
              HTTPS_ONLY: enabled
              MULTIUSER: enabled
              DATABASE_ADAPTER: postgresql
              DATABASE_HOST: pooler-manyfold-rw.home-automation.svc.cluster.local
              DATABASE_PORT: "5432"
              DATABASE_NAME: manyfold
              DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-manyfold-app
                    key: username
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-manyfold-app
                    key: password
              REDIS_URL: redis://manyfold-dragonfly.home-automation.svc.cluster.local:6379/0
              OIDC_NAME: Kanidm
              OIDC_ISSUER: https://idm.vzkn.eu/oauth2/openid/manyfold
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-manyfold-oidc
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-manyfold-oidc
                    key: client-secret
              FORCE_OIDC: enabled
            envFrom: &envFrom
              - secretRef:
                  name: manyfold-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 2Gi
      # NFS gives no inotify, and Manyfold has no built-in scan schedule; this only queues the job
      scan:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image: *image
            command:
              - /bin/sh
              - -c
              - mkdir -p -m 0700 /tmp/app && cd /app && exec bundle exec bin/manyfold libraries scan
            env: *env
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 768Mi
    service:
      app:
        controller: manyfold
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: home-automation
        hostnames:
          - manyfold.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      library:
        type: nfs
        server: aincrad.home.vzkn.eu
        path: /mnt/blaze/3dprint
        advancedMounts:
          manyfold:
            app:
              - path: /libraries/3dprint
      scratch:
        type: emptyDir
        advancedMounts:
          manyfold:
            app: &scratch
              - path: /tmp
                subPath: tmp
              - path: /app/tmp
                subPath: app-tmp
              - path: /app/log
                subPath: app-log
              - path: /plugins
                subPath: plugins
          scan:
            app: *scratch
