---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tubearchivist
spec:
  components:
    - ../../../components/dragonfly
    - ../../../components/kopiur
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: infisical-operator
      namespace: security
    - name: kanidm
      namespace: security
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  path: ./kubernetes/apps/media/tubearchivist
  postBuild:
    substitute:
      APP: *app
      NS: &ns media
      KOPIUR_CAPACITY: 2Gi
      DRAGONFLY_MEMORY: 256Mi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *ns
  wait: false
