---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: snmp-exporter
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 9.16.1
  url: oci://ghcr.io/prometheus-community/charts/prometheus-snmp-exporter
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: snmp-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    # Hand-written config (replaces the bundled snmp.yml): the default set of
    # modules has nothing for the APC rPDU subtree, only apcups.
    config: |-
      modules:
        apc_rpdu:
          walk:
            - 1.3.6.1.4.1.318.1.1.12.2.3.1  # rPDULoadStatus table
            - 1.3.6.1.4.1.318.1.1.12.3.5.1  # rPDUOutletStatus table
          metrics:
            - name: rPDULoadStatusLoad
              oid: 1.3.6.1.4.1.318.1.1.12.2.3.1.1.2
              type: gauge
              help: Phase load in tenths of amperes
              indexes:
                - labelname: phase
                  type: gauge
            - name: rPDULoadStatusLoadState
              oid: 1.3.6.1.4.1.318.1.1.12.2.3.1.1.3
              type: gauge
              help: 1=lowLoad 2=normal 3=nearOverload 4=overload
              indexes:
                - labelname: phase
                  type: gauge
            - name: rPDUOutletStatusOutletState
              oid: 1.3.6.1.4.1.318.1.1.12.3.5.1.1.4
              type: gauge
              help: Outlet state 1=on 2=off
              indexes:
                - labelname: outlet
                  type: gauge
              lookups:
                - labels: [outlet]
                  labelname: outlet_name
                  oid: 1.3.6.1.4.1.318.1.1.12.3.5.1.1.2
                  type: DisplayString
    # Auths (with the community) come from a second config file rendered by
    # the InfisicalSecret; snmp_exporter merges multiple --config.file flags
    extraArgs:
      - --config.file=/run/secrets/snmp-exporter/auths.yaml
    extraSecretMounts:
      - name: snmp-auths
        mountPath: /run/secrets/snmp-exporter
        secretName: snmp-exporter-secret
        readOnly: true
        defaultMode: 420
    serviceMonitor:
      enabled: true
      params:
        - name: pdu
          module:
            - apc_rpdu
          target: 10.10.0.7
          auth:
            - pdu_v1
      path: /snmp
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __param_target
          targetLabel: instance
