---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      etcd-defrag:
        # Talos never defrags etcd itself; freed pages after compaction stay
        # allocated and trip etcdDatabaseHighFragmentationRatio.
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          ttlSecondsAfterFinished: 86400
          backoffLimit: 1
        serviceAccount:
          name: etcd-defrag
        # talosctl image is distroless (no shell): init containers run one
        # member at a time so quorum never loses two members at once.
        initContainers:
          eir:
            image: &image
              repository: ghcr.io/siderolabs/talosctl
              tag: v1.14.1@sha256:30791b2ec3ab1dec4093c342306159ebfe876eb9f646d5a710b853844a65ba13
            args:
              - "--nodes"
              - "10.10.0.16"
              - "etcd"
              - "defrag"
            resources: &resources
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
          saga:
            dependsOn: eir
            image: *image
            args:
              - "--nodes"
              - "10.10.0.15"
              - "etcd"
              - "defrag"
            resources: *resources
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args:
              - "--nodes"
              - "10.10.0.17"
              - "etcd"
              - "defrag"
            resources: *resources
            securityContext: *securityContext
    persistence:
      talos:
        type: secret
        name: etcd-defrag
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
