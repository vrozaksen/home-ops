---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vmalert
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.48.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-alert
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vmalert
  values:
    serviceMonitor:
      enabled: true
    server:
      # Prometheus cannot query logs, so this runs LogsQL rules against
      # VictoriaLogs' Prometheus-compatible stats API.
      datasource:
        url: http://victoria-logs.observability.svc.cluster.local:9428
      notifier:
        alertmanager:
          url: http://alertmanager-operated.observability.svc.cluster.local:9093
      extraArgs:
        rule.defaultRuleType: vlogs
        # No remoteWrite target, so alert state is rebuilt on restart.
        datasource.queryStep: 5m
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
      config:
        alerts:
          groups:
            - name: suricata
              type: vlogs
              interval: 1m
              rules:
                # Suricata severity 1 is its highest. Anything at that level on
                # a home network is worth waking someone for.
                - alert: SuricataHighSeverityAlert
                  expr: >-
                    hostname:"cardinal" AND '"event_type":"alert"' AND
                    '"severity":1' AND _time:10m
                    | stats count() as hits
                    | filter hits:>0
                  labels:
                    severity: critical
                    category: security
                  annotations:
                    summary: "Suricata high-severity alert on cardinal"
                    description: |
                      {{ $value }} severity-1 Suricata alerts in the last 10 minutes.
                      Investigate in the SOC console at https://cardinal.home.vzkn.eu

                # Measured baseline is 10-15 alerts per 10min of benign noise
                # (STUN, abused-service and TLD rules), so 100 is ~7x that.
                - alert: SuricataAlertSpike
                  expr: >-
                    hostname:"cardinal" AND '"event_type":"alert"' AND _time:10m
                    | stats count() as hits
                    | filter hits:>100
                  labels:
                    severity: warning
                    category: security
                  annotations:
                    summary: "Suricata alert volume spike on cardinal"
                    description: |
                      {{ $value }} Suricata alerts in 10 minutes, above the usual baseline.

            - name: kanidm-auth
              type: vlogs
              interval: 1m
              rules:
                # Kanidm logs every request; a failed credential or unknown user
                # on /v1/auth returns 4xx with the real client IP.
                - alert: KanidmAuthFailureSpike
                  expr: >-
                    kubernetes.pod_name:"kanidm-0" AND "uri: /v1/auth" AND
                    ("status_code: 401" OR "status_code: 403" OR "status_code: 404")
                    AND _time:10m
                    | extract 'client_address: "<client_ip>"'
                    | stats by (client_ip) count() as failures
                    | filter failures:>20
                  labels:
                    severity: warning
                    category: security
                  annotations:
                    summary: "Kanidm auth failures from {{ index .Labels \"client_ip\" }}"
                    description: |
                      {{ $value }} failed authentication attempts in 10 minutes from
                      {{ index .Labels "client_ip" }} against idm.vzkn.eu.

                - alert: KanidmAuthFailureFlood
                  expr: >-
                    kubernetes.pod_name:"kanidm-0" AND "uri: /v1/auth" AND
                    ("status_code: 401" OR "status_code: 403" OR "status_code: 404")
                    AND _time:10m
                    | extract 'client_address: "<client_ip>"'
                    | stats by (client_ip) count() as failures
                    | filter failures:>100
                  labels:
                    severity: critical
                    category: security
                  annotations:
                    summary: "Sustained brute-force against Kanidm from {{ index .Labels \"client_ip\" }}"
                    description: |-
                      {{ $value }} failed authentication attempts in 10 minutes from
                      {{ index .Labels "client_ip" }}. idm.vzkn.eu is internet-facing;
                      consider blocking the source at the edge.

            - name: wazuh
              type: vlogs
              interval: 1m
              rules:
                # The manager syslogs alerts as JSON under app_name "ossec".
                # Wazuh scores rules 0-15: 12+ is its "high importance" band
                # (rootkits, tampering, repeated auth failures from one source).
                - alert: WazuhCriticalAlert
                  expr: >-
                    app_name:"ossec" AND _time:10m
                    | unpack_json
                    | filter rule.level:>=12
                    | stats by (agent.name) count() as hits
                    | filter hits:>0
                  labels:
                    severity: critical
                    category: security
                  annotations:
                    summary: "Wazuh critical alert on {{ index .Labels \"agent.name\" }}"
                    description: |-
                      {{ $value }} Wazuh alerts at level 12 or above in 10 minutes on
                      {{ index .Labels "agent.name" }}. Details at https://wazuh.vzkn.eu

                # Level 10-11 is worth knowing about but not worth interrupting
                # anything, so it rides the quiet route.
                - alert: WazuhHighSeverityAlert
                  expr: >-
                    app_name:"ossec" AND _time:10m
                    | unpack_json
                    | filter rule.level:>=10 rule.level:<12
                    | stats by (agent.name) count() as hits
                    | filter hits:>0
                  labels:
                    severity: warning
                    category: security
                  annotations:
                    summary: "Wazuh high-severity alerts on {{ index .Labels \"agent.name\" }}"
                    description: |-
                      {{ $value }} Wazuh alerts at level 10-11 in 10 minutes on
                      {{ index .Labels "agent.name" }}.

                # The manager going quiet is itself a finding: it means alerts
                # stopped flowing, which looks identical to "nothing is wrong".
                - alert: WazuhAlertStreamSilent
                  expr: >-
                    app_name:"ossec" AND _time:6h
                    | stats count() as hits
                    | filter hits:<1
                  labels:
                    severity: warning
                    category: security
                  annotations:
                    summary: "No Wazuh alerts received for 6 hours"
                    description: |-
                      Nothing has arrived from wazuh-csyslogd. Either the manager
                      stopped forwarding or the syslog path to VictoriaLogs broke.

            # Kernel-level storage faults, read from logs rather than metrics.
            # node_filesystem_readonly does NOT cover them: it exports 142 series
            # cluster-wide and none under /var/lib/kubelet, so the 2026-09-20
            # incident (90 RBD mounts remounted read-only on alfheim, unnoticed
            # for 3.5 days) would not have fired it. These read what the kernel
            # actually said, via the kmsg bridge.
            - name: node-storage
              type: vlogs
              interval: 1m
              rules:
                - alert: NodeFilesystemError
                  expr: >-
                    log_source:"talos-kmsg" AND facility:"kern" AND
                    ("EXT4-fs error" OR "remounting read-only" OR "I/O error") AND
                    _time:10m
                    | stats by (node) count() as hits
                    | filter hits:>0
                  labels:
                    severity: critical
                    category: storage
                  annotations:
                    summary: "Kernel filesystem errors on {{ $labels.node }}"
                    description: |-
                      {{ $value }} kernel filesystem errors in 10 minutes. Check
                      `talosctl -n {{ $labels.node }} read /proc/mounts | grep emergency_ro`
                      -- a node in this state needs a reboot, not a pod delete.

                # rbd map failing with -108 (ESHUTDOWN) means the client is
                # blocklisted; it precedes mounts going read-only.
                - alert: NodeRbdMapFailure
                  expr: >-
                    log_source:"talos-kmsg" AND facility:"kern" AND
                    ("rbd: map failed" OR "result -108") AND _time:10m
                    | stats by (node) count() as hits
                    | filter hits:>0
                  labels:
                    severity: critical
                    category: storage
                  annotations:
                    summary: "RBD map failures on {{ $labels.node }}"
                    description: |-
                      {{ $value }} in 10 minutes. Usually a Ceph blocklist entry;
                      check `ceph osd blocklist ls`.

                # Fires on the backlog left by the 2026-09-23 cephx rotation
                # until those pre-rotation RBD mappings are refreshed. That is
                # the alert working, not a false positive.
                - alert: CephxAuthFailure
                  expr: >-
                    log_source:"talos-kmsg" AND "msgr authentication failed" AND
                    _time:30m
                    | stats by (node) count() as hits
                    | filter hits:>10
                  labels:
                    severity: warning
                    category: storage
                  annotations:
                    summary: "Ceph client authentication failing on {{ $labels.node }}"
                    description: |-
                      {{ $value }} failures in 30 minutes. A kernel RBD session is
                      using a cephx identity that no longer exists; remounting the
                      affected volume clears it.

            # The other half of the VmalertDown symmetry in prometheusrule.yaml:
            # Prometheus cannot alert on its own death either. vmalert is a
            # separate process reading a separate store, so it survives it.
            # Silence is a safe signal here -- the container logs continuously
            # (~1000 lines per 10 min at steady state).
            - name: prometheus-deadman
              type: vlogs
              interval: 1m
              rules:
                - alert: PrometheusDeadman
                  expr: >-
                    kubernetes.container_name:"prometheus" AND _time:15m
                    | stats count() as hits
                    | filter hits:<1
                  labels:
                    severity: critical
                    category: observability
                  annotations:
                    summary: "Prometheus has logged nothing for 15 minutes"
                    description: |-
                      Nothing from the prometheus container. It is down, wedged,
                      or its node is gone -- and nothing it evaluates is firing.
