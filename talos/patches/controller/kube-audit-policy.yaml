---
# Talos defaults to blanket Metadata, which is mostly volume. Keep the
# security-relevant verbs at full fidelity and drop the churn.
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  omitStages:
    - RequestReceived
  rules:
    # Leader-election and probe traffic: volume without signal.
    - level: None
      resources:
        - group: coordination.k8s.io
          resources:
            - "leases"
    - level: None
      nonResourceURLs:
        - /healthz*
        - /readyz*
        - /livez*
        - /version
        - /metrics
    # Metadata only: records access without recording secret contents.
    - level: Metadata
      resources:
        - group: ""
          resources:
            - "secrets"
            - "configmaps"
        - group: secrets.infisical.com
    - level: RequestResponse
      resources:
        - group: ""
          resources:
            - "pods/exec"
            - "pods/attach"
            - "pods/portforward"
        - group: rbac.authorization.k8s.io
    - level: Request
      verbs:
        - "create"
        - "update"
        - "patch"
        - "delete"
      resources:
        - group: ""
          resources:
            - "pods"
        - group: apps
    # Controller reconcile reads are ~55% of the volume. Reads by real users
    # still land in the catch-all below; secrets matched earlier regardless.
    - level: None
      verbs:
        - "get"
        - "list"
        - "watch"
      userGroups:
        - "system:serviceaccounts"
        - "system:nodes"
    - level: Metadata
