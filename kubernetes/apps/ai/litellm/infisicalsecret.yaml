---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Master key + provider keys for the operator-managed LiteLLMProxy.
# Virtual keys (memini-llm, minuspod, sure) are now declarative
# LiteLLMVirtualKey CRs — operator generates Secrets, apps reference those directly.
# Required: LITELLM_MASTER_KEY, LITELLM_SALT_KEY (both "sk-..."; salt must NEVER rotate).
# Provider keys (ANTHROPIC/DEEPSEEK/GROQ/XAI_API_KEY) are synced as-is.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name litellm-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/litellm
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: true
