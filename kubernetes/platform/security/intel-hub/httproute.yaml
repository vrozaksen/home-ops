---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intel-hub
  annotations:
    gatus.home-operations.com/endpoint: |-
      group: security
spec:
  # envoy-INTERNAL only, deliberately. AbuseIPDB's terms forbid redistributing
  # their data, so this must never be reachable from outside the LAN.
  hostnames:
    - intel.vzkn.eu
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: intel-hub
          namespace: security
          port: 8080
