---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# API keys for MCP clients that can't do OIDC (Multica daemons, scripts): checked by
# Envoy on mcp-agents.vzkn.eu (httproute-agents.yaml); key name = client id.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name mcp-gateway-api-keys
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/toolhive
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          paperclip: '{{ .TOOLHIVE_PAPERCLIP_API_KEY.Value }}'
          multica: '{{ .TOOLHIVE_MULTICA_API_KEY.Value }}'
