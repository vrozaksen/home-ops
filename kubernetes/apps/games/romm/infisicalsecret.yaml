---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name romm-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/games/romm
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: games
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          ROMM_AUTH_SECRET_KEY: '{{ .ROMM_AUTH_SECRET_KEY.Value }}'
          IGDB_CLIENT_ID: '{{ .IGDB_CLIENT_ID.Value }}'
          IGDB_CLIENT_SECRET: '{{ .IGDB_CLIENT_SECRET.Value }}'
          SCREENSCRAPER_USER: '{{ .SCREENSCRAPER_USER.Value }}'
          SCREENSCRAPER_PASSWORD: '{{ .SCREENSCRAPER_PASSWORD.Value }}'
          STEAMGRIDDB_API_KEY: '{{ .STEAMGRIDDB_API_KEY.Value }}'
          RETROACHIEVEMENTS_API_KEY: '{{ .RETROACHIEVEMENTS_API_KEY.Value }}'
