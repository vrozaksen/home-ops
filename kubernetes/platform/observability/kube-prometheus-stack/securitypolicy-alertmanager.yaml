---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: alertmanager
spec:
  oidc:
    provider:
      issuer: https://idm.vzkn.eu/oauth2/openid/alertmanager
    clientID: alertmanager
    clientSecret:
      name: kanidm-alertmanager-oidc  # secret written by kanidm-provision, key client-secret
    redirectURL: https://alertmanager.vzkn.eu/oauth2/callback
    logoutPath: /logout
    cookieDomain: alertmanager.vzkn.eu
    # Background fetch/XHR gets 401, not a 302: every redirect sets a fresh nonce
    # cookie pair and a polling tab overflows HTTP/2 headers (too_many_headers).
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    scopes:
      - "openid"
      - "email"
      - "profile"
      - "groups"
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-alertmanager
