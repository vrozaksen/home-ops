---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: victoria-logs-auth
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/observability/victoria-logs
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: victoria-logs-auth
      secretNamespace: observability
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          partition-manage: '{{ .PARTITION_MANAGE_AUTH_KEY.Value }}'
          force-merge: '{{ .FORCE_MERGE_AUTH_KEY.Value }}'
          force-flush: '{{ .FORCE_FLUSH_AUTH_KEY.Value }}'
          log-new-streams: '{{ .LOG_NEW_STREAMS_AUTH_KEY.Value }}'
