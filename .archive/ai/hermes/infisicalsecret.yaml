---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Required keys in Infisical /kubernetes/ai/hermes:
#   MEMINI_API_KEY — per-agent memini key (same value as HERMES_MEMINI_KEY
#                    in /kubernetes/ai/memini)
#   API_SERVER_KEY — bearer token for the OpenAI-compatible API server
#                    (Paperclip / other programmatic clients)
# LiteLLM key comes from operator Secret litellm-key-hermes (not Infisical).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name hermes
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/hermes
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: true
