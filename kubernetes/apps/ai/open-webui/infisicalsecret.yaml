---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Required keys in Infisical /kubernetes/ai/open-webui:
#   WEBUI_SECRET_KEY — session/JWT signing key (openssl rand -hex 32)
# LiteLLM key: operator Secret litellm-key-open-webui. OIDC: kanidm-open-webui-oidc.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name open-webui
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/open-webui
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          WEBUI_SECRET_KEY: '{{ .WEBUI_SECRET_KEY.Value }}'
