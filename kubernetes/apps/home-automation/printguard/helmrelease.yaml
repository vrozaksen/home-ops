---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: printguard
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      # Image has no USER (root by default); upstream supports a numeric non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      printguard:
        containers:
          app:
            image:
              repository: ghcr.io/oliverbravery/printguard
              tag: 3.0.1@sha256:a2ee98c90ce88711d2577afc70e5713ba41d672214b4a841f6c67e5af8416c4e
            env:
              PORT: &port 8000
              # Host header allowlist; probes hit the pod IP, which always passes
              PRINTGUARD_ORIGINS: https://printguard.vzkn.eu
              PRINTGUARD_PLUGINS: "off"
              PRINTGUARD_CAMERAS: auto
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: printguard
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
    route:
      app:
        annotations:
          # Behind OIDC: a probe only ever sees the login redirect
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - printguard.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: printguard
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
