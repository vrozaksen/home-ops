---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  genconfig:
    desc: Generate Talos configuration
    dir: '{{.TALOS_DIR}}'
    cmds:
      - infisical run --env=prod --projectId=da94b011-9a7d-408b-92d9-55be47efe750 --path=/bootstrap --recursive -- talhelper genconfig
    preconditions:
      - infisical secrets --env=prod --projectId=da94b011-9a7d-408b-92d9-55be47efe750 --path=/bootstrap --plain --silent
      - test -f talconfig.yaml
      - test -f talsecret.yaml
      - which talhelper

  apply-node:
    desc: Apply Talos config to a node [HOSTNAME=required] [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmds:
      - task: down
      - talosctl apply-config --nodes {{.HOSTNAME}} --mode={{.MODE}} --file clusterconfig/main-{{.HOSTNAME}}.yaml --talosconfig {{.ROOT_DIR}}/talosconfig
      - talosctl --nodes {{.CP_NODE}} health --talosconfig {{.ROOT_DIR}}/talosconfig
      - task: up
    vars:
      MODE: '{{.MODE | default "auto"}}'
      CP_NODE:
        sh: talosctl --talosconfig {{.ROOT_DIR}}/talosconfig config info --output json | jq --raw-output '.endpoints[0]'
    requires:
      vars:
        - HOSTNAME
    preconditions:
      - talosctl --nodes {{.HOSTNAME}} get machineconfig --talosconfig {{.ROOT_DIR}}/talosconfig
      - test -f talconfig.yaml
      - test -f {{.ROOT_DIR}}/talosconfig

  apply-cluster:
    desc: Apply the Talos config on all nodes for an existing cluster
    vars:
      HOSTNAMES:
        sh: kubectl get nodes --output=jsonpath='{.items[*].metadata.name}'
    cmds:
      - for: {var: HOSTNAMES}
        task: apply-node
        vars:
          HOSTNAME: '{{.ITEM}}'
    preconditions:
      - talosctl config info --talosconfig {{.ROOT_DIR}}/talosconfig
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/talosconfig

  soft-nuke:
    desc: Resets nodes back to maintenance mode so you can re-deploy again straight after
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper gencommand reset --out-dir clusterconfig --config-file talconfig.yaml --extra-flags "--reboot --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --graceful=false --wait=false" | bash
    preconditions:
      - test -n main

  hard-nuke:
    desc: Resets nodes back completely and reboots them
    prompt: This will destroy your cluster and reset the nodes... continue?
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper gencommand reset --out-dir clusterconfig --config-file talconfig.yaml --extra-flags "--reboot --graceful=false --wait=false" | bash
    preconditions:
      - test -n main

  reboot-node:
    desc: Reboot Talos on a single node [HOSTNAME=required]
    cmds:
      - task: down
      - talosctl --nodes {{.HOSTNAME}} reboot --talosconfig {{.ROOT_DIR}}/talosconfig
      - talosctl --nodes {{.CP_NODE}} health --talosconfig {{.ROOT_DIR}}/talosconfig
      - task: up
    vars:
      CP_NODE:
        sh: talosctl --talosconfig {{.ROOT_DIR}}/talosconfig config info --output json | jq --raw-output '.endpoints[0]'
    requires:
      vars:
        - HOSTNAME
    preconditions:
      - talosctl --nodes {{.HOSTNAME}} get machineconfig --talosconfig {{.ROOT_DIR}}/talosconfig
      - talosctl config info --talosconfig {{.ROOT_DIR}}/talosconfig
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - which talosctl

  reboot-cluster:
    desc: Reboot Talos across the whole cluster
    prompt: This will reboot all of the cluster nodes. Are you sure you want to continue?
    vars:
      HOSTNAMES:
        sh: talosctl config info --output json | jq --join-output '[.nodes[]] | join(",")'
    cmds:
      - for: {var: HOSTNAMES}
        task: reboot-node
        vars:
          HOSTNAME: '{{.ITEM}}'
      - task: :kubernetes:cleanse-pods
    preconditions:
      - talosctl config info --talosconfig {{.ROOT_DIR}}/talosconfig
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/talosconfig

  shutdown-cluster:
    desc: Gracefully shutdown the whole cluster (suspend Flux/Kopiur, prep Ceph, workers then control plane)
    prompt: Shutdown the Talos cluster ... continue?
    cmds:
      - task: :kubernetes:ks-suspend
      - task: :kopiur:state-suspend
      # Wait only for ACTIVE jobs to drain — Failed jobs never complete and would wedge a wait-for-complete
      - until [[ -z "$(kubectl get jobs --all-namespaces --output jsonpath='{.items[?(@.status.active)].metadata.name}')" ]]; do sleep 5; done
      - until kubectl wait cephcluster --for=jsonpath=.status.ceph.health=HEALTH_OK --timeout=10m --all --all-namespaces &>/dev/null; do sleep 5; done
      - kubectl --namespace rook-ceph exec deploy/rook-ceph-tools -- ceph osd set noout
      - kubectl --namespace rook-ceph exec deploy/rook-ceph-tools -- ceph osd set norebalance
      - talosctl shutdown --nodes {{.WORKER_NODES}} --force --talosconfig {{.ROOT_DIR}}/talosconfig
      # No --wait on the control plane: apid endpoints die mid-shutdown, tracking would error
      - talosctl shutdown --nodes {{.CP_NODES}} --force --wait=false --talosconfig {{.ROOT_DIR}}/talosconfig
    vars:
      WORKER_NODES:
        sh: kubectl get nodes --selector '!node-role.kubernetes.io/control-plane' --output jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{","}{end}' | sed 's/,$//'
      CP_NODES:
        sh: kubectl get nodes --selector 'node-role.kubernetes.io/control-plane' --output jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{","}{end}' | sed 's/,$//'
    preconditions:
      - '[[ -n "{{.WORKER_NODES}}" && -n "{{.CP_NODES}}" ]]'
      - talosctl config info --talosconfig {{.ROOT_DIR}}/talosconfig
      - kubectl --namespace rook-ceph get deploy rook-ceph-tools
      - test -f {{.ROOT_DIR}}/talosconfig
      - which talosctl kubectl flux

  startup-cluster:
    desc: Resume the cluster after power-on (wait for nodes, clear Ceph flags, resume Flux/Kopiur)
    cmds:
      - until kubectl wait nodes --all --for=condition=Ready --timeout=15m &>/dev/null; do sleep 10; done
      - until kubectl --namespace rook-ceph wait deploy/rook-ceph-tools --for=condition=available --timeout=10m &>/dev/null; do sleep 10; done
      - kubectl --namespace rook-ceph exec deploy/rook-ceph-tools -- ceph osd unset noout
      - kubectl --namespace rook-ceph exec deploy/rook-ceph-tools -- ceph osd unset norebalance
      - until kubectl wait cephcluster --for=jsonpath=.status.ceph.health=HEALTH_OK --timeout=10m --all --all-namespaces &>/dev/null; do sleep 10; done
      - task: :kubernetes:ks-resume
      - task: :kopiur:state-resume
      - task: :kubernetes:cleanse-pods
    preconditions:
      - which kubectl flux

  kubeconfig:
    desc: Generate the kubeconfig for a Talos cluster
    cmd: talosctl kubeconfig --nodes {{.TALOS_CONTROLLER}} --force {{.ROOT_DIR}}
    vars:
      TALOS_CONTROLLER:
        sh: talosctl --talosconfig {{.ROOT_DIR}}/talosconfig config info --output json --talosconfig {{.ROOT_DIR}}/talosconfig | jq --raw-output '.endpoints[]' | shuf -n 1
    preconditions:
      - talosctl config info --talosconfig {{.ROOT_DIR}}/talosconfig
      - test -f {{.ROOT_DIR}}/talosconfig
      - which talosctl

  down:
    internal: true
    cmds:
      # Suspend first: kopiur is what creates the jobs, so waiting on them
      # before suspending is a race the wait can lose indefinitely.
      - task: :kopiur:state-suspend
      - until kubectl wait cephcluster --for=jsonpath=.status.ceph.health=HEALTH_OK --timeout=10m --all --all-namespaces &>/dev/null; do sleep 5; done
      # Wait only for ACTIVE jobs — Failed jobs never complete and would wedge a wait-for-complete
      - until [[ -z "$(kubectl get jobs --all-namespaces --output jsonpath='{.items[?(@.status.active)].metadata.name}')" ]]; do sleep 5; done
    preconditions:
      - which kubectl

  up:
    internal: true
    cmds:
      - until kubectl wait cephcluster --for=jsonpath=.status.ceph.health=HEALTH_OK --timeout=10m --all --all-namespaces &>/dev/null; do sleep 5; done
      # Wait only for ACTIVE jobs — Failed jobs never complete and would wedge a wait-for-complete
      - until [[ -z "$(kubectl get jobs --all-namespaces --output jsonpath='{.items[?(@.status.active)].metadata.name}')" ]]; do sleep 5; done
      - task: :kopiur:state-resume
    preconditions:
      - which kubectl
