---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
# Public gateway for claude.ai (DCR public client + PKCE, upstream login via Kanidm).
# Only the mcp-public group is aggregated; cluster tools stay on the internal mcp.vzkn.eu.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-public
spec:
  authServerConfig:
    issuer: https://mcp-pub.vzkn.eu
    # Shared with mcp-gateway: tokens are still bound to this issuer and audience.
    signingKeySecretRefs:
      - name: vmcp-auth-server-secret
        key: signing-key
    hmacSecretRefs:
      - name: vmcp-auth-server-secret
        key: hmac-key
    # Redis keys are prefixed with {namespace:name}, so the Dragonfly is shared safely.
    storage:
      type: redis
      redis:
        addr: vmcp-dragonfly.ai.svc.cluster.local:6379
        aclUserConfig:
          passwordSecretRef:
            name: vmcp-auth-server-secret
            key: redis-password
    tokenLifespans:
      accessTokenLifespan: 1h
      refreshTokenLifespan: 168h
      authCodeLifespan: 10m
    upstreamProviders:
      - name: kanidm
        type: oidc
        oidcConfig:
          issuerUrl: https://idm.vzkn.eu/oauth2/openid/mcp-public
          clientId: mcp-public
          clientSecretRef:
            name: kanidm-mcp-public-oidc
            key: client-secret
          redirectUri: https://mcp-pub.vzkn.eu/oauth/callback
          scopes:
            - openid
            - profile
            - email
            - groups
  groupRef:
    name: mcp-public
  telemetryConfigRef:
    name: prometheus
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        healthCheckInterval: 30s
        unhealthyThreshold: 3
        statusReportingInterval: 5m
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: public-oidc
      audience: https://mcp-pub.vzkn.eu/mcp
      resourceUrl: https://mcp-pub.vzkn.eu/mcp
      scopes:
        - openid
        - profile
        - email
        - offline_access
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: INSECURE_DISABLE_URL_VALIDATION
              value: "true"
