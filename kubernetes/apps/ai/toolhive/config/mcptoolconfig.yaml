---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
# forgejo: 103 -> repos/issues/PRs. No admin_*, org/team mgmt, repo delete/transfer.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: forgejo-tools
spec:
  toolsFilter:
    - add_issue_labels
    - create_branch
    - create_file
    - create_issue
    - create_issue_comment
    - create_pr_review
    - create_pull_request
    - edit_issue
    - edit_pull_request
    - get_authenticated_user
    - get_file_contents
    - get_issue
    - get_pr_diff
    - get_pull_request
    - get_repo
    - list_action_runners_jobs
    - list_branches
    - list_issue_comments
    - list_issues
    - list_labels
    - list_milestones
    - list_my_notifications
    - list_org_repos
    - list_pr_commits
    - list_pr_files
    - list_pr_reviews
    - list_pull_requests
    - list_releases
    - list_repo_commits
    - list_tags
    - mark_notifications_read
    - merge_pull_request
    - remove_issue_label
    - search_repos
    - update_file
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
# kubectl for both gateways: read and debug only (kubectl-mcp-server 2.0 names). Agents run
# with bypassPermissions, so no kubectl_generic and no write tools.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: kubectl-tools-readonly
spec:
  toolsFilter:
    - check_dns_resolution
    - check_pod_health
    - cilium_get_policy
    - cilium_get_status
    - cilium_list_endpoints
    - cilium_list_identities
    - cilium_list_nodes
    - cilium_list_policies
    - compare_namespaces
    - detect_ecosystem
    - detect_pending_pods
    - diagnose_network_connectivity
    - diagnose_pod_crash
    - get_api_resources
    - get_evicted_pods
    - get_hubble_flows
    - get_nodes_summary
    - health_check
    - helm_get
    - helm_history
    - helm_list
    - helm_status
    - kubectl_describe
    - kubectl_explain
    - kubectl_get
    - kubectl_logs
    - kubectl_top
    - node_logs
    - node_stats_summary
    - trace_service_chain
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
# flux for agents: read, diff and reconcile; no apply/delete/patch/suspend/install.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: flux-tools-readonly
spec:
  toolsFilter:
    - diff_kubernetes_manifest
    - get_flux_instance
    - get_kubernetes_api_versions
    - get_kubernetes_events
    - get_kubernetes_logs
    - get_kubernetes_metrics
    - get_kubernetes_resources
    - read_flux_doc
    - reconcile_flux_resource
    - search_flux_docs
    - trace_kubernetes_resource
