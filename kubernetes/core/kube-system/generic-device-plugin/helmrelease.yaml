---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: generic-device-plugin
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.1.3
  url: oci://ghcr.io/gabe565/charts/generic-device-plugin
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
  values:
    fullnameOverride: generic-device-plugin
    image:
      # renovate: datasource=docker depName=ghcr.io/squat/generic-device-plugin
      repository: ghcr.io/squat/generic-device-plugin
      pullPolicy: IfNotPresent
      # No semver upstream, so the digest is the real pin. Must be recent
      # enough to know --config, which the chart passes.
      tag: latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
    controller:
      type: daemonset
    # Privileged on purpose: it confines the privilege here so consumers get
    # /dev/fuse through the device-plugin API instead of running privileged.
    # hostPath alone is not enough — the device cgroup still denies open().
    securityContext:
      privileged: true
    env:
      DOMAIN: squat.ai
    # Only fuse; the chart default also scans serial/video/audio devices.
    config:
      enabled: true
      data: |
        devices:
          - name: fuse
            groups:
              - count: 10
                paths:
                  - path: /dev/fuse
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
