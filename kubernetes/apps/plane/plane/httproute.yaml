---
# yaml-language-server: $schema=https://schemas.vzkn.eu/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plane
  annotations:
    gatus.home-operations.com/endpoint: |-
      group: plane
spec:
  hostnames:
    - plane.vzkn.eu
  parentRefs:
    - name: envoy-internal
      namespace: network
  # Paths mirror the chart's Traefik rules; four frontends behind one host.
  rules:
    # nginx inside the admin/space images appends the trailing slash itself and
    # builds Location from its own listener -- http://host:3000/... Redirect
    # here so that 301 never happens. Exact wins over PathPrefix.
    - matches:
        - path:
            type: Exact
            value: /god-mode
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /god-mode/
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /spaces
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /spaces/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /god-mode
      backendRefs:
        - name: plane-admin
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /spaces
      backendRefs:
        - name: plane-space
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /live
      backendRefs:
        - name: plane-live
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: plane-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: plane-web
          port: 3000
