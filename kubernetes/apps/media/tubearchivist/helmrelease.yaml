---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tubearchivist
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    controllers:
      tubearchivist:
        # MIGRATION: stays 0 until /cache and the ES data are copied from aincrad
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/bbilly1/tubearchivist
              tag: v0.5.12@sha256:ba1c846ddd0c6fdd0f040727129d2466e03b7a0c26499223839d450c7586ac09
            env:
              TZ: Europe/Warsaw
              TA_HOST: https://tubearchivist.vzkn.eu
              TA_USERNAME: Vrozaksen
              ES_URL: http://tubearchivist-elasticsearch.media.svc.cluster.local:9200
              REDIS_CON: redis://tubearchivist-dragonfly.media.svc.cluster.local:6379
              # entrypoint runs as root (nginx, celery); files land as 1000:100
              HOST_UID: "1000"
              HOST_GID: "100"
              # YouTube breaks old yt-dlp fast; refresh it on every start
              TA_AUTO_UPDATE_YTDLP: release
            envFrom:
              - secretRef:
                  name: tubearchivist-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  # first start migrates the v0.4 ES indices
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
      elasticsearch:
        # MIGRATION: stays 0 until the ES data is copied from aincrad
        replicas: 0
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: mirror.gcr.io/library/elasticsearch
              tag: 8.19.23@sha256:8b1751877c984f3e4f59bafb15fc890e01969a744255fd5f6860c060b62cff36
            env:
              # ~1700 videos; TA's 1g default is sized for much bigger libraries
              ES_JAVA_OPTS: -Xms768m -Xmx768m
              discovery.type: single-node
              xpack.security.enabled: "true"
              xpack.ml.enabled: "false"
              path.repo: /usr/share/elasticsearch/data/snapshot
              ELASTIC_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tubearchivist-secret
                    key: ELASTIC_PASSWORD
            probes:
              liveness: &esprobes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &esport 9200
                  periodSeconds: 20
                  failureThreshold: 3
              readiness: *esprobes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *esport
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1280Mi
              limits:
                memory: 1792Mi
    service:
      app:
        controller: tubearchivist
        ports:
          http:
            port: *port
      elasticsearch:
        controller: elasticsearch
        ports:
          http:
            port: *esport
    route:
      app:
        annotations:
          # behind Kanidm OIDC: a probe would only ever see the IdP redirect
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.vzkn.eu"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      cache:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          tubearchivist:
            app:
              - path: /cache
      youtube:
        type: nfs
        server: aincrad.home.vzkn.eu
        path: /mnt/user/data/media/youtube
        advancedMounts:
          tubearchivist:
            app:
              - path: /youtube
      es-data:
        existingClaim: tubearchivist-es
        advancedMounts:
          elasticsearch:
            app:
              - path: /usr/share/elasticsearch/data
