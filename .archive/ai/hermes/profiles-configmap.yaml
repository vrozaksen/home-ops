---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-profiles
data:
  # Idempotent profile seeder, re-run on every pod start so git stays the source
  # of truth: config from the root profile, model + SOUL + memini namespace per
  # role, skills from agent-skills. No dollar-brace literals below: flux strict
  # substitution would swallow unescaped ones.
  seed.sh: |-
    #!/bin/sh
    set -eu

    export HERMES_HOME=/opt/data
    export HOME=/opt/data

    profiles_dir="$HERMES_HOME/profiles"
    archive_dir="$HERMES_HOME/profiles.archived"
    mkdir -p "$profiles_dir"

    python3 /tmp/hermes-profiles/patch-memini.py "$HERMES_HOME/plugins/memini/__init__.py"

    skills_src=/tmp/agent-skills
    rm -rf "$skills_src"
    if git clone -q --depth 1 "$SKILLS_REPO" "$skills_src"; then
      have_skills=1
    else
      echo "WARN: agent-skills clone failed; keeping the skills already present"
      have_skills=0
    fi

    setenv() {
      grep -v "^$2=" "$1" > "$1.new" || true
      printf '%s=%s\n' "$2" "$3" >> "$1.new"
      mv "$1.new" "$1"
    }

    served=""
    # seed <profile> <litellm model> <memini namespace> <agent-skills plugins>
    seed() {
      name="$1"
      model="$2"
      namespace="$3"
      plugins="$4"
      dir="$profiles_dir/$name"
      served="$served $name"

      if [ ! -d "$dir" ]; then
        echo "creating hermes profile: $name"
        hermes profile create "$name" --clone --no-alias
      fi

      # Root config wins; runtime edits inside a profile do not survive a restart.
      cp "$HERMES_HOME/config.yaml" "$dir/config.yaml"
      python3 /tmp/hermes-profiles/set-model.py "$dir/config.yaml" "$model"

      soul="/tmp/hermes-profiles/soul-$name.md"
      if [ -f "$soul" ]; then
        cp "$soul" "$dir/SOUL.md"
      fi

      # Per-profile .env is the multiplex secret scope (never os.environ): the
      # API server key and the memini scope must live here.
      env_file="$dir/.env"
      touch "$env_file"
      setenv "$env_file" API_SERVER_ENABLED true
      setenv "$env_file" API_SERVER_KEY "$API_SERVER_KEY"
      setenv "$env_file" MEMINI_NAMESPACE "$namespace"
      setenv "$env_file" MEMINI_HOME personal/vrozaksen
      chmod 600 "$env_file"

      if [ "$have_skills" = 1 ]; then
        for plugin in $plugins; do
          rm -rf "$dir/skills/agent-skills-$plugin"
          mkdir -p "$dir/skills/agent-skills-$plugin"
          cp -r "$skills_src/plugins/$plugin/skills/." "$dir/skills/agent-skills-$plugin/"
        done
      fi

      chown -R 1000:1000 "$dir"
    }

    # Vzkn.eu — Paperclip agents Apps, Deps, Watch (CEO/Review/SRE/SecOps run on Claude Max)
    seed apps         code-pool vzkn/home-ops/apps          "vzkn"
    seed deps         code-pool vzkn/home-ops/deps          "vzkn"
    seed watch        free-pool vzkn/home-ops/watch         "vzkn"
    # Omnichassis — Paperclip agents on Hermes (Chief/Firmware/OS/Security/Hardware run on Claude Max)
    seed verification code-pool omnichassis/verification    "vzkn omnichassis"
    seed platform     code-pool omnichassis/platform        "vzkn omnichassis"
    seed mechanical   code-pool omnichassis/mechanical      "vzkn omnichassis"
    seed procurement  free-pool omnichassis/procurement     "vzkn omnichassis"

    # Profiles dropped from the roster are archived, not deleted (sessions, state.db).
    for dir in "$profiles_dir"/*/; do
      name="$(basename "$dir")"
      case " $served " in
        *" $name "*) ;;
        *)
          echo "archiving hermes profile no longer in the roster: $name"
          mkdir -p "$archive_dir"
          rm -rf "$archive_dir/$name"
          mv "$dir" "$archive_dir/$name"
          ;;
      esac
    done

    echo "hermes profiles ready:$served"
  # The memini Hermes plugin reads only os.environ, but the multiplexed gateway
  # keeps each profile's .env in a per-request secret scope. Read the scope first.
  patch-memini.py: |-
    #!/usr/bin/env python3
    """Make the memini plugin honour the per-profile secret scope."""
    import sys

    path = sys.argv[1]
    marker = "# vzkn: profile secret scope"
    anchor = "    return os.environ.get(name, default).strip()\n"
    patch = (
        "    " + marker + "\n"
        "    try:\n"
        "        from agent.secret_scope import current_secret_scope\n"
        "        scope = current_secret_scope()\n"
        "        if scope and scope.get(name):\n"
        "            return scope[name].strip()\n"
        "    except Exception:\n"
        "        pass\n"
    )

    with open(path) as handle:
        source = handle.read()

    if marker in source:
        sys.exit(0)
    head, sep, tail = source.partition("def _env(name: str, default: str = \"\") -> str:\n")
    if not sep or not tail.startswith(anchor):
        # Fail loud: without the patch every profile silently shares one namespace.
        sys.exit("memini plugin _env() changed upstream; update patch-memini.py")

    with open(path, "w") as handle:
        handle.write(head + sep + patch + tail)
    print("patched memini plugin for per-profile scope")
  # The hermes image ships no pyyaml, so patch model.default by line instead
  # of parsing/round-tripping the whole document.
  set-model.py: |-
    #!/usr/bin/env python3
    """Set model.default in a Hermes profile config without a YAML dependency."""
    import sys

    path = sys.argv[1]
    model = sys.argv[2]

    with open(path) as handle:
        lines = handle.readlines()

    in_model = False
    updated = False

    for index, line in enumerate(lines):
        if not in_model:
            if line.startswith("model:"):
                in_model = True
            continue
        if line.strip() and not line[0].isspace():
            break
        if line.strip().startswith("default:") and not updated:
            indent = line[: len(line) - len(line.lstrip())]
            lines[index] = indent + "default: " + model + "\n"
            updated = True
            break

    if not updated:
        sys.exit("model.default not found in " + path)

    with open(path, "w") as handle:
        handle.writelines(lines)
  soul-apps.md: |-
    You deliver new applications and app changes into a Talos Kubernetes homelab run through GitOps with Flux. Follow the repo's existing patterns exactly: app-template HelmRelease with OCIRepository, components for databases, backups and auth, Gateway API routes, Infisical secrets, sorted and non-transitive dependsOn. Read two similar apps before writing a new one. Your output is a branch with the change plus a .txt file listing every secret the owner must create in Infisical and every manual step (OIDC client, UI clicks). Never commit to main or mutate the live cluster. If you are stuck on a platform problem (storage, networking, Ceph, Talos), stop and hand it to SRE with your evidence.
  soul-deps.md: |-
    You review dependency updates (Renovate PRs) for a GitOps homelab using the repo's pr-review procedure. For each PR: classify the bump, read the upstream changes, and ground every claim in this repo — which HelmReleases, CRDs, values and dependent apps are affected. Patch bumps get a merge recommendation; minor, major and feature bumps get a calibrated adopt/skip question for the owner. Be proportionate: flag real breaking changes, not theoretical ones. Summarize upstream notes in your own words and never paste them verbatim (it pings upstream authors). Platform majors (Talos, Kubernetes, Rook/Ceph, Cilium, Envoy, CNPG) go to SRE.
  soul-watch.md: |-
    You watch alerts and failing Flux reconciliations for a homelab. For every alert: deduplicate, look up whether memory already holds a matching incident or known false positive, check current state with read-only queries, and classify it as noise (propose a silence or a rule fix with reason), known issue (link it), or new problem (escalate to SRE with the evidence you gathered). You never change anything yourself. Be brief and factual; an alert you could not explain is escalated, not guessed at.
  soul-verification.md: |-
    You own verification for Omnichassis: SIL tests on virtual CAN (always through the repo's vcan namespace script), the HIL bench and its runner, CI pipelines and bench checks. A requirement is verified only when a test exercises it and fails without the change. Report results with exact commands, logs and evidence, never opinions. You do not flash hardware or run motors unless the task says so, and you identify every board by serial before touching it. Tools come from mise, never Nix.
  soul-platform.md: |-
    You are a full-stack engineer for the Omnichassis engineering platform: the fleet service (Go backend, dashboard, OTA, alerts) and the engineering tool built on the repo files (requirements, parameters and DIDs, CAN database). Security is part of the design, not a later step: Kanidm OIDC inside the app, mTLS for gateways, signing keys only in firmware CI, role-based access. Treat APIs and schemas as public contracts with migrations. ADRs and docs may land autonomously; application code is shown to the owner before it is committed. Verify with the repo's tests and real linters from mise.
  soul-mechanical.md: |-
    You design mechanical parts for Omnichassis as code with build123d: enclosures, mounts, the HIL bench box, printable brackets. The owner does not do CAD; they review renders and request changes in words, so every change must come with exported STEP/STL and preview renders. Design for 3D printing (wall thickness, overhangs, tolerances for fasteners and inserts) and state assumptions about printer and material. Designs are complete, never staged "v1" placeholders.
  soul-procurement.md: |-
    You prepare purchases for Omnichassis. From a BOM or an engineer's request, compare suppliers (TME, LCSC, Mouser, Botland, AliExpress and others) on price, stock, lead time and shipping to Poland, and propose equivalents when a part is unavailable. Output a ready-to-order basket with links, quantities and totals, and track it as a work item. You never place orders or enter payment details; the owner buys. Flag anything that does not match the electrical or mechanical spec it came from.
