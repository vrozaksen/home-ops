---
# yaml-language-server: $schema=https://schemas.vzkn.eu/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wazuh
spec:
  interval: 1h
  url: https://morgoved.github.io/wazuh-helm
---
# yaml-language-server: $schema=https://schemas.vzkn.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wazuh
spec:
  interval: 1h
  # The indexer migrates its data directory on start and OpenSearch refuses to
  # run on metadata written by a newer version. A remediated upgrade therefore
  # leaves it unstartable, so the window has to outlast the migration.
  timeout: 45m
  chart:
    spec:
      chart: wazuh
      version: 2.0.7
      sourceRef:
        kind: HelmRepository
        name: wazuh
  # The chart exposes no labels on this Service, and agents on the Servers VLAN
  # cannot reach a BGP-only LoadBalancer IP without it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: wazuh
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: wazuh
                labels:
                  home-ops.io/l2-announce: "true"
          # The dashboard renders wazuh.yml from envFrom at start, so a rotated
          # API password only reaches it on restart.
          - target:
              kind: Deployment
              name: wazuh-dashboard
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: wazuh-dashboard
                annotations:
                  reloader.stakater.com/auto: "true"
  values:
    # cert-manager already runs in the cluster, so only the Certificates are
    # wanted. With issuer.name unset the chart creates its own self-signed one.
    cert-manager:
      enabled: false
    certificates:
      enabled: true
      subject:
        organization: vzkn
        country: PL
        locality: Warsaw

    # Control planes have 12Gi soldered and already sit at 70-85%, so every
    # component is pinned away from them and prefers the 64Gi worker.
    indexer:
      # Chart appVersion is pinned at 4.14.3; upstream 4.14.x is at .7 and the
      # agent must never be newer than the manager. All three must match.
      images:
        # renovate: datasource=docker depName=wazuh/wazuh-indexer
        tag: 4.14.7
      replicas: 1
      cred:
        existingSecret: wazuh-credentials
      # The chart's policies assume replies are conntrack-exempt. With
      # kubeProxyReplacement + endpointRoutes the reply to a ClusterIP-DNATed
      # connection loses its conntrack association and is re-evaluated against
      # egress, which denies it -- Hubble shows the SYN,ACK dropped. Cluster-wide
      # Cilium policy governs this namespace instead.
      networkPolicy:
        enabled: false

      storageSize: 50Gi
      storageClass: ceph-block
      env:
        OPENSEARCH_JAVA_OPTS: -Xms4g -Xmx4g -Dlog4j2.formatMsgNoLookups=true
        CLUSTER_NAME: wazuh
        NETWORK_HOST: 0.0.0.0
        DISABLE_INSTALL_DEMO_CONFIG: "true"
      resources:
        requests:
          cpu: 500m
          memory: 6Gi
        limits:
          memory: 8Gi
      affinity: &workers
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "alfheim"

    wazuh:
      images:
        # renovate: datasource=docker depName=wazuh/wazuh-manager
        tag: 4.14.7
      apiCred:
        existingSecret: wazuh-credentials
      authd:
        enabled: true
        existingSecret: wazuh-credentials
      master:
        enabled: true
        # Nothing here reads a dashboard, so alerts have to leave the box. This
        # feeds the existing VictoriaLogs -> vmalert -> Pushover path rather
        # than adding a second notification channel. Level 7 keeps the noise
        # down; what actually pages is decided by the vmalert rule.
        extraConf: |
          <syslog_output>
            <server>10.10.0.92</server>
            <port>514</port>
            <format>json</format>
            <level>7</level>
          </syslog_output>
          <ruleset>
            <list>etc/lists/intel/abuseipdb</list>
          </ruleset>
        # The list has to be registered above and present on disk before the
        # manager starts: it compiles declared lists into .cdb at boot and there
        # is no makelists binary in this image, so a running manager will not
        # pick up a replacement. Hence an initContainer, not a sidecar -- the
        # list refreshes whenever the pod restarts.
        additionalVolumes:
          - name: intel-lists
            emptyDir: {}
        additionalVolumeMounts:
          - name: intel-lists
            mountPath: /var/ossec/etc/lists/intel
        networkPolicy:
          enabled: false
        # The chart ships only 1515 and 55000; agents also need 1514 to report
        # events. Exposed on the LAN for hosts that route through the router --
        # same-VLAN hosts must use the nodePort, since Cilium announces
        # LoadBalancer IPs over BGP only.
        service:
          type: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: 10.10.0.93
          ports:
            - name: agents
              protocol: TCP
              port: 1514
              targetPort: 1514
            - name: registration
              protocol: TCP
              port: 1515
              targetPort: 1515
            - name: api
              protocol: TCP
              port: 55000
              targetPort: 55000
        # Vulnerability Detection keeps a ~10Gi CVE database and stages another
        # full copy beside it while updating the feed, so 20Gi filled up and
        # wazuh-db started refusing writes.
        storageSize: 50Gi
        storageClass: ceph-block
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        affinity: *workers
      # Four agents do not need a manager cluster.
      worker:
        enabled: false

      # Populates the CDB list before the manager boots and compiles it. Fails
      # soft: intel-hub answers 503 until it holds a snapshot, and an empty list
      # would only cost enrichment -- never worth blocking the manager over.
      extraInitContainers:
        - name: fetch-intel-list
          image: docker.io/curlimages/curl:8.22.0
          command:
            - /bin/sh
            - -c
            - |
              curl -sSf --max-time 60 -o /lists/abuseipdb \
                http://intel-hub.security.svc.cluster.local:8080/abuseipdb \
                || echo "intel-hub unavailable, starting without the list"
              touch /lists/abuseipdb
          volumeMounts:
            - name: intel-lists
              mountPath: /lists
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}

      # Raises the level when a source already known for abuse shows up, so it
      # crosses the threshold the vmalert rule pages on. The edge already drops
      # these for inbound WAN traffic -- this catches what does not pass the
      # router, which is everything bifrost sees.
      localRules: |
        <group name="local,threat_intel,">
          <rule id="100200" level="12">
            <if_matched_sid>5710</if_matched_sid>
            <list field="srcip" lookup="address_match_key">etc/lists/intel/abuseipdb</list>
            <description>Connection attempt from an address on the AbuseIPDB blacklist</description>
          </rule>
        </group>

    # The bundled DaemonSet runs privileged with /proc, /sys, /etc and /boot from
    # the host, which PSA baseline rejects here. It would also see very little on
    # immutable Talos nodes, where Falco already covers runtime. This deployment
    # exists for the hosts outside the cluster.
    agent:
      enabled: false

    dashboard:
      images:
        # renovate: datasource=docker depName=wazuh/wazuh-dashboard
        tag: 4.14.7
      replicas: 1
      cred:
        existingSecret: wazuh-credentials
      # Kanidm provisions this Secret; the key names are set on its side to
      # match what the chart expects. Local admin stays as break-glass, since
      # Kanidm has wedged after Ceph events before.
      sso:
        oidc:
          enabled: true
          # Sets `challenge: false` on the OIDC auth domain -- the chart inverts
          # this. Left false, that domain answers every request with a 401
          # before the internal-user backend at order 4 is ever reached.
          primary: true
          existingSecret: kanidm-wazuh-oidc
          # The chart also asks for address and phone, which Kanidm does not
          # grant and so refuses the whole authorisation. `groups` is what
          # rolesKey below reads, and the default scope omits it.
          scope: openid profile email groups
          issuer: https://idm.vzkn.eu/oauth2/openid/wazuh
          url: https://idm.vzkn.eu/oauth2/openid/wazuh/.well-known/openid-configuration
          logoutUrl: https://idm.vzkn.eu/ui/logout
          baseRedirectUrl: https://wazuh.vzkn.eu
          config:
            subjectKey: preferred_username
            rolesKey: groups
          roleMappings:
            allAccess:
              # Kanidm returns groups as SPNs, not bare names.
              backendRoles:
                - "admins@idm.vzkn.eu"
          customizeLoginButton:
            enabled: true
            text: Log in with Kanidm
      networkPolicy:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      affinity: *workers
