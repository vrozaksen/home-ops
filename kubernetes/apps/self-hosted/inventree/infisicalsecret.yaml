---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Required keys in Infisical /kubernetes/self-hosted/inventree: INVENTREE_SECRET_KEY,
# INVENTREE_OIDC_PRIVATE_KEY, INVENTREE_ADMIN_USER, INVENTREE_ADMIN_PASSWORD, INVENTREE_ADMIN_EMAIL
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name inventree-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/self-hosted/inventree
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: self-hosted
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          # Signs sessions and encrypts stored plugin/SSO data; never rotate
          INVENTREE_SECRET_KEY: '{{ .INVENTREE_SECRET_KEY.Value }}'
          # Passed as a value so the image never writes a 0600 oidc.pem the kopiur mover cannot read
          INVENTREE_OIDC_PRIVATE_KEY: '{{ .INVENTREE_OIDC_PRIVATE_KEY.Value }}'
          INVENTREE_ADMIN_USER: '{{ .INVENTREE_ADMIN_USER.Value }}'
          INVENTREE_ADMIN_PASSWORD: '{{ .INVENTREE_ADMIN_PASSWORD.Value }}'
          INVENTREE_ADMIN_EMAIL: '{{ .INVENTREE_ADMIN_EMAIL.Value }}'
