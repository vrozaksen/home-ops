---
# Containerd mirror endpoints -> Harbor proxy cache projects.
# Spegel prepends its peer endpoint (127.0.0.1:29999) at runtime, so the
# effective resolution order is: peer -> Harbor proxy -> upstream.
# overridePath tells containerd to use the endpoint path verbatim.
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: https://registry.vzkn.eu/v2/proxy-dockerhub
    overridePath: true
---
