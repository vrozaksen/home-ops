---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Push token and cache signing key, consumed by forge. The Infisical path still
# says tekton because that is where the values live; the Tasks are archived.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: attic-secrets
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/development/tekton/attic
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: attic-push-secret
      secretNamespace: development
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          ATTIC_TOKEN: '{{ .ATTIC_TOKEN.Value }}'
    - secretName: attic-cache-public-key
      secretNamespace: development
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          ATTIC_CACHE_PUBLIC_KEY: '{{ .ATTIC_CACHE_PUBLIC_KEY.Value }}'
