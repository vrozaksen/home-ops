---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Mounted as files, never env: the daemon's env is inherited by every agent run.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name multica-agent-secret
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/multica-agent
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          # PAT "daemon-cluster" (owner account; revoke in Settings > API Tokens)
          multica-token: '{{ .MULTICA_TOKEN.Value }}'
          memini-token: '{{ .MEMINI_API_KEY.Value }}'
          mcp-agents-api-key: '{{ .MCP_AGENTS_API_KEY.Value }}'
          forgejo-bot-token: '{{ .FORGEJO_BOT_TOKEN.Value }}'
          github-app-key.pem: '{{ .GITHUB_APP_PRIVATE_KEY.Value }}'
