---
# Keys to create in Infisical: see README.md
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: plane-secrets
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/plane/plane
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    # Pinned, not CNPG-generated: the same value goes into DATABASE_URL below.
    - secretName: plane-pgdb
      secretNamespace: ${NS}
      secretType: kubernetes.io/basic-auth
      template:
        includeAllSecrets: false
        data:
          username: plane
          password: '{{ .PLANE_DB_PASSWORD.Value }}'

    # Same password as AMQP_URL below.
    - secretName: plane-rabbitmq
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          RABBITMQ_DEFAULT_USER: plane
          RABBITMQ_DEFAULT_PASS: '{{ .PLANE_RABBITMQ_PASSWORD.Value }}'

    - secretName: plane-app-keys
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          SECRET_KEY: '{{ .PLANE_SECRET_KEY.Value }}'
          LIVE_SERVER_SECRET_KEY: '{{ .PLANE_LIVE_SERVER_SECRET_KEY.Value }}'

    - secretName: plane-app-env
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          SECRET_KEY: '{{ .PLANE_SECRET_KEY.Value }}'
          LIVE_SERVER_SECRET_KEY: '{{ .PLANE_LIVE_SERVER_SECRET_KEY.Value }}'
          DATABASE_URL: 'postgresql://plane:{{ .PLANE_DB_PASSWORD.Value }}@pooler-plane-rw.plane.svc.cluster.local:5432/plane'
          REDIS_URL: 'redis://plane-dragonfly.plane.svc.cluster.local:6379/0'
          AMQP_URL: 'amqp://plane:{{ .PLANE_RABBITMQ_PASSWORD.Value }}@plane-rabbitmq.plane.svc.cluster.local/'
          WEB_URL: 'https://plane.vzkn.eu'
          CORS_ALLOWED_ORIGINS: 'https://plane.vzkn.eu'
          MINIO_ENDPOINT_SSL: "1"
          API_KEY_RATE_LIMIT: 60/minute
          GUNICORN_WORKERS: "1"
          DOCKERIZED: "1"
          DEBUG: "0"
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: ""

    - secretName: plane-live-env
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          LIVE_SERVER_SECRET_KEY: '{{ .PLANE_LIVE_SERVER_SECRET_KEY.Value }}'
          REDIS_URL: 'redis://plane-dragonfly.plane.svc.cluster.local:6379/0'
          API_BASE_URL: 'http://plane-api.plane.svc.cluster.local:8000'
          LIVE_BASE_PATH: /live

    # USE_MINIO=0 makes Plane treat Garage as plain S3 via AWS_S3_ENDPOINT_URL.
    - secretName: plane-doc-store
      secretNamespace: ${NS}
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          USE_MINIO: "0"
          FILE_SIZE_LIMIT: "5242880"
          AWS_REGION: garage
          AWS_S3_ENDPOINT_URL: https://api.s3.vzkn.eu
          AWS_ACCESS_KEY_ID: '{{ .PLANE_ACCESS_KEY_ID.Value }}'
          AWS_SECRET_ACCESS_KEY: '{{ .PLANE_SECRET_ACCESS_KEY.Value }}'
