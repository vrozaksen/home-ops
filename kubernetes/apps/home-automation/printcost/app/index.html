<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wycena druku</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6b66; --line: #dddcd6;
    --accent: #2f6f5e; --accent-fg: #ffffff; --warn: #a3471f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --fg: #ecebe6; --muted: #9a9a93; --line: #34342f;
            --accent: #5fb39c; --accent-fg: #0d1a16; --warn: #e08a63; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center;
          color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .price { font-size: 34px; font-weight: 700; margin: 4px 0 8px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .row span:first-child { color: var(--muted); }
  .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; font-weight: 600; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer;
           background: var(--accent); color: var(--accent-fg); }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 560px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Wycena druku</h1>
  <p class="sub">Wrzuć pocięty plik z Orki (.gcode, Qidi Q2) albo wpisz gramy i czas ręcznie.</p>

  <div class="card">
    <div id="drop" class="drop">Upuść plik .gcode tutaj albo kliknij, żeby wybrać
      <input id="file" type="file" accept=".gcode" hidden>
    </div>
    <p id="fileinfo" class="muted" style="margin:10px 0 0"></p>
  </div>

  <div class="card">
    <h2>Wydruk</h2>
    <div class="grid">
      <label>Drukarka <select id="printer"></select></label>
      <label>Czas druku [h] <input id="hours" type="number" min="0" step="0.01" value="0"></label>
      <label>Ilość (płyt / sztuk) <input id="qty" type="number" min="1" step="1" value="1"></label>
      <label>Obróbka [min] <input id="postMin" type="number" min="0" step="1" value="0"></label>
    </div>
    <table style="margin-top:14px">
      <thead><tr><th>#</th><th>Materiał</th><th>Szpula (cena ze Spoolmana)</th><th class="num">Gramy</th><th class="num">zł/kg</th></tr></thead>
      <tbody id="fils"></tbody>
    </table>
    <div class="actions">
      <button class="ghost" id="addFil">+ filament</button>
    </div>
    <p id="spoolinfo" class="muted" style="margin:8px 0 0"></p>
  </div>

  <div class="quotes" id="quotes"></div>

  <div class="card">
    <details>
      <summary>Stawki (domyślne z config.json, zmiany tylko dla tej wyceny)</summary>
      <div class="grid" style="margin-top:12px" id="rates"></div>
    </details>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let cfg, spools = [];
const state = { fils: [] };

const money = (v) => v.toLocaleString("pl-PL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + cfg.currency;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function spoolPricePerKg(s) {
  const w = s.initial_weight || s.filament.weight || 1000;
  if (s.price) return (s.price / w) * 1000;
  if (s.filament.price) return (s.filament.price / (s.filament.weight || 1000)) * 1000;
  return null;
}
function spoolLabel(s) {
  const f = s.filament;
  const p = spoolPricePerKg(s);
  return `#${s.id} ${f.vendor ? f.vendor.name + " " : ""}${f.name} ${f.material}` +
         ` (${Math.round(s.remaining_weight || 0)} g${p ? ", " + p.toFixed(0) + " zł/kg" : ""})`;
}
function bestSpool(material) {
  const m = (material || "").toUpperCase();
  const cands = spools.filter((s) => (s.filament.material || "").toUpperCase() === m && spoolPricePerKg(s));
  cands.sort((a, b) => (b.remaining_weight || 0) - (a.remaining_weight || 0));
  return cands[0] || null;
}

function parseDuration(s) {
  let h = 0;
  for (const [, n, u] of s.matchAll(/(\d+)\s*([dhms])/g)) h += +n * { d: 24, h: 1, m: 1 / 60, s: 1 / 3600 }[u];
  return h;
}
async function readGcode(file) {
  // Orca writes the summary near the top and the config block at the end; skip the toolpath
  const head = await file.slice(0, 256 * 1024).text();
  const tail = await file.slice(Math.max(0, file.size - 1024 * 1024)).text();
  const text = head + "\n" + tail;
  const get = (re) => { const m = text.match(re); return m ? m[1].trim() : null; };
  const grams = (get(/^; filament used \[g\] = (.+)$/m) || "").split(",").map((x) => parseFloat(x)).filter((x) => !isNaN(x));
  const types = (get(/^; filament_type = (.+)$/m) || "").split(";").map((x) => x.trim());
  const time = get(/^; estimated printing time \(normal mode\) = (.+)$/m) || get(/^; total estimated time: (.+)$/m);
  return { grams, types, hours: time ? parseDuration(time) : 0, printer: get(/^; printer_model = (.+)$/m), time };
}

async function onFile(file) {
  const g = await readGcode(file);
  if (!g.grams.length) { $("fileinfo").innerHTML = `<span class="warn">Nie znalazłem zużycia filamentu w ${esc(file.name)}. To na pewno gcode z Orki?</span>`; return; }
  state.fils = g.grams.map((grams, i) => {
    const material = g.types[i] || g.types[0] || "";
    const s = bestSpool(material);
    return { grams, material, spoolId: s ? s.id : "", pricePerKg: s ? spoolPricePerKg(s) : 0 };
  }).filter((f) => f.grams > 0);
  $("hours").value = g.hours.toFixed(2);
  if (g.printer && cfg.printers[g.printer]) $("printer").value = g.printer;
  const warn = g.printer && !cfg.printers[g.printer] ? ` <span class="warn">Drukarka „${esc(g.printer)}” nie jest w config.json, liczę stawkami wybranej.</span>` : "";
  $("fileinfo").innerHTML = `${esc(file.name)}: ${esc(g.printer || "?")}, ${esc(g.time || "?")}, ${g.grams.reduce((a, b) => a + b, 0).toFixed(1)} g${warn}`;
  renderFils(); recalc();
}

function renderFils() {
  const opts = (sel) => `<option value="">— ręcznie —</option>` + spools.map((s) =>
    `<option value="${s.id}"${String(s.id) === String(sel) ? " selected" : ""}>${esc(spoolLabel(s))}</option>`).join("");
  $("fils").innerHTML = state.fils.map((f, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><input data-i="${i}" data-k="material" value="${esc(f.material)}" style="max-width:90px"></td>
      <td><select data-i="${i}" data-k="spoolId">${opts(f.spoolId)}</select></td>
      <td class="num"><input data-i="${i}" data-k="grams" type="number" min="0" step="0.1" value="${f.grams}" style="max-width:90px;text-align:right"></td>
      <td class="num"><input data-i="${i}" data-k="pricePerKg" type="number" min="0" step="0.5" value="${(+f.pricePerKg).toFixed(2)}" style="max-width:90px;text-align:right"></td>
    </tr>`).join("");
}
$("fils").addEventListener("change", (e) => {
  const { i, k } = e.target.dataset; if (i === undefined) return;
  const f = state.fils[+i];
  if (k === "spoolId") {
    f.spoolId = e.target.value;
    const s = spools.find((x) => String(x.id) === f.spoolId);
    if (s) { f.pricePerKg = spoolPricePerKg(s) || 0; f.material = s.filament.material || f.material; }
    renderFils();
  } else f[k] = k === "material" ? e.target.value : parseFloat(e.target.value) || 0;
  recalc();
});
$("addFil").onclick = () => { const s = bestSpool("PLA"); state.fils.push({ grams: 0, material: "PLA", spoolId: s ? s.id : "", pricePerKg: s ? spoolPricePerKg(s) : 0 }); renderFils(); recalc(); };

const RATE_FIELDS = [
  ["energyPricePerKwh", "Prąd [zł/kWh]"], ["failureBufferPct", "Ryzyko nieudanego wydruku [%]"],
  ["postProcessingPerMinute", "Obróbka [zł/min]"],
];
function renderRates() {
  const p = cfg.printers[$("printer").value];
  let html = RATE_FIELDS.map(([k, l]) => `<label>${l}<input data-r="${k}" type="number" step="0.01" value="${cfg[k]}"></label>`).join("");
  html += `<label>Pobór drukarki [kWh/h]<input data-p="kwhPerHour" type="number" step="0.01" value="${p.kwhPerHour}"></label>`;
  html += `<label>Zużycie drukarki [zł/h]<input data-p="wearPerHour" type="number" step="0.05" value="${p.wearPerHour}"></label>`;
  for (const [id, pr] of Object.entries(cfg.profiles)) {
    html += `<label>${pr.label}: marża [%]<input data-pr="${id}" data-k="markupPct" type="number" step="1" value="${pr.markupPct}"></label>`;
    html += `<label>${pr.label}: obsługa zlecenia [zł]<input data-pr="${id}" data-k="handlingFee" type="number" step="1" value="${pr.handlingFee}"></label>`;
    html += `<label>${pr.label}: minimum [zł]<input data-pr="${id}" data-k="minimum" type="number" step="1" value="${pr.minimum}"></label>`;
    html += `<label>${pr.label}: liczyć obróbkę<select data-pr="${id}" data-k="chargeLabor"><option value="1"${pr.chargeLabor ? " selected" : ""}>tak</option><option value="0"${pr.chargeLabor ? "" : " selected"}>nie</option></select></label>`;
  }
  $("rates").innerHTML = html;
}
$("rates").addEventListener("change", (e) => {
  const t = e.target, v = parseFloat(t.value) || 0;
  if (t.dataset.r) cfg[t.dataset.r] = v;
  else if (t.dataset.p) cfg.printers[$("printer").value][t.dataset.p] = v;
  else if (t.dataset.pr) cfg.profiles[t.dataset.pr][t.dataset.k] = t.dataset.k === "chargeLabor" ? t.value === "1" : v;
  recalc();
});

function quote(profile) {
  const p = cfg.printers[$("printer").value];
  const hours = parseFloat($("hours").value) || 0;
  const qty = Math.max(1, parseInt($("qty").value) || 1);
  const minutes = parseFloat($("postMin").value) || 0;
  const material = state.fils.reduce((a, f) => a + (f.grams * f.pricePerKg) / 1000, 0) * qty;
  const energy = hours * p.kwhPerHour * cfg.energyPricePerKwh * qty;
  const wear = hours * p.wearPerHour * qty;
  const buffer = (material + energy + wear) * cfg.failureBufferPct / 100;
  const cost = material + energy + wear + buffer;
  const labor = profile.chargeLabor ? minutes * cfg.postProcessingPerMinute : 0;
  const handling = profile.handlingFee;
  const net = cost + labor + handling;
  const markup = net * profile.markupPct / 100;
  let price = net + markup;
  const minApplied = price < profile.minimum;
  if (minApplied) price = profile.minimum;
  const step = profile.roundTo || 1;
  price = Math.max(0, Math.ceil(price / step - 1e-9) * step);
  return { material, energy, wear, buffer, cost, labor, handling, markup, price, minApplied, qty, hours };
}

function recalc() {
  const out = [];
  for (const [id, pr] of Object.entries(cfg.profiles)) {
    const q = quote(pr);
    const rows = [
      ["Filament", q.material], ["Prąd", q.energy], ["Zużycie drukarki", q.wear],
      [`Ryzyko (${cfg.failureBufferPct}%)`, q.buffer],
    ];
    if (q.handling) rows.push(["Obsługa zlecenia", q.handling]);
    if (q.labor) rows.push(["Obróbka", q.labor]);
    rows.push([`Marża (${pr.markupPct}%)`, q.markup]);
    out.push(`<div class="card">
      <h2>${esc(pr.label)}</h2>
      <div class="price">${money(q.price)}</div>
      ${rows.map(([l, v]) => `<div class="row"><span>${l}</span><span>${money(v)}</span></div>`).join("")}
      <div class="row total"><span>Koszt własny</span><span>${money(q.cost)}</span></div>
      ${q.minApplied ? `<p class="muted" style="margin:6px 0 0">Podniesione do minimum ${money(pr.minimum)}.</p>` : ""}
      <div class="actions"><button data-copy="${id}">Kopiuj wycenę</button></div>
    </div>`);
  }
  $("quotes").innerHTML = out.join("");
}
$("quotes").addEventListener("click", async (e) => {
  const id = e.target.dataset.copy; if (!id) return;
  const pr = cfg.profiles[id], q = quote(pr);
  const grams = state.fils.reduce((a, f) => a + f.grams, 0) * q.qty;
  const mats = [...new Set(state.fils.map((f) => f.material).filter(Boolean))].join(" + ");
  const lines = [
    `Wycena druku 3D${q.qty > 1 ? ` (${q.qty} szt.)` : ""}`,
    `Materiał: ${mats || "?"}, ${grams.toFixed(0)} g, czas druku ok. ${(q.hours * q.qty).toFixed(1)} h`,
    `Filament ${money(q.material)}, prąd i maszyna ${money(q.energy + q.wear + q.buffer)}` +
      (q.handling + q.labor ? `, robota ${money(q.handling + q.labor)}` : ""),
    `Cena: ${money(q.price)}`,
  ];
  try { await navigator.clipboard.writeText(lines.join("\n")); e.target.textContent = "Skopiowane"; }
  catch { e.target.textContent = "Brak dostępu do schowka"; }
  setTimeout(() => (e.target.textContent = "Kopiuj wycenę"), 1500);
});

for (const id of ["hours", "qty", "postMin"]) $(id).addEventListener("input", recalc);
$("printer").addEventListener("change", () => { renderRates(); recalc(); });
const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && onFile(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && onFile(e.dataTransfer.files[0]); };

(async () => {
  cfg = await (await fetch("config.json", { cache: "no-store" })).json();
  $("printer").innerHTML = Object.keys(cfg.printers).map((n) => `<option>${esc(n)}</option>`).join("");
  try {
    const r = await fetch("api/spoolman/api/v1/spool?allow_archived=false");
    spools = (await r.json()).filter((s) => (s.remaining_weight || 0) > 0);
    $("spoolinfo").textContent = `Spoolman: ${spools.length} aktywnych szpul.`;
  } catch {
    $("spoolinfo").innerHTML = `<span class="warn">Spoolman niedostępny, wpisz ceny ręcznie.</span>`;
  }
  const s = bestSpool("ASA") || bestSpool("PLA");
  state.fils = [{ grams: 0, material: s ? s.filament.material : "PLA", spoolId: s ? s.id : "", pricePerKg: s ? spoolPricePerKg(s) : 0 }];
  renderRates(); renderFils(); recalc();
})();
</script>
</body>
</html>
