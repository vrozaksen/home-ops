---
# Kyoo metadata lives on aincrad (like emby-meta in doco-cd): dedicated folders
# under /mnt/cache/kyoo-meta/ that are cheap to inspect and nuke. Statically
# bound PV/PVC pairs via csi-driver-nfs; capacities are nominal on NFS.
# Transcode HLS cache stays an emptyDir on the node (NFS would hurt there).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kyoo-meta-api
spec:
  accessModes:
    - "ReadWriteMany"
  capacity:
    storage: 5Gi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: aincrad-kyoo-meta-api
    volumeAttributes:
      server: aincrad.home.vzkn.eu
      share: /mnt/cache/kyoo-meta/api
  mountOptions:
    - "nfsvers=4.1"
    - "noatime"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kyoo-meta-api
spec:
  accessModes:
    - "ReadWriteMany"
  storageClassName: ""
  volumeName: kyoo-meta-api
  resources:
    requests:
      storage: 5Gi
