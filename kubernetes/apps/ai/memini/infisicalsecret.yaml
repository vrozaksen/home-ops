---
# yaml-language-server: $schema=https://schemas.vzkn.eu/secrets.infisical.com/infisicalsecret_v1alpha1.json
# Required keys in Infisical /kubernetes/ai/memini:
#   MEMINI_API_KEY    — admin/break-glass credential
#   HERMES_MEMINI_KEY — per-agent key for the Hermes memini plugin
# LiteLLM key comes from operator Secret litellm-key-memini-llm (not Infisical).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: &name memini
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: vzkn-eu-v2-zn
        envSlug: prod
        secretsPath: /kubernetes/ai/memini
      credentialsRef:
        secretName: infisical-credentials
        secretNamespace: security
  managedKubeSecretReferences:
    - secretName: *name
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          MEMINI_API_KEY: '{{ .MEMINI_API_KEY.Value }}'
    # Declarative per-agent keys mounted via persistence.api-keys (MEMINI_API_KEYS_FILE).
    - secretName: memini-api-keys
      secretNamespace: ai
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          api-keys.yaml: |-
            keys:
              - name: hermes
                secret: '{{ .HERMES_MEMINI_KEY.Value }}'
                default_namespace: hermes
