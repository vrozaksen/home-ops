---
# yaml-language-server: $schema=https://schemas.vzkn.eu/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bambuddy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bambuddy
      app.kubernetes.io/instance: bambuddy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Virtual printer: a slicer "Send" speaks the printer protocol — MQTT for
    # control, FTPS plus a passive data range for the plate itself. Reachable
    # from the in-cluster OrcaSlicer and from desktop slicers on the LAN.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: orcaslicer
      toPorts: &vpPorts
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "3002"
              protocol: TCP
            - port: "990"
              protocol: TCP
            - port: "6000"
              protocol: TCP
            - port: "8883"
              protocol: TCP
            - port: "50000"
              endPort: 50009
              protocol: TCP
            - port: "2021"
              protocol: UDP
    # Desktop slicers on the clients VLAN
    - fromCIDR:
        - 10.100.0.0/24
      toPorts: *vpPorts
