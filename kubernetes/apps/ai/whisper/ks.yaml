---
# yaml-language-server: $schema=https://schemas.vzkn.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app whisper
spec:
  # Shared transcription for MinusPod (OpenAI API, port 8765) and Bazarr
  # (whisper-asr-webservice API via the shim, port 9000).
  #
  # The iGPU claim is a bet, not a certainty. UHD 630 is Coffee Lake / Gen9,
  # which Intel moved to `legacy1` compute-runtime packages, so OpenVINO and
  # SYCL are both out and Vulkan (Mesa ANV) is the only path left -- and on
  # Intel iGPUs Vulkan has measured *slower* than the CPU backend. Benchmark
  # before trusting it:
  #   kubectl exec deploy/whisper -c app -- \
  #     whisper-bench -m /models/ggml-large-v3-turbo-q5_0.bin
  #   kubectl exec deploy/whisper -c app -- \
  #     whisper-bench -m /models/ggml-large-v3-turbo-q5_0.bin -ng
  # If -ng (no GPU) wins, add --no-gpu to the server args and drop the claim.
  components:
    - ../../../components/gpu
  interval: 1h
  path: ./kubernetes/apps/ai/whisper
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
