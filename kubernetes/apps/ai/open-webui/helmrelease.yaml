---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
              repository: ghcr.io/open-webui/open-webui
              tag: 0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901
            # Most of these are PersistentConfig; with it off the env always wins
            # (config lives here, admin-panel edits do not survive a restart).
            env:
              TZ: Europe/Warsaw
              ENABLE_PERSISTENT_CONFIG: "false"
              WEBUI_URL: https://chat.vzkn.eu
              HF_HOME: /app/backend/data/cache/hf
              ENABLE_OLLAMA_API: "false"
              # names/icons/descriptions per alias live in the Open WebUI DB (admin import)
              DEFAULT_MODELS: assistant
              # Chat: LiteLLM aliases (local Qwen on ragnarok first, API fallback)
              OPENAI_API_BASE_URL: &litellm http://litellm.ai.svc.cluster.local:4000/v1
              OPENAI_API_KEY: &key
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # RAG embeddings via the LiteLLM `embed` alias (TEI), no local model download
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: embed
              RAG_OPENAI_API_BASE_URL: *litellm
              RAG_OPENAI_API_KEY: *key
              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.self-hosted.svc.cluster.local:8080/search?q=<query>
              # Images: ComfyUI on ragnarok (nix-config modules/services/comfyui.nix),
              # Krea-2 Turbo fp8 (8 steps, ~15 s warm), workflow in resources/comfyui-workflow.json
              ENABLE_IMAGE_GENERATION: "true"
              IMAGE_GENERATION_ENGINE: comfyui
              COMFYUI_BASE_URL: http://10.100.0.102:8188
              COMFYUI_WORKFLOW:
                valueFrom:
                  configMapKeyRef:
                    name: open-webui-comfyui
                    key: comfyui-workflow.json
              COMFYUI_WORKFLOW_NODES: >-
                [{"type":"prompt","key":"text","node_ids":["4"]},
                {"type":"model","key":"unet_name","node_ids":["1"]},
                {"type":"width","key":"width","node_ids":["6"]},
                {"type":"height","key":"height","node_ids":["6"]},
                {"type":"n","key":"batch_size","node_ids":["6"]},
                {"type":"seed","key":"seed","node_ids":["7"]}]
              IMAGE_GENERATION_MODEL: krea2_turbo_fp8_scaled.safetensors
              IMAGE_SIZE: 1024x1024
              # Login: Kanidm only (no local accounts)
              ENABLE_LOGIN_FORM: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Kanidm
              OPENID_PROVIDER_URL: https://idm.vzkn.eu/oauth2/openid/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.vzkn.eu/oauth/oidc/login/callback
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OAUTH_SCOPES: openid email profile groups
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-open-webui-oidc
                    key: client-id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-open-webui-oidc
                    key: client-secret
              # Kanidm groups claim carries SPNs
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: groups
              OAUTH_ALLOWED_ROLES: users@idm.vzkn.eu,admins@idm.vzkn.eu
              OAUTH_ADMIN_ROLES: admins@idm.vzkn.eu
            envFrom:
              - secretRef:
                  name: open-webui
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              # On start it re-copies branding into open_webui/static and logs
              # "Read-only file system" for each file; the files already ship in the
              # image, the UI is unaffected.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: ai
        hostnames:
          - chat.vzkn.eu
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # webui.db (SQLite), uploads/, vector_db/, cache/
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
