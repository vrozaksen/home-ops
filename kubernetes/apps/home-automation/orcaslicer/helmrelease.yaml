---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orcaslicer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      orcaslicer:
        containers:
          app:
            image:
              repository: registry.vzkn.eu/containers/orcaslicer-web
              tag: 2.4.2
            env:
              GEOMETRY: 1920x1080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &httpPort 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: orcaslicer
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *httpPort
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: home-automation
        hostnames:
          - orcaslicer.vzkn.eu
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      # OrcaSlicer config, profiles and the Bambu network plugin live in HOME
      config:
        existingClaim: orcaslicer
        globalMounts:
          - path: /config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
